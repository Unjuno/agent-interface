<!doctype html><meta charset="utf-8"><title>Commit guard laboratory</title>
<style>
body{margin:0;background:#eee;font:16px sans-serif}#marker{position:fixed;left:0;top:0;width:4px;height:4px;background:rgb(250,0,250)}
section{position:absolute;left:40px;top:60px;width:700px;height:460px;border:1px solid #999}button{position:fixed;width:70px;height:36px;border:0;background:rgb(35,190,120);color:#111}#veil{position:fixed;background:#999;z-index:10}
</style><div id="marker"></div><section role="region" aria-label="Workspace" id="scope"></section>
<script>
let business = new WeakMap(), events = [], currentTarget, px, py;
function button(parent,label,x,y,meaning){const b=document.createElement('button');b.setAttribute('aria-label',label);b.textContent=label;b.style.left=x+'px';b.style.top=y+'px';parent.append(b);business.set(b,meaning);return b;}
window.setup = function(seed){document.querySelectorAll('button,#veil,[data-extra]').forEach(e=>e.remove());events=[];business=new WeakMap();px=120+(seed%13)*4;py=180+(seed%7)*5;currentTarget=button(document.getElementById('scope'),'Target',px,py,'target');};
window.change = function(kind){const s=document.getElementById('scope');
 if(kind==='none')return;
 if(kind==='move'){currentTarget.style.left=(px+190)+'px';return;}
 if(kind==='replace'){currentTarget.remove();currentTarget=button(s,'Target',px,py,'wrong');return;}
 if(kind==='rename'){currentTarget.setAttribute('aria-label','Cancel');currentTarget.textContent='Cancel';business.set(currentTarget,'wrong');return;}
 if(kind==='disable'){currentTarget.disabled=true;return;}
 if(kind==='hide'){currentTarget.style.display='none';return;}
 if(kind==='overlay'){let v=document.createElement('div');v.id='veil';v.style.cssText=`left:${px-2}px;top:${py-2}px;width:74px;height:40px`;business.set(v,'wrong');document.body.append(v);return;}
 if(kind==='duplicate'){button(s,'Target',px+200,py,'wrong');return;}
 if(kind==='other_scope'){let q=document.createElement('section');q.dataset.extra='1';q.setAttribute('role','region');q.setAttribute('aria-label','Other workspace');q.style.border='none';q.style.pointerEvents='none';document.body.append(q);let b=button(q,'Target',px+350,py+200,'wrong');b.style.pointerEvents='auto';return;}
 if(kind==='scope_replace'){let q=s.cloneNode(false);s.replaceWith(q);currentTarget.remove();currentTarget=button(q,'Target',px,py,'wrong');return;}
 if(kind==='semantic_swap'){business.set(currentTarget,'wrong');return;}
 if(kind==='child'){currentTarget.textContent='';let t=document.createElement('span');t.textContent='Target';currentTarget.append(t);return;}
 throw Error('unknown fixture transition '+kind);
};
// Scoring follows the business identity set by the harness. The guard never reads it.
document.addEventListener('click',e=>{let n=e.target;while(n&&!business.has(n))n=n.parentElement;events.push({hit:n?business.get(n):'background',trusted:e.isTrusted,x:e.clientX,y:e.clientY,time_ms:performance.now()});},true);
window.readScores=()=>events.slice();
</script>
