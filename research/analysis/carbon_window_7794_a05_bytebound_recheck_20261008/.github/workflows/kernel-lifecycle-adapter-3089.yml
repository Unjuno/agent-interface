name: kernel-lifecycle-adapter-3089
on:
  pull_request:
    paths:
      - "research/integration/kernel_lifecycle_adapter_successor_2333_v2/**"
      - ".github/workflows/kernel-lifecycle-adapter-3089.yml"
  push:
    paths:
      - "research/integration/kernel_lifecycle_adapter_successor_2333_v2/**"
      - ".github/workflows/kernel-lifecycle-adapter-3089.yml"
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: native kernel lifecycle audit
        run: python3 research/integration/kernel_lifecycle_adapter_successor_2333_v2/audit.py
      - name: pinned container kernel lifecycle audit
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/research/integration/kernel_lifecycle_adapter_successor_2333_v2 python:3.12-slim             sh -c "apt-get update -qq && apt-get install -y -qq git >/dev/null && python audit.py"
      - name: syntax and JSON audit
        run: |
          python3 -m py_compile research/integration/kernel_lifecycle_adapter_successor_2333_v2/run.py
          python3 -m py_compile research/integration/kernel_lifecycle_adapter_successor_2333_v2/audit.py
          python3 -m json.tool research/integration/kernel_lifecycle_adapter_successor_2333_v2/SOURCE_MANIFEST.json >/dev/null
