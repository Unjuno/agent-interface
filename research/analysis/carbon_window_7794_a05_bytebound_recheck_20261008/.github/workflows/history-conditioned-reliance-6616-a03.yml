name: History-Conditioned Reliance #6616 A03

on:
  pull_request:
    paths:
      - 'research/analysis/history_conditioned_reliance_6616_t0_a03_orbstack_20261003/**'
      - '.github/workflows/history-conditioned-reliance-6616-a03.yml'
  push:
    branches:
      - main
    paths:
      - 'research/analysis/history_conditioned_reliance_6616_t0_a03_orbstack_20261003/**'
      - '.github/workflows/history-conditioned-reliance-6616-a03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a03-construction-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retained allocation hashes
        working-directory: research/analysis/history_conditioned_reliance_6616_t0_a03_orbstack_20261003
        run: sha256sum --check SHA256SUMS
      - name: Test A03 stimulus and audit contract
        run: python -B -m unittest discover -s research/analysis/history_conditioned_reliance_6616_t0_a03_orbstack_20261003 -p 'test_*.py' -v
      - name: Check analysis result index
        run: python research/analysis/check_index.py
