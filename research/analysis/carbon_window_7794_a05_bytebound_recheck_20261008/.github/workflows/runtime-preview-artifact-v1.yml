name: Runtime preview artifact v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-preview-artifact-v1.yml'

permissions:
  contents: read

concurrency:
  group: runtime-preview-artifact-v1
  cancel-in-progress: false

jobs:
  package-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen golden dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r runtime/requirements-golden.txt

      - name: Audit retained golden benchmark before packaging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-preview-v1/evidence
          python runtime/golden_desktop_demo_v3.py audit-retained \
            | tee runtime-preview-v1/evidence/audit-retained.json
          python release/golden_artifact_closure_v1/check_golden_artifact_closure.py . \
            --out runtime-preview-v1/evidence/source-closure.json

      - name: Build full tracked runtime-preview source archive
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          git archive --format=tar.gz --prefix=agent-interface-runtime-preview/ \
            -o runtime-preview-v1/agent-interface-runtime-preview-${commit:0:8}.tar.gz HEAD
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,tarfile
          root=pathlib.Path('runtime-preview-v1')
          archive=next(root.glob('agent-interface-runtime-preview-*.tar.gz'))
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with tarfile.open(archive,'r:gz') as tf:
              names=[m.name for m in tf.getmembers() if m.isfile()]
          manifest={
              'schema':'agent-interface-runtime-preview-artifact-v1',
              'commit':commit,
              'archive':archive.name,
              'archive_bytes':archive.stat().st_size,
              'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
              'tracked_file_count':len(names),
              'audit_retained_required':True,
              'source_closure_required':True,
              'supported_host_claim':'WSLg/Linux-X11 remains separately acceptance-tested; packaging job is not a GUI/model run',
          }
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Verify extracted artifact, not checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-preview-v1/extracted
          tar -xzf runtime-preview-v1/agent-interface-runtime-preview-*.tar.gz \
            -C runtime-preview-v1/extracted --strip-components=1
          python runtime-preview-v1/extracted/runtime/golden_desktop_demo_v3.py audit-retained \
            | tee runtime-preview-v1/evidence/extracted-audit-retained.json
          python runtime-preview-v1/extracted/release/golden_artifact_closure_v1/check_golden_artifact_closure.py \
            runtime-preview-v1/extracted \
            --out runtime-preview-v1/evidence/extracted-source-closure.json
          python release/first_run_smoke_v1/preflight.py \
            --root runtime-preview-v1/extracted \
            --out runtime-preview-v1/evidence/extracted-first-run-preflight.json

      - name: Upload immutable runtime preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-interface-runtime-preview-v1-${{ github.sha }}
          path: |
            runtime-preview-v1/agent-interface-runtime-preview-*.tar.gz
            runtime-preview-v1/manifest.json
            runtime-preview-v1/evidence/**
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
