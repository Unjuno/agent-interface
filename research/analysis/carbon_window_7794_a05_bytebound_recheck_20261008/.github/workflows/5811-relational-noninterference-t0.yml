name: Issue 5811 relational non-interference T0
on:
  workflow_dispatch:
    inputs:
      allocation:
        description: Frozen allocation identifier; exact match required.
        required: true
        type: string
jobs:
  finite-t0:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/relational-noninterference-5811-t0-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: issue-5811-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify one-shot allocation and frozen inputs
        id: gate
        env:
          ALLOCATION_INPUT: ${{ inputs.allocation }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=research/analysis/relational_noninterference_5811_t0_v1
          freeze="$root/FREEZE.json"; mkdir -p "$RUNNER_TEMP/evidence"
          test "$GITHUB_REPOSITORY" = Unjuno/agent-interface
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$ALLOCATION_INPUT" = "$(jq -r .allocation "$freeze")"
          test "$GITHUB_REF_NAME" = "$(jq -r .branch "$freeze")"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_RUN_NUMBER" = "$(jq -r .workflowRunNumber "$freeze")"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(jq -r .schema "$freeze")" = 5811-relational-noninterference-freeze-v1
          base=$(jq -r .publicationBaseMain "$freeze")
          gh api "repos/Unjuno/agent-interface/compare/$base...$GITHUB_SHA" | jq -e '.status == "ahead" or .status == "identical"' >/dev/null
          for file in candidate.py fixture.json audit.py test_t0.py; do
            expected=$(jq -r --arg f "$file" '.sourceSha256[$f]' "$freeze")
            test "$(sha256sum "$root/$file" | cut -d' ' -f1)" = "$expected"
          done
          test "$(jq '.cases | length' "$root/fixture.json")" = "$(jq -r .expectedCases "$freeze")"
          test "$(jq '[.cases[].paired.trace[]] | length' "$root/fixture.json")" = "$(jq -r .expectedPairedEvents "$freeze")"
          main_sha=$(gh api repos/Unjuno/agent-interface/commits/main --jq .sha)
          jq -n --arg allocation "$ALLOCATION_INPUT" --arg event_sha "$GITHUB_SHA" --arg main_sha "$main_sha" '{allocation:$allocation,event_sha:$event_sha,live_main_sha_at_gate:$main_sha,candidate_invocations:0,auditor_invocations:0,status:"START_GATE_PASS"}' > "$RUNNER_TEMP/evidence/start-gate.json"
          echo ok=1 >> "$GITHUB_OUTPUT"
      - name: Pull and identify pinned container image
        id: image
        if: success() && steps.gate.outputs.ok == '1'
        shell: bash
        run: |
          set -euo pipefail
          f=research/analysis/relational_noninterference_5811_t0_v1/FREEZE.json
          image=$(jq -r .image "$f"); platform=$(jq -r .platform "$f")
          docker version --format '{{json .Server}}' > "$RUNNER_TEMP/evidence/docker-server.json"
          docker pull --platform "$platform" "$image"
          docker image inspect "$image" --format '{"Id":"{{.Id}}","Os":"{{.Os}}","Architecture":"{{.Architecture}}","RepoDigests":{{json .RepoDigests}}}' > "$RUNNER_TEMP/evidence/image.json"
          echo ok=1 >> "$GITHUB_OUTPUT"
      - name: Run frozen candidate once in isolated Docker
        id: candidate
        if: success() && steps.image.outputs.ok == '1'
        shell: bash
        run: |
          set -euo pipefail
          root=research/analysis/relational_noninterference_5811_t0_v1; e="$RUNNER_TEMP/evidence"
          image=$(jq -r .image "$root/FREEZE.json"); platform=$(jq -r .platform "$root/FREEZE.json")
          set +e
          docker run -i --pull=never --platform "$platform" --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=32 --memory=128m --cpus=1 --cidfile "$e/candidate.cid" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$root/candidate.py,target=/candidate.py,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$root/fixture.json,target=/fixture.json,readonly" \
            "$image" python -B /candidate.py < "$GITHUB_WORKSPACE/$root/fixture.json" > "$e/raw.json" 2> "$e/candidate.stderr"
          rc=$?; set -e; echo exit_code=$rc >> "$GITHUB_OUTPUT"
          if [ -s "$e/candidate.cid" ]; then cid=$(cat "$e/candidate.cid"); docker inspect "$cid" > "$e/candidate-container.json"; docker rm "$cid" >/dev/null; fi
          test "$rc" = 0
      - name: Independently audit raw output once in a separate Docker container
        id: auditor
        if: success() && steps.candidate.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          root=research/analysis/relational_noninterference_5811_t0_v1; e="$RUNNER_TEMP/evidence"
          image=$(jq -r .image "$root/FREEZE.json"); platform=$(jq -r .platform "$root/FREEZE.json")
          set +e
          docker run -i --pull=never --platform "$platform" --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=32 --memory=128m --cpus=1 --cidfile "$e/auditor.cid" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$root/audit.py,target=/audit.py,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$root/fixture.json,target=/fixture.json,readonly" \
            --mount "type=bind,source=$e/raw.json,target=/raw.json,readonly" \
            "$image" python -B /audit.py /fixture.json < "$e/raw.json" > "$e/audit.json" 2> "$e/auditor.stderr"
          rc=$?; set -e; echo exit_code=$rc >> "$GITHUB_OUTPUT"
          if [ -s "$e/auditor.cid" ]; then cid=$(cat "$e/auditor.cid"); docker inspect "$cid" > "$e/auditor-container.json"; docker rm "$cid" >/dev/null; fi
          test "$rc" = 0
      - name: Preserve first outcome without retry
        if: always()
        env:
          GATE_OK: ${{ steps.gate.outputs.ok || '0' }}
          IMAGE_OK: ${{ steps.image.outputs.ok || '0' }}
          CANDIDATE_RC: ${{ steps.candidate.outputs.exit_code || 'NOT_RUN' }}
          AUDITOR_RC: ${{ steps.auditor.outputs.exit_code || 'NOT_RUN' }}
        shell: bash
        run: |
          set -euo pipefail
          root=research/analysis/relational_noninterference_5811_t0_v1; e="$RUNNER_TEMP/evidence"
          allocation=$(jq -r .allocation "$root/FREEZE.json"); out="$root/results/$allocation"
          mkdir -p "$out"; if [ -d "$e" ]; then cp -a "$e/." "$out/"; fi
          if [ "$GATE_OK" = 1 ] && [ "$IMAGE_OK" = 1 ] && [ "$CANDIDATE_RC" = 0 ] && [ "$AUDITOR_RC" = 0 ]; then disposition=PASS_METHOD_SCOPED; elif [ "$GATE_OK" != 1 ]; then disposition=STOP_BEFORE_CANDIDATE; else disposition=STOP_OPERATIONAL_OR_AUDIT; fi
          jq -n --arg allocation "$allocation" --arg event_sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg c "$CANDIDATE_RC" --arg a "$AUDITOR_RC" --arg disposition "$disposition" --arg image "$(jq -r .image "$root/FREEZE.json")" --arg platform "$(jq -r .platform "$root/FREEZE.json")" '{allocation:$allocation,event_sha:$event_sha,workflow_run_id:$run_id,run_attempt:$attempt,candidate_invocations:(if $c=="NOT_RUN" then 0 else 1 end),candidate_exit_code:$c,auditor_invocations:(if $a=="NOT_RUN" then 0 else 1 end),auditor_exit_code:$a,image:$image,platform:$platform,disposition:$disposition}' > "$out/RUN.json"
          if [ -f "$out/raw.json" ]; then sha256sum "$out/raw.json" > "$out/SHA256SUMS"; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$out"; git commit -m 'research(#5811): retain relational non-interference T0 outcome'; git push origin "HEAD:$GITHUB_REF"
