name: MAP01 r4 sparse checkout successor

on:
  # Historical #2174 checkout experiment, not a runtime regression gate.
  # An explicit dispatch preserves its PASS/STOP result without rerunning the
  # research allocation for every unrelated production pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    timeout-minutes: 4
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - name: Shallow checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run source-only gate
        run: |
          python research/doom/map01_r4_sparse_checkout_successor_2174/import_gate.py | tee r4-sparse-result.json
      - name: Upload first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-r4-sparse-checkout-result
          path: r4-sparse-result.json
