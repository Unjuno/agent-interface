name: origin-effect-binding-6500

on:
  pull_request:
    paths:
      - 'research/analysis/origin_effect_binding_6500_t0_20261002/**'
      - '.github/workflows/origin-effect-binding-6500.yml'
      - 'research/analysis/README.md'
      - 'research/analysis/check_index.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s research/analysis/origin_effect_binding_6500_t0_20261002 -p 'test_*.py' -v
      - run: python research/analysis/check_index.py
