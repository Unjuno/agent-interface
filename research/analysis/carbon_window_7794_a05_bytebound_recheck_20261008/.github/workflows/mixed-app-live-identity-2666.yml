name: Mixed-app live identity preflight #2666
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/integration/mixed_app_identity_2666_live/**"
      - ".github/workflows/mixed-app-live-identity-2666.yml"
  push:
    paths:
      - "research/integration/mixed_app_identity_2666_live/**"
      - ".github/workflows/mixed-app-live-identity-2666.yml"
jobs:
  identity-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils inkscape libreoffice chromium
          python -m pip install pytest
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Run contract test
        run: python -m pytest -q research/integration/mixed_app_identity_2666_live/test_identity_preflight.py
      - name: Run model-free live identity preflight
        run: python research/integration/mixed_app_identity_2666_live/identity_preflight.py
