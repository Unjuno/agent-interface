name: MAP01 recovery mechanics dev 01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map01-recovery-mechanics-dev-01.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: map01-recovery-mechanics-dev-01
  cancel-in-progress: false

env:
  ALLOCATION_ID: map01-recovery-mechanics-dev-01
  WORKFLOW_PATH: .github/workflows/map01-recovery-mechanics-dev-01.yml
  FROZEN_RESEARCH_COMMIT: b7c6e9935db8e0618e55dd8df2b609b2b036a15f

jobs:
  recovery-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert shared measurement sources unchanged
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${FROZEN_RESEARCH_COMMIT}^{commit}"
          git diff --exit-code "$FROZEN_RESEARCH_COMMIT" -- \
            research/doom/session_map01_v13.py \
            research/doom/session_map01_v12.py \
            research/doom/doom_retained_input_backend_v3.py \
            research/live_control/input_transition_owner_v3.py \
            research/doom/audit_map01_terminal_score_agreement_v1.py \
            research/orchestration/o3-g7/global-owner/formal_allocation_global_owner_v1.py

      - name: Claim allocation-global owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/map01-recovery-mechanics-dev-01.yml/runs?event=push&per_page=100"
          visible=0
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" > allocation-runs.json
            if python - "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          p=json.load(open('allocation-runs.json',encoding='utf-8'));cur=int(sys.argv[1])
          ids={int(x['id']) for x in p.get('workflow_runs',[]) if isinstance(x,dict) and 'id' in x}
          raise SystemExit(0 if cur in ids else 1)
          PY
            then visible=1; break; fi
            sleep 2
          done
          test "$visible" = 1
          python research/orchestration/o3-g7/global-owner/formal_allocation_global_owner_v1.py \
            allocation-runs.json \
            --current-run-id "$GITHUB_RUN_ID" \
            --workflow-path "$WORKFLOW_PATH" \
            --allocation-id "$ALLOCATION_ID" \
            --required-branch main \
            --out allocation-owner.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ViZDoom and X11 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl libopenal1 libsdl2-2.0-0 libgl1
          python -m pip install --upgrade pip
          python -m pip install 'vizdoom==1.3.0' pillow python-xlib numpy openpyxl

      - name: Revalidate development probe
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/doom/probe_map01_recovery_mechanics_dev_v1.py research/doom/test_probe_map01_recovery_mechanics_dev_v1.py
          python research/doom/test_probe_map01_recovery_mechanics_dev_v1.py
          python research/orchestration/o3-g7/global-owner/test_formal_allocation_global_owner_v1.py
          python research/doom/test_audit_map01_terminal_score_agreement_v1.py

      - name: Run real MAP01 development pair
        shell: bash
        run: |
          set -euo pipefail
          python research/doom/probe_map01_recovery_mechanics_dev_v1.py \
            --repo . \
            --out results-local/doom/map01-recovery-mechanics-dev-01 \
            --seed 990615 \
            --wait-ms 600 \
            --recovery-ms 240 \
            --health-loss 8 | tee recovery-dev.stdout

      - name: Enforce terminal scorer agreement in both arms
        shell: bash
        run: |
          set -euo pipefail
          python research/doom/audit_map01_terminal_score_agreement_v1.py \
            results-local/doom/map01-recovery-mechanics-dev-01/coast/runtime \
            --out results-local/doom/map01-recovery-mechanics-dev-01/coast/terminal-score-audit.json
          python research/doom/audit_map01_terminal_score_agreement_v1.py \
            results-local/doom/map01-recovery-mechanics-dev-01/recovery/runtime \
            --out results-local/doom/map01-recovery-mechanics-dev-01/recovery/terminal-score-audit.json

      - name: Upload first development outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-recovery-mechanics-dev-01-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            allocation-runs.json
            allocation-owner.json
            recovery-dev.stdout
            results-local/doom/map01-recovery-mechanics-dev-01/**
