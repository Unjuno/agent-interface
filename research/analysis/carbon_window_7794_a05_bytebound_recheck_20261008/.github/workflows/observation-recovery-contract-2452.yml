name: observation-recovery-contract-2452
on:
  pull_request:
    paths:
      - "research/analysis/observation_recovery_contract_2452_v1/**"
      - ".github/workflows/observation-recovery-contract-2452.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    steps:
      - name: Fetch exact PR-head sources without archive checkout
        env:
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import os,urllib.request,pathlib; base='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['REF']+'/'; d=pathlib.Path('/tmp/recovery'); d.mkdir(); [ (d/p).write_bytes(urllib.request.urlopen(base+'research/analysis/observation_recovery_contract_2452_v1/'+p).read()) for p in ('contract.py','test_contract.py') ]"
      - run: python -m py_compile /tmp/recovery/contract.py /tmp/recovery/test_contract.py
      - run: cd /tmp/recovery && python -m unittest -v
