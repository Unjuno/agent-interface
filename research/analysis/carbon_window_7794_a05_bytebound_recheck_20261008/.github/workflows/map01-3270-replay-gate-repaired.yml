name: #3270 scorer replay gate repaired checkout

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-gate:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Shallow checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/doom/test_map01_scorer_scheduler_replay_3270.py
      - name: Run deterministic replay gate
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace python:3.12-slim \
            python -m unittest -v research/doom/test_map01_scorer_scheduler_replay_3270.py
