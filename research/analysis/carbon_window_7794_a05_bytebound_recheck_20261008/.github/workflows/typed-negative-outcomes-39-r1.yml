name: typed negative outcomes successor r1

on:
  push:
    branches:
      - research/typed-negative-outcomes-39-r1
  pull_request:
    paths:
      - research/analysis/typed_negative_outcomes_successor_39_v1/**
      - .github/workflows/typed-negative-outcomes-39-r1.yml

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and run pinned contract
        env:
          SOURCE_URL: https://raw.githubusercontent.com/Unjuno/agent-interface/886101c9631b2d2720c95d8860d0ff96531f4241/research/analysis/typed_negative_outcomes_successor_39_v1/contract.py
        run: |
          python3 - <<'PY'
          import os, urllib.request
          data = urllib.request.urlopen(os.environ["SOURCE_URL"], timeout=30).read()
          open("/tmp/contract.py", "wb").write(data)
          print("PINNED_SOURCE", os.environ["SOURCE_URL"])
          print("SOURCE_BYTES", len(data))
          PY
          python3 -m py_compile /tmp/contract.py
          python3 /tmp/contract.py

  container:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Fetch and run pinned contract
        env:
          SOURCE_URL: https://raw.githubusercontent.com/Unjuno/agent-interface/886101c9631b2d2720c95d8860d0ff96531f4241/research/analysis/typed_negative_outcomes_successor_39_v1/contract.py
        run: |
          python - <<'PY'
          import os, urllib.request
          data = urllib.request.urlopen(os.environ["SOURCE_URL"], timeout=30).read()
          open("/tmp/contract.py", "wb").write(data)
          print("PINNED_SOURCE", os.environ["SOURCE_URL"])
          print("SOURCE_BYTES", len(data))
          PY
          python -m py_compile /tmp/contract.py
          python /tmp/contract.py
