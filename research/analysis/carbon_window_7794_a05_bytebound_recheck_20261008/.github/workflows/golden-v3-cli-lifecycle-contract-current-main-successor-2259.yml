name: golden v3 cli lifecycle contract current-main successor 2259
on:
  pull_request:
    paths:
      - "research/integration/golden_cli_lifecycle_contract_successor_2259_v1/**"
      - ".github/workflows/golden-v3-cli-lifecycle-contract-current-main-successor-2259.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run path-safe source-bound audit
        run: python research/integration/golden_cli_lifecycle_contract_successor_2259_v1/audit.py
