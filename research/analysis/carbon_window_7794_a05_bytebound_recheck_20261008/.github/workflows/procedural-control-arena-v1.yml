name: procedural-control-arena-v1

on:
  push:
    paths:
      - "research/procedural_control_arena_v1/**"
      - ".github/workflows/procedural-control-arena-v1.yml"
  pull_request:
    paths:
      - "research/procedural_control_arena_v1/**"
      - ".github/workflows/procedural-control-arena-v1.yml"

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk/Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth
      - name: Run arena v1 construction checks
        working-directory: research/procedural_control_arena_v1
        run: |
          chmod +x run_smoke.sh
          ./run_smoke.sh
