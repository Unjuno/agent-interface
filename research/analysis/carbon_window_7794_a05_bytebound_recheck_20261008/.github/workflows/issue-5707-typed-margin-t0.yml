name: Issue 5707 typed margin T0

on:
  push:
    branches:
      - research/5707-typed-boundary-margin-t0-20261001
    paths:
      - 'research/analysis/boundary_margin_5707_typed_v1/**'
      - '.github/workflows/issue-5707-typed-margin-t0.yml'

permissions:
  contents: read

jobs:
  candidate:
    if: github.event.before == '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen source and base
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(python -c 'import json;print(json.load(open("research/analysis/boundary_margin_5707_typed_v1/plan.json"))["frozen_main"])')
          git merge-base --is-ancestor "$BASE" HEAD
          sha256sum -c research/analysis/boundary_margin_5707_typed_v1/SHA256SUMS
      - name: Pull and identify pinned image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8f910824d4e93bdce61e212c7e87168123ea3073b41a1a'
          docker pull --platform linux/amd64 "$IMAGE"
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          PLATFORM=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")
          test "$IMAGE_ID" = 'sha256:febd0be41adb897a0ab8f1f1c693d8912669ea60c4940e076e9946b60e210ef0'
          test "$PLATFORM" = 'linux/amd64'
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
      - name: Run the frozen candidate exactly once
        shell: bash
        run: |
          set -euo pipefail
          ROOT='research/analysis/boundary_margin_5707_typed_v1'
          OUT="$RUNNER_TEMP/issue-5707-candidate"
          mkdir -m 700 "$OUT"
          UID_NUM=$(id -u)
          GID_NUM=$(id -g)
          IMAGE='python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8f910824d4e93bdce61e212c7e87168123ea3073b41a1a'
          set +e
          docker run --rm --name issue5707-typed-margin-candidate-01 \
            --platform linux/amd64 --network none --read-only \
            --cap-drop=ALL --security-opt no-new-privileges \
            --memory 256m --cpus 1 --pids-limit 32 \
            --user "$UID_NUM:$GID_NUM" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/$ROOT,dst=/study,readonly" \
            --mount "type=bind,src=$OUT,dst=/out" \
            "$IMAGE" python -B /study/candidate.py --plan /study/plan.json --out /out/formal-01.jsonl \
            > "$OUT/candidate.stdout" 2> "$OUT/candidate.stderr"
          CANDIDATE_EXIT=$?
          set -e
          printf '%s\n' "$CANDIDATE_EXIT" > "$OUT/candidate.exit"
          test "$CANDIDATE_EXIT" -eq 0
          test -s "$OUT/formal-01.jsonl"
          RAW_SHA=$(sha256sum "$OUT/formal-01.jsonl" | cut -d' ' -f1)
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          PLATFORM=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")
          python - "$OUT/execution.json" "$RAW_SHA" "$IMAGE_ID" "$PLATFORM" "$CANDIDATE_EXIT" <<'PY'
          import json, os, sys
          from pathlib import Path
          out, raw_sha, image_id, platform, exit_code = sys.argv[1:]
          plan = json.loads(Path("research/analysis/boundary_margin_5707_typed_v1/plan.json").read_text())
          receipt = {
              "allocation": plan["allocation"], "frozen_main": plan["frozen_main"],
              "candidate_exit": int(exit_code), "raw_sha256": raw_sha,
              "image_ref": "python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8f910824d4e93bdce61e212c7e87168123ea3073b41a1a",
              "image_id": image_id, "platform": platform,
              "runner_uid": os.getuid(), "runner_gid": os.getgid(),
          }
          Path(out).write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-5707-typed-margin-candidate-01
          path: ${{ runner.temp }}/issue-5707-candidate
          if-no-files-found: error
          retention-days: 30

  independent-audit:
    needs: candidate
    if: needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: issue-5707-typed-margin-candidate-01
          path: ${{ runner.temp }}/issue-5707-candidate
      - name: Verify source and candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          ROOT='research/analysis/boundary_margin_5707_typed_v1'
          BASE=$(python -c 'import json;print(json.load(open("research/analysis/boundary_margin_5707_typed_v1/plan.json"))["frozen_main"])')
          git merge-base --is-ancestor "$BASE" HEAD
          sha256sum -c "$ROOT/SHA256SUMS"
          test "$(cat "$RUNNER_TEMP/issue-5707-candidate/candidate.exit")" = '0'
      - name: Pull and identify pinned image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8f910824d4e93bdce61e212c7e87168123ea3073b41a1a'
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = 'sha256:febd0be41adb897a0ab8f1f1c693d8912669ea60c4940e076e9946b60e210ef0'
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = 'linux/amd64'
      - name: Run the independent raw-only auditor exactly once
        shell: bash
        run: |
          set -euo pipefail
          ROOT='research/analysis/boundary_margin_5707_typed_v1'
          CANDIDATE="$RUNNER_TEMP/issue-5707-candidate"
          OUT="$RUNNER_TEMP/issue-5707-audit"
          mkdir -m 700 "$OUT"
          UID_NUM=$(id -u)
          GID_NUM=$(id -g)
          IMAGE='python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8f910824d4e93bdce61e212c7e87168123ea3073b41a1a'
          docker run --rm --name issue5707-typed-margin-audit-01 \
            --platform linux/amd64 --network none --read-only \
            --cap-drop=ALL --security-opt no-new-privileges \
            --memory 256m --cpus 1 --pids-limit 32 \
            --user "$UID_NUM:$GID_NUM" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/$ROOT,dst=/study,readonly" \
            --mount "type=bind,src=$CANDIDATE,dst=/candidate,readonly" \
            --mount "type=bind,src=$OUT,dst=/audit" \
            "$IMAGE" python -B /study/audit.py --plan /study/plan.json \
            --raw /candidate/formal-01.jsonl --execution /candidate/execution.json \
            --out /audit/audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: issue-5707-typed-margin-independent-audit-01
          path: ${{ runner.temp }}/issue-5707-audit/audit.json
          if-no-files-found: error
          retention-days: 30
