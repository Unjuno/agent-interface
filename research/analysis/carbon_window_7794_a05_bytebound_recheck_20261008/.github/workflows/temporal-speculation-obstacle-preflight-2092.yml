name: temporal speculation obstacle preflight 2092
on:
  push:
    paths:
      - research/measurement/temporal_speculation_obstacle_preflight_2092_v1/**
      - .github/workflows/temporal-speculation-obstacle-preflight-2092.yml
  pull_request:
    paths:
      - research/measurement/temporal_speculation_obstacle_preflight_2092_v1/**
      - .github/workflows/temporal-speculation-obstacle-preflight-2092.yml
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic preflight
        run: |
          python research/measurement/temporal_speculation_obstacle_preflight_2092_v1/preflight.py > /tmp/result.json
          python -c 'import json; r=json.load(open("/tmp/result.json")); assert r["oracle_pass"] == 32 and r["authority_grants"] == 0 and r["input_executions"] == 0'
