name: Issue 3602 evidence publication closure

on:
  pull_request:
    paths:
      - .github/workflows/issue-3602-publication-closure.yml
      - research/integration/issue_3370_delivery_publication_closure_v1/**
      - research/integration/issue_3370_delivery_comparison_v1/evidence/**
  push:
    branches:
      - research/issue-3602-publication-closure-v1
    paths:
      - .github/workflows/issue-3602-publication-closure.yml
      - research/integration/issue_3370_delivery_publication_closure_v1/**
      - research/integration/issue_3370_delivery_comparison_v1/evidence/**

permissions:
  contents: read

jobs:
  publication-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out immutable historical evidence separately
        uses: actions/checkout@v4
        with:
          ref: e3d04078d8d6d09fe3a3e33456b144c3d892adee
          path: .publication-frozen
          sparse-checkout: research/integration/issue_3370_delivery_comparison_v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test publication closure gates
        run: python -m unittest discover -s research/integration/issue_3370_delivery_publication_closure_v1 -p 'test_*.py' -v
      - name: Compile audit
        run: python -m py_compile research/integration/issue_3370_delivery_publication_closure_v1/audit.py research/integration/issue_3370_delivery_publication_closure_v1/test_audit.py
      - name: Reconstruct frozen public evidence inventory
        shell: bash
        run: |
          set +e
          python research/integration/issue_3370_delivery_publication_closure_v1/audit.py \
            --bundle .publication-frozen/research/integration/issue_3370_delivery_comparison_v1 \
            --output "$RUNNER_TEMP/issue-3602-publication-audit.json"
          status=$?
          set -e
          test "$status" -eq 1
          python -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8")); expected={"evidence/direct_mcp_image/allocation/stderr.log", "evidence/direct_mcp_image/allocation/stdout.log", "evidence/direct_mcp_image/mcp-stderr.log", "evidence/saved_file_view_image/allocation/stderr.log", "evidence/saved_file_view_image/allocation/stdout.log", "evidence/saved_file_view_image/mcp-stderr.log"}; assert r["result"] == "HOLD_PUBLICATION_GAP"; assert r["manifest_entries"] == 99 and r["present_and_matching"] == 93; assert set(r["missing"]) == expected; assert not r["mismatched"] and not r["unlisted"] and not r["failures"]' "$RUNNER_TEMP/issue-3602-publication-audit.json"
      - name: Check current publication without requiring historical gaps
        shell: bash
        run: |
          set +e
          python research/integration/issue_3370_delivery_publication_closure_v1/audit.py \
            --bundle research/integration/issue_3370_delivery_comparison_v1 \
            --output "$RUNNER_TEMP/issue-3602-current-publication.json"
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          python - "$RUNNER_TEMP/issue-3602-publication-audit.json" "$RUNNER_TEMP/issue-3602-current-publication.json" <<'PY'
          import json, sys
          old, current = [json.load(open(path, encoding="utf-8")) for path in sys.argv[1:]]
          assert current["manifest_sha256"] == old["manifest_sha256"]
          assert current["result"] in {"HOLD_PUBLICATION_GAP", "PASS_PUBLICATION_CLOSED"}
          assert set(current["missing"]) <= set(old["missing"])
          assert current["present_and_matching"] + len(current["missing"]) == old["manifest_entries"]
          assert not current["mismatched"] and not current["unlisted"] and not current["failures"]
          print(current["result"], "remaining historical gaps:", len(current["missing"]))
          PY
      - name: Preserve both audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-3602-publication-receipts
          path: |
            ${{ runner.temp }}/issue-3602-publication-audit.json
            ${{ runner.temp }}/issue-3602-current-publication.json
