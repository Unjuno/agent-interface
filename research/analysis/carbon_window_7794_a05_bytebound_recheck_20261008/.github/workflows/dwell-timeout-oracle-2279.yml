name: dwell-timeout-oracle-2279
on:
  pull_request:
    paths:
      - "research/live_control/dwell_timeout_oracle_2279_v1/**"
      - ".github/workflows/dwell-timeout-oracle-2279.yml"
  push:
    paths:
      - "research/live_control/dwell_timeout_oracle_2279_v1/**"
      - ".github/workflows/dwell-timeout-oracle-2279.yml"
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: native oracle audit
        run: python3 research/live_control/dwell_timeout_oracle_2279_v1/audit.py
      - name: pinned container oracle audit
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/research/live_control/dwell_timeout_oracle_2279_v1 python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a python audit.py
      - name: syntax and JSON audit
        run: |
          python3 -m py_compile research/live_control/dwell_timeout_oracle_2279_v1/oracle.py
          python3 -m py_compile research/live_control/dwell_timeout_oracle_2279_v1/audit.py
          python3 -m json.tool research/live_control/dwell_timeout_oracle_2279_v1/SOURCE_MANIFEST.json >/dev/null
