<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blackwell T1 static observation fixture</title>
  <style>
    html, body { margin: 0; width: 960px; height: 640px; overflow: hidden; background: #f5f5f5; font: 24px sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; width: 960px; height: 640px; }
    section { display: grid; place-items: center; border: 2px solid #333; }
    #left { background: #fff; }
    #right { background: #eee; }
    .card { width: 260px; height: 180px; display: grid; place-items: center; border: 4px solid #111; border-radius: 8px; color: #111; font-weight: 700; }
    .active-left { background: #e63946; }
    .active-right { background: #457b9d; }
    .inactive { background: #c8c8c8; }
  </style>
</head>
<body>
  <main aria-label="Two-region target fixture">
    <section id="left" aria-label="Left region">
      <div id="left-target" class="card active-left" role="img" aria-label="LEFT TARGET ACTIVE">LEFT TARGET ACTIVE</div>
    </section>
    <section id="right" aria-label="Right region">
      <div id="right-target" class="card inactive" role="img" aria-label="RIGHT TARGET INACTIVE">RIGHT TARGET INACTIVE</div>
    </section>
  </main>
</body>
</html>
