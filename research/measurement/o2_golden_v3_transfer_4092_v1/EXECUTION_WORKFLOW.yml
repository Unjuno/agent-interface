name: issue-4103-o2-golden-transfer

on:
  pull_request:
    types: [opened]
    paths:
      - 'research/measurement/o2_golden_v3_transfer_4092_v1/**'
      - '.github/workflows/issue-4103-o2-golden-transfer.yml'

permissions:
  contents: read

jobs:
  formal:
    if: github.head_ref == 'research/o2-golden-v3-transfer-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify frozen workflow snapshot
        run: cmp .github/workflows/issue-4103-o2-golden-transfer.yml research/measurement/o2_golden_v3_transfer_4092_v1/EXECUTION_WORKFLOW.yml

      - name: Build pinned integration image
        run: docker build -f runtime/integration_checks/Dockerfile -t agent-interface-o2-transfer:4103 .

      - name: Run one frozen formal allocation and independent audit
        id: allocation
        shell: bash
        run: |
          set -u
          OUT="$PWD/results-local/issue4103"
          mkdir -p "$OUT"
          set +e
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            --entrypoint python \
            -e AGENT_INTERFACE_ROOT=/src \
            -e SOURCE_REVISION='${{ github.event.pull_request.head.sha }}' \
            -e PYTHONHASHSEED=0 -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 -e MKL_NUM_THREADS=1 \
            -v "$PWD:/src:ro" -v "$OUT:/out" \
            agent-interface-o2-transfer:4103 \
            -B /src/research/measurement/o2_golden_v3_transfer_4092_v1/run.py --out /out/formal-01 \
            > "$OUT/formal.stdout" 2> "$OUT/formal.stderr"
          FORMAL_RC=$?
          printf '%s\n' "$FORMAL_RC" > "$OUT/formal-01/FORMAL_CONTAINER_EXIT.host" 2>/dev/null || printf '%s\n' "$FORMAL_RC" > "$OUT/FORMAL_CONTAINER_EXIT.host"
          AUDIT_RC=99
          if [ "$FORMAL_RC" -eq 0 ]; then
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev \
              --entrypoint python \
              -e AGENT_INTERFACE_ROOT=/src -e PYTHONHASHSEED=0 \
              -v "$PWD:/src:ro" -v "$OUT:/out" \
              agent-interface-o2-transfer:4103 \
              -B /src/research/measurement/o2_golden_v3_transfer_4092_v1/audit.py --root /out/formal-01 --controls \
              > "$OUT/AUDIT.json" 2> "$OUT/audit.stderr"
            AUDIT_RC=$?
          fi
          printf '%s\n' "$AUDIT_RC" > "$OUT/AUDIT_CONTAINER_EXIT.host"
          printf '{"formal_exit":%s,"audit_exit":%s,"head_sha":"%s"}\n' "$FORMAL_RC" "$AUDIT_RC" '${{ github.event.pull_request.head.sha }}' > "$OUT/WORKFLOW_RECEIPT.json"
          echo "formal_rc=$FORMAL_RC" >> "$GITHUB_OUTPUT"
          echo "audit_rc=$AUDIT_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable first outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4103-o2-golden-transfer
          path: results-local/issue4103
          if-no-files-found: error
          retention-days: 30

      - name: Preserve formal/audit failure as workflow failure
        if: always()
        shell: bash
        run: |
          test '${{ steps.allocation.outputs.formal_rc }}' = '0'
          test '${{ steps.allocation.outputs.audit_rc }}' = '0'
