name: procedural-operations-world-v0

on:
  push:
    paths:
      - "research/procedural_operations_world_v0/**"
      - ".github/workflows/procedural-operations-world-v0.yml"
  pull_request:
    paths:
      - "research/procedural_operations_world_v0/**"
      - ".github/workflows/procedural-operations-world-v0.yml"

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev xvfb xauth
      - name: Build and smoke
        working-directory: research/procedural_operations_world_v0
        run: |
          chmod +x run_smoke.sh
          ./run_smoke.sh
      - name: ASan and UBSan
        working-directory: research/procedural_operations_world_v0
        run: |
          make clean
          make test_ops_world CFLAGS='-O1 -g -std=c11 -Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer' LDLIBS='-lm -fsanitize=address,undefined'
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./test_ops_world
