name: one-shot exact contained ref cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maintenance-contained-ref-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete exact audited contained refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --force origin '+refs/heads/*:refs/remotes/origin/*'

          failures=0
          deleted=0

          delete_exact() {
            branch="$1"
            expected="$2"
            ref="refs/remotes/origin/$branch"

            if ! git show-ref --verify --quiet "$ref"; then
              echo "ALREADY_GONE $branch"
              return 0
            fi

            actual="$(git rev-parse "$ref")"
            if [[ "$actual" != "$expected" ]]; then
              echo "SHA_MISMATCH $branch expected=$expected actual=$actual" >&2
              failures=$((failures + 1))
              return 0
            fi

            if ! git merge-base --is-ancestor "$ref" refs/remotes/origin/main; then
              echo "NOT_CONTAINED $branch" >&2
              failures=$((failures + 1))
              return 0
            fi

            echo "DELETE $branch @ $actual"
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              failures=$((failures + 1))
            fi
          }

          delete_exact "maintenance/remove-one-shot-cleanup-workflow-20260918" "39ec12c466a74cc85bf84501982af66e6027d9f4"
          delete_exact "maintenance/rescue-map01-v3-prereg-test-20260918" "47c8439868061d2d488fd766b6168fecc94a2b49"
          delete_exact "maintenance/rescue-route-decision-v2-v3-current-main" "6d668db4616ad2c693bc58805cc215e193130891"
          delete_exact "maintenance/rescue-safe-orphans-current-main-20260918" "d05caf56bfd6cd5d36437027d162ef6bb4ec872d"
          delete_exact "research/mutation-actor-subprocess-provenance-1228" "23f4b2e0e6bf65820f9a5abc70d63f87819661c4"

          echo "deleted=$deleted failures=$failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
