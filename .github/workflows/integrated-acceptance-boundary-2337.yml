name: integrated acceptance boundary 2337

on:
  push:
    paths:
      - "research/integration/live_adapter_effect_scorer_2246_v1/**"
      - "research/integration/integrated_acceptance_report_2337_v1/**"
      - "runtime/results/golden-desktop-app-server-v3-live-01/golden-report.json"
      - ".github/workflows/integrated-acceptance-boundary-2337.yml"
  pull_request:
    paths:
      - "research/integration/live_adapter_effect_scorer_2246_v1/**"
      - "research/integration/integrated_acceptance_report_2337_v1/**"
      - "runtime/results/golden-desktop-app-server-v3-live-01/golden-report.json"
      - ".github/workflows/integrated-acceptance-boundary-2337.yml"

permissions:
  contents: read

jobs:
  hold-boundary:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    steps:
      - uses: actions/checkout@v4
      - name: Verify retained scorer tests
        working-directory: research/integration/live_adapter_effect_scorer_2246_v1
        run: python -m unittest discover -s . -t . -p 'test_*.py' -v
      - name: Verify retained evidence remains fail-closed
        run: |
          python research/integration/live_adapter_effect_scorer_2246_v1/scorer.py \
            runtime/results/golden-desktop-app-server-v3-live-01/golden-report.json \
            > /tmp/scorer.json
          python - <<'PY'
          import json
          from pathlib import Path
          score=json.loads(Path('/tmp/scorer.json').read_text())
          assert score['status'] == 'HOLD'
          assert score['reason'] == 'HOLD_NO_MODEL_AUTHORITY'
          assert score['authority_granted'] is False
          report=Path('research/integration/integrated_acceptance_report_2337_v1/README.md').read_text()
          assert 'HOLD_ADAPTER_BOUNDARY_UNEXECUTED' in report
          assert 'live adapter execution' in report
          print('HOLD_ADAPTER_BOUNDARY_UNEXECUTED')
          print('RETAINED_SCORER_FAIL_CLOSED_PASS')
          PY
