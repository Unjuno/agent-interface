name: Issue 5260 A05 focus-ack retained H-failure

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'research/integration/tk_firstchar_5260_a05_wslc_20261003/**'
      - '.github/workflows/tk-firstchar-5260-a05-retained.yml'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'research/integration/tk_firstchar_5260_a05_wslc_20261003/**'
      - '.github/workflows/tk-firstchar-5260-a05-retained.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/integration/tk_firstchar_5260_a05_wslc_20261003
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen and retained fail-closed tests
        run: python -B -m unittest discover -s research/integration/tk_firstchar_5260_a05_wslc_20261003 -p 'test_*.py' -v
      - name: Preserve and validate first H-failure (no container or input)
        run: python -B research/integration/tk_firstchar_5260_a05_wslc_20261003/verify_packet.py
