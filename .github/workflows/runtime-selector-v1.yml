name: Runtime backend selector v1

on:
  push:
    branches:
      - integration/runtime-selector-v1-20260917
    paths:
      - 'runtime/selector_v1/**'
      - '.github/workflows/runtime-selector-v1.yml'
  pull_request:
    paths:
      - 'runtime/selector_v1/**'
      - '.github/workflows/runtime-selector-v1.yml'

permissions:
  contents: read

jobs:
  selector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            runtime/selector_v1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile selector
        run: python -m compileall -q runtime/selector_v1
      - name: Run selector contract tests
        run: python -m unittest -v runtime.selector_v1.test_selector
