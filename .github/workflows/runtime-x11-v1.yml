name: Runtime X11 v1 Integration

on:
  push:
    branches:
      - integration/runtime-x11-v1-20260917
  pull_request:
    paths:
      - 'runtime/core_v1/**'
      - 'runtime/backends/x11_v1/**'
      - 'runtime/cli_v1/**'
      - '.github/workflows/runtime-x11-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x11-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            runtime/core_v1
            runtime/backends/x11_v1
            runtime/cli_v1
            runtime/selector_v1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install X11 test dependency
        run: |
          python -m pip install --disable-pip-version-check python-xlib==0.33 Pillow==10.2.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Compile runtime core and X11 backend
        run: python -m compileall -q runtime/core_v1 runtime/backends/x11_v1
      - name: Run private Xvfb integration
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$RUNNER_TEMP/x11v1.auth"
          : > "$AUTH"
          Xvfb :88 -screen 0 1024x768x24 -ac >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 0.5
          DISPLAY=:88 XAUTHORITY="$AUTH" python -m unittest -v runtime.backends.x11_v1.test_integration runtime.backends.x11_v1.test_partial_execution runtime.backends.x11_v1.test_capture_artifacts runtime.cli_v1.test_native_golden_boundary
