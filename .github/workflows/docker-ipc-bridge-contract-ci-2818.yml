name: Docker IPC bridge contract CI v2

on:
  pull_request:
    paths:
      - '.github/workflows/docker-ipc-bridge-contract-ci-2818.yml'
      - 'runtime/host_model_ipc_broker_v1.py'
      - 'runtime/test_host_model_ipc_broker_v1.py'
      - 'runtime/test_docker_host_model_bridge_v1.py'
      - 'research/integration/docker_schema_preflight_bridge_2818_v1/**'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Run non-authoritative bridge and broker contract tests
        run: python -m unittest runtime.test_docker_host_model_bridge_v1 runtime.test_host_model_ipc_broker_v1 -v
