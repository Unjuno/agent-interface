name: GTK bounded formal allocation #2606 v1

on:
  pull_request:
    paths:
      - ".github/workflows/gtk-formal-allocation-2606-v1.yml"
      - "research/integration/**"
      - "runtime/**"
  push:
    branches:
      - "research/gtk-formal-allocation-2606-v1"

jobs:
  allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned GTK image
        run: docker build --pull=false -f research/integration/gtk_fixture_dependency_2606_v2/Dockerfile -t agent-interface-gtk-fixture-v2:source-bundle .
      - name: Record image and source identity
        run: |
          mkdir -p "$RUNNER_TEMP/gtk-matrix-out"
          docker image inspect agent-interface-gtk-fixture-v2:source-bundle > "$RUNNER_TEMP/gtk-matrix-out/image-inspect.json"
          git rev-parse HEAD > "$RUNNER_TEMP/gtk-matrix-out/source-commit.txt"
      - name: Run one bounded eight-case allocation
        id: allocation
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp             -e PYTHONPATH=/workspace             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$RUNNER_TEMP/gtk-matrix-out:/out"             -w /workspace             agent-interface-gtk-fixture-v2:source-bundle             python3 /workspace/research/integration/golden_v3_second_domain_2246_v1/formal_matrix_runner.py             --out /out/raw
          code=$?
          printf '%s' "$code" > "$RUNNER_TEMP/gtk-matrix-out/exit-code.txt"
          if [ "$code" -eq 0 ]; then
            printf '%s\n' 'COMPLETED_UNSCORED_EXISTING_RUNNER' > "$RUNNER_TEMP/gtk-matrix-out/decision.txt"
          else
            printf '%s\n' 'STOP_EXISTING_RUNNER_ALLOCATION' > "$RUNNER_TEMP/gtk-matrix-out/decision.txt"
          fi
          exit 0
      - name: Upload retained allocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-formal-allocation-2606-v1
          path: ${{ runner.temp }}/gtk-matrix-out
          if-no-files-found: error
