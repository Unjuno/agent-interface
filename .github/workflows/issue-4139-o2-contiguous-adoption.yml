name: issue-4139-o2-contiguous-adoption

on:
  pull_request:
    types: [opened]
    paths:
      - 'research/observation_tiles/tile_transport.py'
      - 'research/integration/o2_contiguous_adoption_v1/**'
      - '.github/workflows/issue-4139-o2-contiguous-adoption.yml'

permissions:
  contents: read

jobs:
  adoption:
    if: github.head_ref == 'research/o2-contiguous-adoption-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Build existing pinned integration image
        run: docker build -f runtime/integration_checks/Dockerfile -t agent-interface-o2-adoption:4139 .

      - name: Run compatibility suites once
        id: tests
        shell: bash
        run: |
          set -u
          OUT="$PWD/results-local/issue4139"
          mkdir -p "$OUT"
          set +e
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            --entrypoint /bin/sh -w /src \
            -e PYTHONHASHSEED=0 \
            -v "$PWD:/src:ro" \
            agent-interface-o2-adoption:4139 -lc '
              set -e
              python -B research/observation_tiles/test_transport.py
              PYTHONPATH=/src/research/observation_tiles:/src/research/conditional_optimization/transport-integration-v2 \
                python -B research/conditional_optimization/transport-integration-v2/test_integration.py
              PYTHONPATH=/src/research/observation_tiles \
                python -B research/integration/o2_contiguous_adoption_v1/test_adoption.py
            ' > "$OUT/tests.stdout" 2> "$OUT/tests.stderr"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$OUT/TEST_CONTAINER_EXIT.host"
          printf '{"head_sha":"%s","test_exit":%s}\n' '${{ github.event.pull_request.head.sha }}' "$RC" > "$OUT/WORKFLOW_RECEIPT.json"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload first compatibility result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4139-o2-contiguous-adoption
          path: results-local/issue4139
          if-no-files-found: error
          retention-days: 30

      - name: Preserve test failure as workflow failure
        if: always()
        run: test '${{ steps.tests.outputs.rc }}' = '0'
