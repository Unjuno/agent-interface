name: Runtime Quartz v1

on:
  push:
    branches:
      - integration/runtime-quartz-v1-20260917
    paths:
      - 'runtime/core_v1/**'
      - 'runtime/backends/quartz_v1/**'
      - '.github/workflows/runtime-quartz-v1.yml'
  pull_request:
    paths:
      - 'runtime/core_v1/**'
      - 'runtime/backends/quartz_v1/**'
      - '.github/workflows/runtime-quartz-v1.yml'

permissions:
  contents: read

jobs:
  native-quartz:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout frozen core and Quartz candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            runtime/core_v1
            runtime/backends/quartz_v1
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact source
        run: python -m compileall -q runtime/core_v1 runtime/backends/quartz_v1
      - name: Run frozen pure helpers
        run: python -m unittest -v runtime.backends.quartz_v1.test_integration.PureQuartzTests
      - name: Run frozen native Quartz integration
        run: python -m unittest -v runtime.backends.quartz_v1.test_integration.QuartzIntegrationTests
