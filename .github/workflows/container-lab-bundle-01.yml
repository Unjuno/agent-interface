name: Offline container lab bundle 01
on:
  push:
    branches: [main]
    paths: ['.github/workflows/container-lab-bundle-01.yml']
permissions:
  contents: read
concurrency:
  group: container-lab-bundle-01
  cancel-in-progress: false
jobs:
  package-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e6d5ecdbb5440fd5df1883161f2c63b2c3bb245
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download binary dependencies only; no experiment
        run: |
          mkdir -p lab-bundle/wheels
          python -m pip download --only-binary=:all: --dest lab-bundle/wheels 'vizdoom==1.3.0' pillow python-xlib numpy openpyxl
      - name: Package tracked source and fixed threat fixture
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,tarfile
          base='9e6d5ecdbb5440fd5df1883161f2c63b2c3bb245'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==base
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected=[]
          for name in names:
              p=pathlib.Path(name)
              if not name or not p.is_file() or p.is_symlink(): continue
              source=p.suffix in ('.py','.toml','.cfg','.ini','.md','.json','.yaml','.yml') and 'results' not in p.parts and 'results-local' not in p.parts
              fixture=name.startswith('research/doom/fixtures/map01-threat-contact-v2/')
              if source or fixture: selected.append(name)
          manifest={'schema':'offline-container-lab-bundle-v1','base_commit':base,'experiment_executed':False,'files':{}}
          with tarfile.open('lab-bundle/source.tar.gz','w:gz') as out:
              for name in sorted(selected):
                  data=pathlib.Path(name).read_bytes()
                  manifest['files'][name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}
                  out.add(name,arcname=name,recursive=False)
          manifest['wheels']={str(p.relative_to('lab-bundle')):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in pathlib.Path('lab-bundle/wheels').glob('*.whl')}
          pathlib.Path('lab-bundle/manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('source files',len(selected),'wheels',len(manifest['wheels']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: offline-container-lab-9e6d5ecd
          path: lab-bundle/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
