name: golden-v3-adapter-p2-rebase-2360
on:
  pull_request:
    paths:
      - "runtime/cli_v1/**"
      - "runtime/selector_v1/**"
      - "runtime/__init__.py"
      - "research/integration/golden_v3_adapter_p2_rebase_2360_v1/**"
      - ".github/check_golden_adapter_history.py"
      - ".github/test_golden_adapter_history.py"
      - ".github/workflows/golden-v3-adapter-p2-rebase-2360.yml"
  push:
    paths:
      - "runtime/cli_v1/**"
      - "runtime/selector_v1/**"
      - "runtime/__init__.py"
      - "research/integration/golden_v3_adapter_p2_rebase_2360_v1/**"
      - ".github/check_golden_adapter_history.py"
      - ".github/test_golden_adapter_history.py"
      - ".github/workflows/golden-v3-adapter-p2-rebase-2360.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONOPTIMIZE: ""
      PYTHONPATH: ""
    steps:
      - name: Current PR merge-ref or push source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Complete CLI/selector source subtrees for pure-adapter tests, not full runtime CI.
          sparse-checkout: |
            /.github/check_golden_adapter_history.py
            /.github/test_golden_adapter_history.py
            /runtime/__init__.py
            /runtime/cli_v1/
            /runtime/selector_v1/
            /research/integration/golden_v3_adapter_p2_rebase_2360_v1/
      - name: Immutable historical source closure (nine files)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8588ae768b9d83e77d5a797fd2c7cfb588747cde
          path: .golden-p2-history
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /runtime/cli_v1/__init__.py
            /runtime/cli_v1/api.py
            /runtime/cli_v1/golden_v3.py
            /runtime/selector_v1/__init__.py
            /runtime/selector_v1/selector.py
            /research/integration/golden_v3_adapter_p2_rebase_2360_v1/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Historical identity and current frozen-file preservation
        run: |
          python3 -S -B .github/check_golden_adapter_history.py
          python3 -S -B .github/test_golden_adapter_history.py -v
      - name: Original historical native audit (unchanged sources)
        run: python3 -S -B .golden-p2-history/research/integration/golden_v3_adapter_p2_rebase_2360_v1/audit.py
      - name: Current adapter semantics and delivery regressions
        run: |
          python3 -S -B research/integration/golden_v3_adapter_p2_rebase_2360_v1/test_adapter.py
          python3 -S -B -m unittest -v runtime.cli_v1.test_golden_v3 runtime.cli_v1.test_golden_delivery_join
      - name: Pinned-container identity and separate historical/current cases
        run: |
          docker run --rm --network=none --read-only --cpus=1 --memory=512m --pids-limit=64 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONOPTIMIZE= -e PYTHONPATH= \
            -v "$PWD:/repo:ro" -w /repo \
            python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a \
            sh -ec '
              python -S -B .github/check_golden_adapter_history.py
              python -S -B .golden-p2-history/research/integration/golden_v3_adapter_p2_rebase_2360_v1/test_adapter.py
              python -S -B research/integration/golden_v3_adapter_p2_rebase_2360_v1/test_adapter.py
              python -S -B -m unittest -v runtime.cli_v1.test_golden_v3 runtime.cli_v1.test_golden_delivery_join
            '
