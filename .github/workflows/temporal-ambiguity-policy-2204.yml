name: temporal-ambiguity-policy-2204
on:
  push:
    branches: [research/temporal-ambiguity-policy-2204]
  pull_request:
    paths: [research/causality/temporal_ambiguity_policy_2204_v1/**, .github/workflows/temporal-ambiguity-policy-2204.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
    steps:
      - name: Fetch exact branch sources inside pinned container
        run: |
          python -c "import urllib.request; base='https://raw.githubusercontent.com/Unjuno/agent-interface/MAIN_SHA/research/causality/temporal_ambiguity_policy_2204_v1/'; [(open(n,'wb').write(urllib.request.urlopen(base+n).read())) for n in ['policy.py','audit.py']]"
      - run: python -m py_compile policy.py audit.py
      - run: python audit.py
