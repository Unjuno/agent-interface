name: capture-artifact-boundary-v1
on:
  workflow_dispatch:
  push:
    branches: [research/capture-artifact-boundary-v1]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb openbox python3-xlib python3-pil python3-pil.imagetk
      - run: python3 research/experiments/capture_artifact_boundary_v1/run.py --pairs 12 --out /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: capture-artifact-boundary-v1-result
          path: /tmp/result/result.json
