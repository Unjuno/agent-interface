name: Prune stale refs 2026-09-18 batch 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete audited stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          branches=(
            "release/preview-2026-09-17-rc1"
            "research/censored-down-interval-union-1329"
            "research/concurrent-fast-decision-t0-1378"
            "research/current-evidence-validity-anchor-x11-1229"
            "research/decision-policy-action-guard-cost-r0b-919e391"
            "research/decision-policy-cache-rung0-dc6efb5"
            "research/p0-live-causal-effect-same-process-x11-1287"
            "maintenance/prune-stale-refs-20260918-2"
          )
          for b in "${branches[@]}"; do
            echo "Deleting $b"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" || true
          done
