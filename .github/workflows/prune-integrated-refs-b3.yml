name: Prune integrated refs batch 3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in             release/preview-2026-09-17-rc1             research/cache-request-origin-composition-20260918             research/cache-request-origin-composition-a2-20260918-002             research/currentness-request-origin-afunix-20260918-007             research/decision-policy-cache-xterm-parent-env-a2-20260918             research/decision-policy-cache-xterm-transfer-20260918             research/input-owner-v12-live-causal-x11-20260918-001
          do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" || true; done
