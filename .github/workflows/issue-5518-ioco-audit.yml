name: Issue 5518 committed evidence audit (audit-only)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/issue-5518-ioco-audit.yml"
      - "research/analysis/ioco_adapter_conformance_5518_t0/RESULTS.md"
      - "research/analysis/ioco_adapter_conformance_5518_t0/raw.json"
      - "research/analysis/ioco_adapter_conformance_5518_t0/audit.json"
      - "research/analysis/ioco_adapter_conformance_5518_t0/execution-status.json"
      - "research/analysis/ioco_adapter_conformance_5518_t0/SHA256SUMS"
      - "research/analysis/ioco_adapter_conformance_5518_t0/execution-status.sha256"
  push:
    branches: [research/issue-5518-ioco-t0-20260930]
    paths:
      - ".github/workflows/issue-5518-ioco-audit.yml"
      - "research/analysis/ioco_adapter_conformance_5518_t0/RESULTS.md"
      - "research/analysis/ioco_adapter_conformance_5518_t0/ERRATA-PROVENANCE.md"
      - "research/analysis/ioco_adapter_conformance_5518_t0/raw.json"
      - "research/analysis/ioco_adapter_conformance_5518_t0/audit.json"
      - "research/analysis/ioco_adapter_conformance_5518_t0/execution-status.json"
      - "research/analysis/ioco_adapter_conformance_5518_t0/SHA256SUMS"
      - "research/analysis/ioco_adapter_conformance_5518_t0/execution-status.sha256"

permissions:
  contents: read

jobs:
  revalidate-committed-raw:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IMAGE: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
      PLATFORM: linux/amd64
      EXPERIMENT_DIR: research/analysis/ioco_adapter_conformance_5518_t0
    steps:
      - name: Checkout committed evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research/analysis/ioco_adapter_conformance_5518_t0
      - name: Pull digest-pinned image
        run: docker pull --platform "$PLATFORM" "$IMAGE"
      - name: Recompute audit only and verify all committed digests
        run: |
          mkdir -p "$RUNNER_TEMP/ioco-audit"
          python -c 'import json,os; s=json.load(open(os.path.join(os.environ["EXPERIMENT_DIR"],"execution-status.json"))); assert s["candidate_invocation_count"] == 1 and s["candidate_exit_code"] == 0 and s["independent_audit_container"] is True and s["audit_exit_code"] == 0 and s["retry"] is False'
          docker run --rm --network none --platform "$PLATFORM" --read-only \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$EXPERIMENT_DIR,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/ioco-audit,target=/out" \
            --workdir /src "$IMAGE" python -B /src/audit.py \
              --raw /src/raw.json --output /out/audit.json --root /src
          cmp "$EXPERIMENT_DIR/audit.json" "$RUNNER_TEMP/ioco-audit/audit.json"
          (cd "$EXPERIMENT_DIR" && sha256sum -c FREEZE.sha256 && sha256sum -c SHA256SUMS && sha256sum -c execution-status.sha256)
