name: public motor state package 2508 current main
on:
  workflow_dispatch:
  pull_request:
    paths:
      - runtime/motor_state_v1/native_result.py
      - runtime/motor_state_v1/test_native_result.py
      - runtime/motor_state_v1/adapter.py
      - .github/workflows/public-motor-state-package-2508-current-main.yml
  push:
    paths:
      - runtime/motor_state_v1/native_result.py
      - runtime/motor_state_v1/test_native_result.py
      - runtime/motor_state_v1/adapter.py
      - .github/workflows/public-motor-state-package-2508-current-main.yml
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest -v runtime/motor_state_v1/test_native_result.py
