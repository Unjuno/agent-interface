name: one-shot yesterday contained ref cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maintenance-prune-yesterday-contained-refs-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete exact audited contained refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --force origin '+refs/heads/*:refs/remotes/origin/*'

          failures=0
          deleted=0

          delete_exact() {
            branch="$1"
            expected="$2"
            ref="refs/remotes/origin/$branch"

            if ! git show-ref --verify --quiet "$ref"; then
              echo "ALREADY_GONE $branch"
              return 0
            fi

            actual="$(git rev-parse "$ref")"
            if [[ "$actual" != "$expected" ]]; then
              echo "SHA_MISMATCH $branch expected=$expected actual=$actual" >&2
              failures=$((failures + 1))
              return 0
            fi

            if ! git merge-base --is-ancestor "$ref" refs/remotes/origin/main; then
              echo "NOT_CONTAINED $branch" >&2
              failures=$((failures + 1))
              return 0
            fi

            echo "DELETE $branch @ $actual"
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              failures=$((failures + 1))
            fi
          }

          delete_exact "research/local-typed-readout-readiness-20260918-001" "e690e155aa00fb72a30586513caf9bfeec9a8a7d"
          delete_exact "research/planner-gap-envelope-rung0-20260918-001-check" "e690e155aa00fb72a30586513caf9bfeec9a8a7d"
          delete_exact "research/queryable-temporal-buffer-r0-1028" "e690e155aa00fb72a30586513caf9bfeec9a8a7d"

          echo "deleted=$deleted failures=$failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
