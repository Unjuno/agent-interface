name: golden CLI lifecycle path-covered audit 2265

on:
  pull_request:
    paths:
      - "research/integration/golden_cli_lifecycle_contract_successor_2259_v1/**"
      - ".github/workflows/golden-cli-lifecycle-path-covered-2265.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Compile exact successor payload
        run: python -m py_compile research/integration/golden_cli_lifecycle_contract_successor_2259_v1/audit.py
      - name: Print exact audit inputs
        working-directory: research/integration/golden_cli_lifecycle_contract_successor_2259_v1
        run: |
          pwd
          ls -la
          sha256sum RESULT.json SOURCE_MANIFEST.json audit.py
          python -c "import json; print(json.load(open('RESULT.json'))['status']); print(len(json.load(open('SOURCE_MANIFEST.json'))['sources']))"
      - name: Run independent formal audit
        working-directory: research/integration/golden_cli_lifecycle_contract_successor_2259_v1
        run: python audit.py
