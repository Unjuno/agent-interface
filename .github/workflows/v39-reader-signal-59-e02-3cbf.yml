name: v39-reader-signal-59-e02-retention
on:
  pull_request:
    paths:
      - 'research/doom/v39_reader_signal_59_e02_20261004_3cbf/**'
      - '.github/workflows/v39-reader-signal-59-e02-3cbf.yml'
  push:
    branches: [main]
    paths:
      - 'research/doom/v39_reader_signal_59_e02_20261004_3cbf/**'
permissions:
  contents: read
jobs:
  saved-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/doom/v39_reader_signal_59_e02_20261004_3cbf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Excluded method tests and saved retention (no native allocation replay)
        working-directory: research/doom/v39_reader_signal_59_e02_20261004_3cbf
        run: |
          python -B -m unittest -v test_candidate test_audit
          python -B verify_delivery.py
