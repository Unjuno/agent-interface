name: MAP01 task-relative deoptimization packaging gate #2988
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/doom/map01_normal_no_progress_deopt_v1/**'
      - 'research/doom/map01-deopt.Dockerfile'
      - '.github/workflows/map01-task-relative-deopt-2988.yml'
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned container
        run: docker build -f research/doom/map01-deopt.Dockerfile -t agent-interface-map01-deopt:2988 .
      - name: Run fresh matched cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for spec in '00 repeat_small 991400' '01 escalate 991400' '02 escalate 991401' '03 repeat_small 991401' '04 repeat_small 991402' '05 escalate 991402' '06 escalate 991403' '07 repeat_small 991403'; do
            read -r case arm seed <<<"$spec"
            mkdir -p "out/case-$case"
        docker run --rm --network none -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$GITHUB_WORKSPACE/out/case-$case:/out" agent-interface-map01-deopt:2988 bash -lc "Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & xv=\$!; openbox >/tmp/openbox.log 2>&1 & wm=\$!; trap 'kill \$wm \$xv 2>/dev/null || true' EXIT; python research/doom/map01_normal_no_progress_deopt_v1/run_case.py --out /out/result --arm $arm --seed $seed --source /workspace"
          done
      - name: Audit fresh matched block
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$GITHUB_WORKSPACE/out:/out" agent-interface-map01-deopt:2988 python research/doom/map01_normal_no_progress_deopt_v1/audit.py /out --plan /workspace/research/doom/map01_normal_no_progress_deopt_v1/plan.json --out /out/audit.json
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-task-relative-deopt-2988
          path: out
          if-no-files-found: error
