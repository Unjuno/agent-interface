name: map01-observation-preflight-2446
on:
  workflow_dispatch:
  push:
    paths:
      - "research/live_control/map01_observation_preflight_2446_v1/**"
      - ".github/workflows/map01-observation-preflight-2446.yml"
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
    steps:
      - name: Install pinned runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb libgl1 libglu1-mesa
          python -m pip install --no-cache-dir vizdoom==1.2.3
      - name: Fetch exact branch source
        run: |
          python -c "import urllib.request; u='https://raw.githubusercontent.com/Unjuno/agent-interface/REPLACE_SHA/research/live_control/map01_observation_preflight_2446_v1/audit.py'; open('audit.py','wb').write(urllib.request.urlopen(u).read())"
      - name: Run bounded preflight
        run: python audit.py
