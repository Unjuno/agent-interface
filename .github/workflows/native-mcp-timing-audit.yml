name: native MCP timing audit
on:
  pull_request:
    paths:
      - runtime/results/native-mcp-timed-01/**
      - runtime/results/native-mcp-managed-01/**
      - .github/workflows/native-mcp-timing-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Audit retained MCP timing evidence
        run: python runtime/results/native-mcp-timed-01/audit.py
      - name: Check timing helper
        run: python runtime/results/native-mcp-timed-01/timing.py