      - ".github/workflows/cli-v1-lineage-dispatch-2397.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile runtime/cli_v1/lineage.py research/integration/cli_v1_lineage_dispatch_2397_v1/test_lineage.py
      - run: python -m unittest discover -s research/integration/cli_v1_lineage_dispatch_2397_v1 -p 'test_*.py' -v
