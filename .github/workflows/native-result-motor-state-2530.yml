name: Native result MotorState bridge 2530
on:
  pull_request:
    paths:
      - 'runtime/motor_state_v1/**'
      - '.github/workflows/native-result-motor-state-2530.yml'
  push:
    branches:
      - 'research/native-result-motor-state-bridge-2530'
    paths:
      - 'runtime/motor_state_v1/**'
      - '.github/workflows/native-result-motor-state-2530.yml'
permissions:
  contents: read
jobs:
  pure-bridge:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim@sha256:1aaa65e4d7582de4f5296b189c1ae9f8ca0bb0e4e2d996431f9176d3a41a1a
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest -v runtime.motor_state_v1.test_adapter runtime.motor_state_v1.test_native_result
