name: map01-known-good-action-fixture-2472
on:
  workflow_dispatch:
  push:
    paths:
      - "research/live_control/map01_known_good_action_fixture_2472_v1/**"
      - ".github/workflows/map01-known-good-action-fixture-2472.yml"
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends xvfb libgl1 libglu1-mesa && python -m pip install --no-cache-dir vizdoom==1.2.3
      - run: python -c "import urllib.request; u='https://raw.githubusercontent.com/Unjuno/agent-interface/5e1c6bc1c40f46921050636a66210713b61c89e7/research/live_control/map01_known_good_action_fixture_2472_v1/audit.py'; open('audit.py','wb').write(urllib.request.urlopen(u).read())"
      - run: python audit.py | tee calibration.log
