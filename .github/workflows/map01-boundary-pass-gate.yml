name: MAP01 boundary pass-gate regression

on:
  pull_request:
    paths:
      - "research/doom/map01_policy_invalidation_clock_4559_v1/adapter_v13.py"
      - "research/doom/map01_policy_invalidation_clock_4559_v1/replay_real_observation_boundary_v13.py"
      - "research/doom/map01_policy_invalidation_clock_4559_v1/test_diagnostic_capture.py"
      - ".github/workflows/map01-boundary-pass-gate.yml"

permissions:
  contents: read

jobs:
  boundary-pass-gate:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run false-positive boundary gate tests in Python 3.12 container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            python:3.12-slim \
            python -B -m unittest -v research.doom.map01_policy_invalidation_clock_4559_v1.test_diagnostic_capture.BoundaryPassGateTests
      - name: Compile changed Python files in Python 3.12 container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            python:3.12-slim \
            python -B -m py_compile research/doom/map01_policy_invalidation_clock_4559_v1/replay_real_observation_boundary_v13.py research/doom/map01_policy_invalidation_clock_4559_v1/test_diagnostic_capture.py
