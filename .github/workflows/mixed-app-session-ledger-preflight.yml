name: Mixed-app session ledger preflight #2821
on:
  pull_request:
    paths:
      - "research/integration/mixed_app_long_session_2499/ledger_preflight.py"
      - ".github/workflows/mixed-app-session-ledger-preflight.yml"
  workflow_dispatch:
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils inkscape libreoffice chromium
      - name: Run bounded session ledger preflight
        run: python research/integration/mixed_app_long_session_2499/ledger_preflight.py
