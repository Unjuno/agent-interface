name: Composition held-out fixture v1
on:
  pull_request:
    paths:
      - 'research/analysis/composition_heldout_fixture_2068_v1/**'
  push:
    branches: [research/composition-heldout-fixture-2068-v1]
    paths:
      - 'research/analysis/composition_heldout_fixture_2068_v1/**'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Run frozen fixture
        run: |
          python -m py_compile research/analysis/composition_heldout_fixture_2068_v1/experiment.py
          python research/analysis/composition_heldout_fixture_2068_v1/experiment.py | tee result.json
      - uses: actions/upload-artifact@v4
        with:
          name: composition-heldout-fixture-v1
          path: result.json
          retention-days: 30
