    paths:
      - research/integration/golden_v3_second_domain_2246_v1/gtk_scorer/**
      - .github/workflows/golden-v3-second-domain-gtk-scorer-2586.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
