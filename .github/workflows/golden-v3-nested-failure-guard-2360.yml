name: golden-v3-nested-failure-guard-2360
on:
  pull_request:
    paths:
      - "runtime/cli_v1/golden_v3.py"
      - "research/integration/golden_v3_nested_failure_guard_2360_v1/**"
      - ".github/workflows/golden-v3-nested-failure-guard-2360.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile runtime/cli_v1/golden_v3.py research/integration/golden_v3_nested_failure_guard_2360_v1/test_adapter.py
      - run: python -m unittest discover -s research/integration/golden_v3_nested_failure_guard_2360_v1 -p 'test_*.py' -v
