name: issue4242-allocation02-construction
on:
  push:
    branches: [research/native-handle-destroy-generation-a2-20260923]
permissions:
  contents: read
jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install construction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox
          python -m pip install --disable-pip-version-check python-xlib==0.33 Pillow==11.3.0
      - name: Run exact-bridge no-input construction
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/issue4242-a2-construction"
          git rev-parse HEAD > "$RUNNER_TEMP/SOURCE_COMMIT"
          python research/integration/native_handle_destroy_generation_v1/allocation-02/construction.py "$OUT" > "$RUNNER_TEMP/construction.stdout" 2> "$RUNNER_TEMP/construction.stderr"
          cp "$OUT/CONSTRUCTION.json" "$RUNNER_TEMP/CONSTRUCTION.json"
      - name: Retain construction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4242-allocation02-construction
          path: |
            ${{ runner.temp }}/SOURCE_COMMIT
            ${{ runner.temp }}/CONSTRUCTION.json
            ${{ runner.temp }}/construction.stdout
            ${{ runner.temp }}/construction.stderr
          if-no-files-found: warn
