name: Issue 3628 passive Tk event witness construction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tk-construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk python3-xlib xvfb
      - name: Compile construction sources
        run: python3 -m compileall -q research/integration/issue_3628_tk_event_witness_v1
      - name: Run witness and adversarial audit tests
        run: xvfb-run -a python3 -m unittest discover -s research/integration/issue_3628_tk_event_witness_v1 -v
      - name: Run one-shot XTest construction probe
        run: xvfb-run -a python3 research/integration/issue_3628_tk_event_witness_v1/probe_xtest.py research/integration/issue_3628_tk_event_witness_v1/evidence/ci-xtest-${{ github.run_id }}
      - name: Verify construction evidence manifests
        run: python3 -c 'import hashlib,json,pathlib,sys; root=pathlib.Path("research/integration/issue_3628_tk_event_witness_v1/evidence"); bad=[]; manifests=list(root.glob("*/manifest.json")); [(bad.append(f"{m}: {row[\"path\"]}") if not (m.parent/row["path"]).is_file() or hashlib.sha256((m.parent/row["path"]).read_bytes()).hexdigest()!=row["sha256"] or len((m.parent/row["path"]).read_bytes())!=row["bytes"] else None) for m in manifests for row in json.loads(m.read_text())["files"]]; print(f"verified {len(manifests)} immutable construction manifests"); print("\n".join(bad)); sys.exit(bool(bad))'
