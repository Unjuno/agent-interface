name: Issue 3676 Docker audit mutation reproduction

on:
  pull_request:
    paths:
      - ".github/workflows/issue-3676-audit-probe.yml"
      - "research/integration/issue_3676_docker_audit_probe_v1/**"
  push:
    branches:
      - "research/issue-3676-docker-audit-probe-01"

jobs:
  frozen-audit-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen auditor mutation probe
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/issue-3676"
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE/research/integration/issue_3676_docker_audit_probe_v1:/probe:ro" \
            -v "$RUNNER_TEMP/issue-3676:/out" \
            python@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 \
            python /probe/reproduce.py > "$RUNNER_TEMP/issue-3676/stdout.json" 2> "$RUNNER_TEMP/issue-3676/stderr.txt"
          status=$?
          printf '%s' "$status" > "$RUNNER_TEMP/issue-3676/exit-code.txt"
          cat "$RUNNER_TEMP/issue-3676/stdout.json"
          test "$status" -eq 0
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-3676-docker-audit-probe
          path: ${{ runner.temp }}/issue-3676
          if-no-files-found: error
