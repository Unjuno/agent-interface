name: research preview readiness audit
on:
  pull_request:
    paths:
      - "release/RESEARCH_PREVIEW_READINESS_20260919.md"
      - "release/RESEARCH_PREVIEW_READINESS_20260919.json"
      - ".github/workflows/research-preview-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate readiness disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("release/RESEARCH_PREVIEW_READINESS_20260919.json").read_text())
          assert d["decision"]=="HOLD_RESEARCH_PREVIEW_NOT_READY"
          assert d["unsupported_claims_promoted"]==0
          assert d["required_gates"]==d["pass_scoped"]+d["hold"]
          text=Path("release/RESEARCH_PREVIEW_READINESS_20260919.md").read_text()
          for token in ("HOLD","PASS_SCOPED","H/T/D/C/U","Next bounded successor"):
              assert token in text
          print("READINESS_AUDIT_PASS")
          PY
