name: Issue 5440 T1 committed-evidence audit

on:
  pull_request:
    paths:
      - "research/analysis/hidden_cause_sensitivity_5440_t1/raw/formal.json"
      - "research/analysis/hidden_cause_sensitivity_5440_t1/raw/audit.json"
      - "research/analysis/hidden_cause_sensitivity_5440_t1/SHA256SUMS"

permissions:
  contents: read

jobs:
  audit-committed-raw:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IMAGE: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
      PLATFORM: linux/amd64
      EXPERIMENT_DIR: research/analysis/hidden_cause_sensitivity_5440_t1
      OUTPUT_DIR: ${{ runner.temp }}/audit-output
    steps:
      - name: Checkout committed evidence
        uses: actions/checkout@v4
      - name: Prepare output directory
        run: mkdir -p "$OUTPUT_DIR"
      - name: Pull digest-pinned image
        run: docker pull --platform "$PLATFORM" "$IMAGE"
      - name: Independently audit committed raw without rerunning candidate
        run: |
          docker run --rm --network none --platform "$PLATFORM" --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$EXPERIMENT_DIR,target=/src,readonly" \
            --mount "type=bind,source=$OUTPUT_DIR,target=/out" \
            --workdir /src "$IMAGE" sh -euc '
              python /src/audit.py --input /src/cases.json --raw /src/raw/formal.json --output /out/recomputed-audit.json
              cmp /src/raw/audit.json /out/recomputed-audit.json
              sha256sum -c /src/SHA256SUMS
            '
