name: issue4242-allocation02-formal
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  formal:
    if: github.event.pull_request.head.ref == 'research/native-handle-destroy-generation-a2-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Install bounded X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox
          python -m pip install --disable-pip-version-check python-xlib==0.33 Pillow==11.3.0
      - name: Retain source and environment provenance
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/SOURCE_COMMIT"
          sha256sum \
            research/integration/native_handle_destroy_generation_v1/allocation-02/construction.py \
            research/integration/native_handle_destroy_generation_v1/allocation-02/formal.py \
            research/integration/native_handle_destroy_generation_v1/allocation-02/audit.py \
            research/integration/native_handle_destroy_generation_v1/allocation-02/controls.py \
            research/live_control/native_handle_bridge_v1.py \
            research/live_control/scoped_target_handle_v3.py \
            research/live_control/scoped_target_handle_v2.py \
            research/live_control/scoped_target_handle_v1.py \
            research/live_control/coordinate_frame_transform_v1.py \
            research/live_control/native_tail_v1.py \
            runtime/backends/x11_v1/backend.py \
            runtime/backends/x11_v1/capture_artifacts.py \
            runtime/backends/x11_v1/session.py \
            runtime/core_v1/contract.py \
            runtime/core_v1/sequence.py > "$RUNNER_TEMP/SOURCE_SHA256SUMS.txt"
          python - <<'PY' > "$RUNNER_TEMP/ENVIRONMENT.json"
          import json,platform,sys,PIL,Xlib
          print(json.dumps({"platform":platform.platform(),"python":sys.version,
            "pillow":PIL.__version__,"xlib":list(Xlib.__version__)},sort_keys=True))
          PY
          Xvfb -version > "$RUNNER_TEMP/XVFB_VERSION.txt" 2>&1 || true
          openbox --version > "$RUNNER_TEMP/OPENBOX_VERSION.txt" 2>&1 || true
      - name: Execute single formal allocation and audits
        id: execute
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/issue4242-allocation02-formal"
          python research/integration/native_handle_destroy_generation_v1/allocation-02/formal.py "$OUT" > "$RUNNER_TEMP/formal.stdout" 2> "$RUNNER_TEMP/formal.stderr"
          F=$?
          printf '%s\n' "$F" > "$RUNNER_TEMP/FORMAL_EXIT"
          A=99; C=99
          if [ "$F" -eq 0 ] && [ -f "$OUT/RAW.json" ]; then
            cp "$OUT/RAW.json" "$RUNNER_TEMP/RAW.json"
            python research/integration/native_handle_destroy_generation_v1/allocation-02/audit.py "$OUT/RAW.json" "$RUNNER_TEMP/AUDIT.json" > "$RUNNER_TEMP/audit.stdout" 2> "$RUNNER_TEMP/audit.stderr"
            A=$?
            python research/integration/native_handle_destroy_generation_v1/allocation-02/controls.py "$OUT/RAW.json" "$RUNNER_TEMP/CONTROLS.json" > "$RUNNER_TEMP/controls.stdout" 2> "$RUNNER_TEMP/controls.stderr"
            C=$?
          fi
          printf '%s\n' "$A" > "$RUNNER_TEMP/AUDIT_EXIT"
          printf '%s\n' "$C" > "$RUNNER_TEMP/CONTROLS_EXIT"
          exit 0
      - name: Retain first outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4242-allocation02-formal-first-outcome
          path: |
            ${{ runner.temp }}/RAW.json
            ${{ runner.temp }}/AUDIT.json
            ${{ runner.temp }}/CONTROLS.json
            ${{ runner.temp }}/FORMAL_EXIT
            ${{ runner.temp }}/AUDIT_EXIT
            ${{ runner.temp }}/CONTROLS_EXIT
            ${{ runner.temp }}/formal.stdout
            ${{ runner.temp }}/formal.stderr
            ${{ runner.temp }}/audit.stdout
            ${{ runner.temp }}/audit.stderr
            ${{ runner.temp }}/controls.stdout
            ${{ runner.temp }}/controls.stderr
            ${{ runner.temp }}/SOURCE_COMMIT
            ${{ runner.temp }}/SOURCE_SHA256SUMS.txt
            ${{ runner.temp }}/ENVIRONMENT.json
            ${{ runner.temp }}/XVFB_VERSION.txt
            ${{ runner.temp }}/OPENBOX_VERSION.txt
          if-no-files-found: warn
      - name: Enforce execution and audit completion
        if: always()
        run: |
          test "$(cat "$RUNNER_TEMP/FORMAL_EXIT")" = "0"
          test "$(cat "$RUNNER_TEMP/AUDIT_EXIT")" = "0"
          test "$(cat "$RUNNER_TEMP/CONTROLS_EXIT")" = "0"
