name: Issue 5850 assay sensitivity T0
on:
  workflow_dispatch:
    inputs:
      allocation:
        description: Frozen allocation identifier; exact match required.
        required: true
        type: string
jobs:
  assay-sensitivity-t0:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/assay-sensitivity-5850-t0-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: issue-5850-assay-sensitivity-t0
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify frozen allocation and source digests
        shell: bash
        env:
          ALLOCATION_INPUT: ${{ inputs.allocation }}
        run: |
          set -euo pipefail
          root=research/analysis/assay_sensitivity_5850_t0_v1; f="$root/FREEZE.json"
          test "$GITHUB_REPOSITORY" = Unjuno/agent-interface
          test "$ALLOCATION_INPUT" = "$(jq -r .allocation "$f")"
          test "$GITHUB_REF_NAME" = "$(jq -r .branch "$f")"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(jq -r .schema "$f")" = 5850-assay-sensitivity-t0-v1
          for file in candidate.py fixture.json audit.py test_t0.py; do
            expected=$(jq -r --arg f "$file" '.sourceSha256[$f]' "$f")
            test "$(sha256sum "$root/$file" | cut -d' ' -f1)" = "$expected"
          done
          test "$(jq '.cases|length' "$root/fixture.json")" = "$(jq -r .expectedCases "$f")"
          test "$(jq -r .mutationControls "$f")" = 8
          mkdir -p "$RUNNER_TEMP/evidence"
          echo gate=PASS > "$RUNNER_TEMP/evidence/gate.txt"
      - name: Identify isolated Docker engine and pinned image
        shell: bash
        run: |
          set -euo pipefail
          root=research/analysis/assay_sensitivity_5850_t0_v1; e="$RUNNER_TEMP/evidence"
          image=$(jq -r .image "$root/FREEZE.json"); platform=$(jq -r .platform "$root/FREEZE.json")
          docker version --format '{{json .Server}}' > "$e/docker-server.json"
          docker pull --platform "$platform" "$image"
          docker image inspect "$image" --format '{"Id":"{{.Id}}","Os":"{{.Os}}","Architecture":"{{.Architecture}}","RepoDigests":{{json .RepoDigests}}}' > "$e/image.json"
      - name: Run candidate once in isolated container
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/research/analysis/assay_sensitivity_5850_t0_v1"; e="$RUNNER_TEMP/evidence"
          image=$(jq -r .image "$root/FREEZE.json"); platform=$(jq -r .platform "$root/FREEZE.json")
          set +e
          docker run --cidfile "$e/candidate.cid" --platform "$platform" --network none --read-only --pids-limit 32 --memory 128m --cpus 1 --security-opt no-new-privileges --cap-drop ALL -v "$root:/src:ro" -w /src "$image" python -B candidate.py fixture.json > "$e/raw.json" 2> "$e/candidate.stderr"
          rc=$?; set -e; if [ -s "$e/candidate.cid" ]; then cid=$(cat "$e/candidate.cid"); docker inspect "$cid" > "$e/candidate-container.json"; docker rm "$cid" >/dev/null; fi; echo "exit_code=$rc" >> "$GITHUB_OUTPUT"; test "$rc" = 0
      - name: Run independent auditor once in a separate container
        id: auditor
        if: always() && steps.candidate.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/research/analysis/assay_sensitivity_5850_t0_v1"; e="$RUNNER_TEMP/evidence"
          image=$(jq -r .image "$root/FREEZE.json"); platform=$(jq -r .platform "$root/FREEZE.json")
          set +e
          docker run --cidfile "$e/auditor.cid" --platform "$platform" --network none --read-only --pids-limit 32 --memory 128m --cpus 1 --security-opt no-new-privileges --cap-drop ALL -v "$root:/src:ro" -v "$e:/e:ro" -w /src "$image" python -B audit.py /e/raw.json > "$e/audit.json" 2> "$e/auditor.stderr"
          rc=$?; set -e; if [ -s "$e/auditor.cid" ]; then cid=$(cat "$e/auditor.cid"); docker inspect "$cid" > "$e/auditor-container.json"; docker rm "$cid" >/dev/null; fi; echo "exit_code=$rc" >> "$GITHUB_OUTPUT"; test "$rc" = 0
          jq -e '.status == "PASS_METHOD_SCOPED" and .candidate_matches_oracle == true and .rejected_mutations == 8' "$e/audit.json" >/dev/null
      - name: Retain first outcome without retry
        if: always()
        shell: bash
        env:
          CANDIDATE_RC: ${{ steps.candidate.outputs.exit_code || 'NOT_RUN' }}
          AUDITOR_RC: ${{ steps.auditor.outputs.exit_code || 'NOT_RUN' }}
        run: |
          set -euo pipefail
          root=research/analysis/assay_sensitivity_5850_t0_v1; e="$RUNNER_TEMP/evidence"
          out="$root/results/5850-ASSAY-SENSITIVITY-T0-20261001-01"; mkdir -p "$out"
          cp -a "$e/." "$out/" 2>/dev/null || true
          if [ "$CANDIDATE_RC" = 0 ] && [ "$AUDITOR_RC" = 0 ] && jq -e '.status == "PASS_METHOD_SCOPED"' "$out/audit.json" >/dev/null 2>&1; then status=PASS_METHOD_SCOPED; else status=STOP_OR_FAIL_FIRST_OUTCOME; fi
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg c "$CANDIDATE_RC" --arg a "$AUDITOR_RC" --arg status "$status" '{source_sha:$sha,run_id:$run,candidate_invocations:(if $c=="NOT_RUN" then 0 else 1 end),candidate_exit:$c,auditor_invocations:(if $a=="NOT_RUN" then 0 else 1 end),auditor_exit:$a,status:$status}' > "$out/RUN.json"
          (cd "$out" && sha256sum raw.json audit.json docker-server.json image.json > SHA256SUMS) 2>/dev/null || true
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$out"; git commit -m 'research(#5850): retain assay-sensitivity T0 outcome'; git push origin "HEAD:$GITHUB_REF"
          test "$status" = PASS_METHOD_SCOPED
