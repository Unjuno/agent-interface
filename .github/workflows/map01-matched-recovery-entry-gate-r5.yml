name: MAP01 matched recovery entry gate r5

on:
  pull_request:
    paths:
      - .github/workflows/map01-matched-recovery-entry-gate-r5.yml
      - research/analysis/map01_matched_recovery_entry_gate_1866_r5/**

permissions:
  contents: read

jobs:
  execute-r5-classifier:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Fetch exact PR-head r5 sources
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request
          sha=os.environ["SOURCE_SHA"]
          repo=os.environ["REPO"]
          root=f"https://raw.githubusercontent.com/{repo}/{sha}/research/analysis/map01_matched_recovery_entry_gate_1866_r5"
          out=pathlib.Path("/tmp/r5"); out.mkdir()
          for name in ("run.py","audit.py","SNAPSHOT.json"):
              data=urllib.request.urlopen(f"{root}/{name}",timeout=30).read()
              (out/name).write_bytes(data)
              print(name,len(data))
          print("SOURCE_SHA",sha)
          PY
      - name: Execute deterministic r5 classifier and audit
        run: |
          cd /tmp/r5
          python -B run.py formal-ci
          python -B audit.py formal-ci
