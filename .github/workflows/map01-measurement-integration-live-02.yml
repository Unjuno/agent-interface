name: MAP01 measurement integration live 02

on:
  push:
    paths:
      - '.github/workflows/map01-measurement-integration-live-02.yml'

permissions:
  contents: read

jobs:
  measurement-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen research state
        uses: actions/checkout@v4

      - name: Set up CPython 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install X11 and ViZDoom dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox wmctrl libopenal1 libsdl2-2.0-0 libgl1
          python -m pip install --upgrade pip
          python -m pip install \
            'vizdoom==1.3.0' pillow python-xlib numpy openpyxl

      - name: Record runner environment
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            python --version
            python - <<'PY'
          import vizdoom
          from pathlib import Path
          print('vizdoom', vizdoom.__version__)
          print('vizdoom_package', Path(vizdoom.__file__).parent)
          print('freedoom2_exists', (Path(vizdoom.__file__).parent / 'freedoom2.wad').is_file())
          PY
            python -m pip freeze
            dpkg-query -W xvfb openbox wmctrl libopenal1 libsdl2-2.0-0 libgl1
          } > runner-environment.txt
          cat runner-environment.txt

      - name: Revalidate frozen construction and preregistration
        shell: bash
        run: |
          set -euo pipefail
          python research/doom/test_map01_scorer_stdio_adapter_v1.py
          python research/doom/test_session_map01_v13.py
          python research/doom/test_audit_map01_measurement_integration_v1.py
          python research/doom/test_preregister_map01_measurement_integration_v2.py

      - name: Run frozen one-shot MAP01 measurement allocation
        shell: bash
        run: |
          set -euo pipefail
          python research/doom/probe_map01_measurement_integration_v1.py \
            --out results-local/doom/map01-measurement-integration-live-02 \
            --seed 990613 | tee formal-audit.stdout

      - name: Upload first-outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-measurement-integration-live-02
          if-no-files-found: warn
          retention-days: 30
          path: |
            results-local/doom/map01-measurement-integration-live-02/**
            formal-audit.stdout
            runner-environment.txt
