name: one-shot remove completed maintenance refs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maintenance-remove-final-maintenance-refs-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete exact completed maintenance refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --force origin '+refs/heads/*:refs/remotes/origin/*'

          delete_exact() {
            branch="$1"
            expected="$2"
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "ALREADY_GONE $branch"
              return 0
            fi
            actual="$(git rev-parse "$ref")"
            if [[ "$actual" != "$expected" ]]; then
              echo "SHA_MISMATCH $branch expected=$expected actual=$actual" >&2
              exit 1
            fi
            git push origin --delete "$branch"
          }

          delete_exact "maintenance/prune-finished-refs-20260918-3" "d7a6607e24e1f952e4d7693118b8dcc4eb261166"
          delete_exact "maintenance/remove-prune-b5-20260918" "83c39f5b65889cb36ca470e9eecde0887f406cf9"
