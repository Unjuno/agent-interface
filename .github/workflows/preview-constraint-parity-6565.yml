name: preview-constraint-parity-6565

on:
  pull_request:
    paths:
      - 'research/analysis/preview_constraint_parity_6565_t0_20261002/**'
      - '.github/workflows/preview-constraint-parity-6565.yml'
      - 'research/analysis/README.md'
      - 'research/analysis/check_index.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: research/analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the complete analysis subtree is present
        run: |
          python - <<'PY'
          import os
          import subprocess
          output = subprocess.check_output(
              ["git", "ls-tree", "-r", "-z", "--name-only", "HEAD", "--", "research/analysis/"]
          )
          paths = [os.fsdecode(path) for path in output.split(b"\0") if path]
          missing = [path for path in paths if not os.path.lexists(path)]
          if not paths or missing:
              raise SystemExit(f"Incomplete analysis checkout: {missing!r}")
          print(f"Complete analysis checkout: {len(paths)} tracked paths")
          PY
          git diff --exit-code HEAD -- research/analysis
      - run: python -B -m unittest discover -s research/analysis/preview_constraint_parity_6565_t0_20261002 -p 'test_*.py' -v
      - run: python -B -m unittest discover -s research/analysis -p 'test_check_index.py' -v
      - run: python research/analysis/check_index.py --strict
