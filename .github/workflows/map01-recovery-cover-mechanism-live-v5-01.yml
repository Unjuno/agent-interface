name: MAP01 recovery cover mechanism live v5 01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map01-recovery-cover-mechanism-live-v5-01.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: map01-recovery-cover-mechanism-live-v5-01
  cancel-in-progress: false

env:
  ALLOCATION_ID: map01-recovery-cover-mechanism-live-v5-01
  WORKFLOW_PATH: .github/workflows/map01-recovery-cover-mechanism-live-v5-01.yml
  FROZEN_RESEARCH_COMMIT: bb5fb7bdba24834a636c0d15d928147a40c51524
  OUT: results-local/doom/map01-recovery-cover-mechanism-live-v5-01

jobs:
  mechanism-block:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert frozen experimental sources unchanged
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${FROZEN_RESEARCH_COMMIT}^{commit}"
          git diff --exit-code "$FROZEN_RESEARCH_COMMIT" -- \
            research/doom/map01_recovery_cover_matched_v2_runner.py \
            research/doom/map01_recovery_cover_mechanism_v4_measurement.py \
            research/doom/audit_map01_recovery_cover_mechanism_v4.py \
            research/doom/map01_recovery_cover_mechanism_v5_runner.py \
            research/doom/audit_map01_recovery_cover_mechanism_v5.py \
            research/doom/map01_recovery_cover_mechanism_v5_prereg.json \
            research/doom/test_map01_recovery_cover_mechanism_v5.py \
            research/doom/test_audit_map01_recovery_cover_mechanism_v5.py \
            research/doom/session_map01_v13.py \
            research/doom/session_map01_v12.py \
            research/doom/doom_retained_input_backend_v3.py \
            research/live_control/input_transition_owner_v3.py \
            research/doom/container_interruption_v1/occupancy.py \
            research/doom/fixtures/map01-threat-contact-v2/fixture.json \
            research/doom/audit_map01_terminal_score_agreement_v1.py \
            research/orchestration/o3-g7/global-owner/formal_allocation_global_owner_v1.py

      - name: Claim workflow-path-global allocation owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF_NAME" = "main"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/map01-recovery-cover-mechanism-live-v5-01.yml/runs?event=push&per_page=100"
          visible=0
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" > allocation-runs.json
            if python - "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          payload=json.load(open('allocation-runs.json',encoding='utf-8')); current=int(sys.argv[1])
          ids={int(row['id']) for row in payload.get('workflow_runs',[]) if isinstance(row,dict) and 'id' in row}
          raise SystemExit(0 if current in ids else 1)
          PY
            then visible=1; break; fi
            sleep 2
          done
          test "$visible" = 1
          python research/orchestration/o3-g7/global-owner/formal_allocation_global_owner_v1.py \
            allocation-runs.json \
            --current-run-id "$GITHUB_RUN_ID" \
            --workflow-path "$WORKFLOW_PATH" \
            --allocation-id "$ALLOCATION_ID" \
            --required-branch main \
            --out allocation-owner.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ViZDoom and X11 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl libopenal1 libsdl2-2.0-0 libgl1
          python -m pip install --upgrade pip
          python -m pip install 'vizdoom==1.3.0' pillow python-xlib numpy openpyxl

      - name: Revalidate v5 repair and unchanged v4 scientific contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=research/doom:research/live_control:research/orchestration/o3-g7/global-owner
          python -m py_compile \
            research/doom/map01_recovery_cover_matched_v2_runner.py \
            research/doom/map01_recovery_cover_mechanism_v4_measurement.py \
            research/doom/audit_map01_recovery_cover_mechanism_v4.py \
            research/doom/map01_recovery_cover_mechanism_v5_runner.py \
            research/doom/audit_map01_recovery_cover_mechanism_v5.py \
            research/doom/container_interruption_v1/occupancy.py
          python research/doom/test_map01_recovery_cover_matched_v2_runner.py
          python research/doom/test_map01_recovery_cover_mechanism_v4.py
          python research/doom/test_map01_recovery_cover_mechanism_v5.py
          python research/doom/test_audit_map01_recovery_cover_mechanism_v5.py
          python research/doom/container_interruption_v1/test_occupancy.py
          python research/orchestration/o3-g7/global-owner/test_formal_allocation_global_owner_v1.py
          python research/doom/test_audit_map01_terminal_score_agreement_v1.py

      - name: Execute first and only formal v5 mechanism block
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=research/doom:research/live_control
          python research/doom/map01_recovery_cover_mechanism_v5_runner.py \
            --out "$OUT" \
            --launch-owner allocation-owner.json | tee mechanism-runner.stdout

      - name: Enforce terminal scorer agreement for all six arms
        shell: bash
        run: |
          set -euo pipefail
          for pair in 01 02 03; do
            for arm in coast_control bounded_recovery; do
              python research/doom/audit_map01_terminal_score_agreement_v1.py \
                "$OUT/pair-$pair/$arm/runtime" \
                --out "$OUT/pair-$pair/$arm/terminal-score-audit.json"
            done
          done

      - name: Apply unchanged v4 thresholds through v5 audit adapter
        shell: bash
        run: |
          set -euo pipefail
          python research/doom/audit_map01_recovery_cover_mechanism_v5.py \
            "$OUT" \
            --out "$OUT/formal-audit.json" | tee mechanism-audit.stdout

      - name: Upload immutable first outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-recovery-cover-mechanism-live-v5-01-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            allocation-runs.json
            allocation-owner.json
            mechanism-runner.stdout
            mechanism-audit.stdout
            results-local/doom/map01-recovery-cover-mechanism-live-v5-01/**
