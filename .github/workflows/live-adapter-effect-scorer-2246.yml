name: live-adapter-effect-scorer-2246
on:
  pull_request:
    paths:
      - "research/integration/live_adapter_effect_scorer_2246_v1/**"
      - ".github/workflows/live-adapter-effect-scorer-2246.yml"
jobs:
  scorer:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    steps:
      - name: Fetch immutable sources and retained report
        env:
          PIN: ${{ github.sha }}
          BASE: https://raw.githubusercontent.com/Unjuno/agent-interface
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          files = [
            "research/__init__.py",
            "research/integration/__init__.py",
            "research/integration/live_adapter_effect_scorer_2246_v1/__init__.py",
            "research/integration/live_adapter_effect_scorer_2246_v1/scorer.py",
            "research/integration/live_adapter_effect_scorer_2246_v1/test_scorer.py",
          ]
          for rel in files:
              path=pathlib.Path(rel); path.parent.mkdir(parents=True,exist_ok=True)
              data=urllib.request.urlopen(f"{os.environ['BASE']}/{os.environ['PIN']}/{rel}",timeout=30).read()
              path.write_bytes(data)
              print("SOURCE_SHA256", rel, hashlib.sha256(data).hexdigest())
          report=urllib.request.urlopen(f"{os.environ['BASE']}/{os.environ['PIN']}/runtime/results/golden-desktop-app-server-v3-live-01/golden-report.json",timeout=30).read()
          pathlib.Path("/tmp/golden-report.json").write_bytes(report)
          print("REPORT_SHA256", hashlib.sha256(report).hexdigest())
          PY
      - name: Run unit tests and score retained evidence
        run: |
          python -m unittest discover -s research/integration/live_adapter_effect_scorer_2246_v1 -t . -p 'test_*.py' -v
          python research/integration/live_adapter_effect_scorer_2246_v1/scorer.py /tmp/golden-report.json
      - name: Cleanup
        if: always()
        run: |
          rm -rf research /tmp/golden-report.json
          test ! -e research
          test ! -e /tmp/golden-report.json
