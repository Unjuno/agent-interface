name: Runtime unified CLI v1

on:
  push:
    branches:
      - main
      - integration/runtime-cli-v1-20260917
    paths:
      - 'runtime/cli_v1/**'
      - 'runtime/motor_state_v1/**'
      - 'runtime/selector_v1/**'
      - 'runtime/core_v1/**'
      - 'runtime/backends/**'
      - 'runtime/distribution_v2/**'
      - '.github/workflows/runtime-cli-v1.yml'
  pull_request:
    paths:
      - 'runtime/cli_v1/**'
      - 'runtime/motor_state_v1/**'
      - 'runtime/selector_v1/**'
      - 'runtime/core_v1/**'
      - 'runtime/backends/**'
      - 'runtime/distribution_v2/**'
      - '.github/workflows/runtime-cli-v1.yml'

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            runtime/cli_v1
            runtime/motor_state_v1
            runtime/selector_v1
            runtime/core_v1
            runtime/backends
            runtime/backends/x11_v1
            runtime/distribution_v2
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sparse checkout includes the X11 selector backend
        run: python -c "from pathlib import Path; required = ['runtime/backends/x11_v1/__init__.py', 'runtime/backends/x11_v1/backend.py', 'runtime/backends/x11_v1/session.py']; missing = [p for p in required if not Path(p).is_file()]; assert not missing, 'missing sparse-checkout files: {}'.format(missing)"
      - name: Compile unified runtime surface
        run: python -m compileall -q runtime/cli_v1 runtime/motor_state_v1 runtime/selector_v1
      - name: Run CLI/API tests
        run: python -m unittest -v runtime.cli_v1.test_attempt runtime.cli_v1.test_cli runtime.cli_v1.test_review runtime.cli_v1.test_observe runtime.cli_v1.test_golden_v3 runtime.cli_v1.test_receipt runtime.cli_v1.test_receipt_motor_state runtime.selector_v1.test_selector runtime.motor_state_v1.test_adapter
      - name: Run machine-readable doctor
        run: python -m runtime.cli_v1 doctor
