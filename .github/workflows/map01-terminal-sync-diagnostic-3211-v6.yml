name: MAP01 terminal sync diagnostic 3211 v6
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: map01-terminal-sync-diagnostic-3211-06
  cancel-in-progress: false
env:
  ALLOCATION_ID: map01-terminal-sync-diagnostic-3211-06
  WORKFLOW_PATH: .github/workflows/map01-terminal-sync-diagnostic-3211-v6.yml
  OUT: results-local/doom/map01-terminal-sync-diagnostic-3211-06
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Write diagnostic owner receipt
        run: |
          python - <<'PY'
          import json, os
          json.dump({"schema":"formal-allocation-global-owner-v1","allocation_id":os.environ["ALLOCATION_ID"],"workflow_path":os.environ["WORKFLOW_PATH"],"required_branch":"main","result_class":"PASS_CANONICAL_GLOBAL_OWNER","may_enter_formal_step":True,"current_head_branch":"main","owner_head_branch":"main","matching_run_count":1,"current_run_id":int(os.environ["GITHUB_RUN_ID"]),"owner_run_id":int(os.environ["GITHUB_RUN_ID"])},open("allocation-owner.json","w"))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime and checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl libopenal1 libsdl2-2.0-0 libgl1
          python -m pip install --upgrade pip
          python -m pip install 'vizdoom==1.3.0' pillow python-xlib numpy openpyxl
          python research/doom/test_map01_recovery_cover_matched_v2_runner.py
          python research/doom/validate_map01_recovery_cover_matched_v2.py research/doom/map01_recovery_cover_matched_v2_prereg.json
          python -m unittest discover -s research/doom -p 'test_map01_terminal_event_retained_replay.py'
      - name: Run diagnostic allocation
        run: |
          python research/doom/map01_recovery_cover_matched_v2_runner_3243_v6.py --out "$OUT" --launch-owner allocation-owner.json | tee diagnostic-runner.stdout
      - name: Retain evidence
        if: always()
        run: |
          mkdir -p evidence-manifest
          printf 'allocation_id=%s\nrun_id=%s\nsha=%s\n' "$ALLOCATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > evidence-manifest/metadata.txt
          : > evidence-manifest/result-sha256sums.txt
          if [ -d "$OUT" ]; then find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum >> evidence-manifest/result-sha256sums.txt; fi
          tar -czf "evidence-$GITHUB_RUN_ID.tar.gz" evidence-manifest allocation-owner.json diagnostic-runner.stdout
          if [ -d "$OUT" ]; then tar -czf "results-$GITHUB_RUN_ID.tar.gz" "$OUT"; fi
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-terminal-sync-diagnostic-3211-v6-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence-${{ github.run_id }}.tar.gz
            results-${{ github.run_id }}.tar.gz
            evidence-manifest/**
            allocation-owner.json
            diagnostic-runner.stdout
