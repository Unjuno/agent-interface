name: Publish research release

on:
  push:
    branches: [main]
    paths:
      - '.release/version'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (example: 0.0.2-research.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION='${{ inputs.version }}'
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(tr -d '[:space:]' < .release/version)"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build auditable research bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p dist
          tar -czf "dist/agent-interface-${VERSION}-research.tar.gz" \
            README.md RESEARCH.md ROADMAP.md CHANGELOG.md CONTRIBUTING.md SECURITY.md \
            CITATION.cff requirements-research.txt docs research site
          sha256sum "dist/agent-interface-${VERSION}-research.tar.gz" \
            > "dist/agent-interface-${VERSION}-research.tar.gz.sha256"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.tag }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Agent Interface $TAG — Research Preview" \
            --notes-file .release/NOTES.md \
            --prerelease
