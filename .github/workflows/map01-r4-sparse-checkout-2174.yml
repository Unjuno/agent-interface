name: MAP01 r4 sparse checkout successor

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    timeout-minutes: 4
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - name: Sparse blobless checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/doom/map01_r4_sparse_checkout_successor_2174
            research/doom/map01_v12_physical_occupancy_live_r1_v1/session_entry.py
          sparse-checkout-cone-mode: false
      - name: Run source-only gate
        run: |
          python research/doom/map01_r4_sparse_checkout_successor_2174/import_gate.py | tee r4-sparse-result.json
      - name: Upload first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-r4-sparse-checkout-result
          path: r4-sparse-result.json
