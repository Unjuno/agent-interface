name: cli golden-v3 adapter 2292
on:
  pull_request:
    paths:
      - "runtime/cli_v1/golden_v3.py"
      - "runtime/cli_v1/test_golden_v3.py"
      - "runtime/cli_v1/README.md"
      - ".github/workflows/cli-golden-v3-adapter-2292.yml"
jobs:
  contract:
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - name: Fetch immutable PR source bytes
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          mkdir -p runtime/cli_v1
          python - "${SHA}" <<'PY'
          import pathlib,sys,urllib.request
          sha=sys.argv[1]
          base=f"https://raw.githubusercontent.com/Unjuno/agent-interface/{sha}/runtime/cli_v1"
          out=pathlib.Path("runtime/cli_v1")
          for name in ("api.py","golden_v3.py","test_golden_v3.py"):
              with urllib.request.urlopen(f"{base}/{name}",timeout=30) as r:
                  (out/name).write_bytes(r.read())
          PY
      - run: python -m py_compile runtime/cli_v1/api.py runtime/cli_v1/golden_v3.py runtime/cli_v1/test_golden_v3.py
      - run: python -m unittest -v runtime.cli_v1.test_golden_v3
