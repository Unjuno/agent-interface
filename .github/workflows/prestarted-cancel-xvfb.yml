name: Prestarted cancellation supervisor Xvfb

on:
  pull_request:
    paths:
      - '.github/workflows/prestarted-cancel-xvfb.yml'
      - 'runtime/cli_v1/mcp_server.py'
      - 'runtime/cli_v1/owned_guarded_session.py'
      - 'runtime/cli_v1/test_mcp_xvfb_blocked_release_integration.py'
      - 'runtime/guarded_x11_v1/cancel_supervisor.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prestarted-cancel-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            runtime
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install X11 test dependencies
        run: |
          python -m pip install --disable-pip-version-check python-xlib==0.33 Pillow==10.2.0 numpy==1.26.4 mcp==1.30.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-xkb-utils
      - name: Run isolated prestarted-supervisor Xvfb scenario
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$RUNNER_TEMP/prestarted-xvfb.auth"
          : > "$AUTH"
          Xvfb :88 -screen 0 1024x768x24 -ac >"$RUNNER_TEMP/prestarted-xvfb.log" 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 0.5
          export DISPLAY=:88 XAUTHORITY="$AUTH"
          export AGENT_INTERFACE_XVFB_PID="$XVFB_PID"
          export AGENT_INTERFACE_MCP_XVFB_TEST=1
          export AGENT_INTERFACE_MCP_XVFB_CANCEL_ACK_WITHHOLD_S=0
          export AGENT_INTERFACE_MCP_XVFB_TRACE_OWNER_PROCESS_METHODS=1
          export AGENT_INTERFACE_MCP_XVFB_PRESTARTED_CANCEL_SUPERVISOR=1
          export AGENT_INTERFACE_MCP_XVFB_BLOCKED_RELEASE_RESULT="$RUNNER_TEMP/prestarted-cancel-xvfb.json"
          timeout --signal=TERM --kill-after=10s 210s python -m unittest -v runtime.cli_v1.test_mcp_xvfb_blocked_release_integration
      - name: Retain isolated prestarted-supervisor Xvfb receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prestarted-cancel-xvfb
          path: |
            ${{ runner.temp }}/prestarted-cancel-xvfb.json
            ${{ runner.temp }}/prestarted-cancel-xvfb.observation.png
            ${{ runner.temp }}/prestarted-xvfb.log
          if-no-files-found: error
