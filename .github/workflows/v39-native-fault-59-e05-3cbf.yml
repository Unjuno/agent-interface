name: v39-native-fault-59-e05-3cbf
on:
  pull_request:
    paths:
      - 'research/doom/v39_native_fault_59_e05_20261004_3cbf/**'
      - '.github/workflows/v39-native-fault-59-e05-3cbf.yml'
  push:
    branches: [main]
    paths:
      - 'research/doom/v39_native_fault_59_e05_20261004_3cbf/**'
permissions:
  contents: read
jobs:
  e05-saved-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/doom/v39_native_fault_59_e05_20261004_3cbf
            research/doom/v39_native_fault_59_e03_20261004_3cbf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure-method X11 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install python-xlib==0.33
      - name: Method controls only; never rerun consumed native or official auditor
        working-directory: research/doom/v39_native_fault_59_e05_20261004_3cbf
        run: python -B -O -W error -m unittest discover -v
      - name: Verify immutable first audit, native/export inventory and receipts
        working-directory: research/doom/v39_native_fault_59_e05_20261004_3cbf
        run: python -B verify_delivery.py
