name: MAP01 recovery cover matched v2 formal 3189

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: map01-recovery-cover-matched-v2-formal-3189
  cancel-in-progress: false

env:
  ALLOCATION_ID: map01-recovery-cover-matched-live-v2-01
  WORKFLOW_PATH: .github/workflows/map01-recovery-cover-matched-v2-formal-3189.yml
  OUT: results-local/doom/map01-recovery-cover-matched-v2-formal-3189

jobs:
  formal-allocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen v2 source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/doom/map01_recovery_cover_matched_v2_runner.py)" = "59c071c3453b516ff370e1b3533511b1f3ce486f"
          test "$(git rev-parse HEAD:research/doom/validate_map01_recovery_cover_matched_v2.py)" = "31bac309e022801847c1579962deaebe6ae4bb67"
          test "$(git rev-parse HEAD:research/doom/map01_recovery_cover_matched_v2_prereg.json)" = "d5c8e98e7ded7348e4b6382bcfab3bd86dec55e0"
          test "$(git rev-parse HEAD:research/orchestration/o3-g7/global-owner/formal_allocation_global_owner_v1.py)" = "f07f928f67a7a6c670d399efb23d67246506c802"

      - name: Claim isolated canonical owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF_NAME" = "main"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/map01-recovery-cover-matched-v2-formal-3189.yml/runs?event=$GITHUB_EVENT_NAME&per_page=100"
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" > allocation-runs.json
            if python - "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          p=json.load(open("allocation-runs.json",encoding="utf-8")); n=int(sys.argv[1])
          raise SystemExit(0 if n in {int(x["id"]) for x in p.get("workflow_runs",[]) if "id" in x} else 1)
          PY
            then break; fi
            sleep 2
          done
          python research/orchestration/o3-g7/global-owner/formal_allocation_global_owner_v1.py allocation-runs.json --current-run-id "$GITHUB_RUN_ID" --workflow-path "$WORKFLOW_PATH" --allocation-id "$ALLOCATION_ID" --required-branch main --out allocation-owner.json
          python - <<'PY'
          import json
          assert json.load(open("allocation-owner.json"))["result_class"] == "PASS_CANONICAL_OWNER"
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ViZDoom runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl libopenal1 libsdl2-2.0-0 libgl1
          python -m pip install --upgrade pip
          python -m pip install 'vizdoom==1.3.0' pillow python-xlib numpy openpyxl

      - name: Revalidate construction
        shell: bash
        run: |
          set -euo pipefail
          python research/doom/test_map01_recovery_cover_matched_v2_runner.py
          python research/doom/validate_map01_recovery_cover_matched_v2.py research/doom/map01_recovery_cover_matched_v2_prereg.json

      - name: Run one matched formal allocation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          python research/doom/map01_recovery_cover_matched_v2_runner.py --out "$OUT" --launch-owner allocation-owner.json | tee formal-runner.stdout

      - name: Retain first outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-manifest
          echo "allocation_id=$ALLOCATION_ID" > evidence-manifest/metadata.txt
          echo "github_run_id=$GITHUB_RUN_ID" >> evidence-manifest/metadata.txt
          echo "github_sha=$GITHUB_SHA" >> evidence-manifest/metadata.txt
          : > evidence-manifest/result-sha256sums.txt
          if [ -d "$OUT" ]; then find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum >> evidence-manifest/result-sha256sums.txt; fi
          test -s evidence-manifest/metadata.txt
          test -s evidence-manifest/result-sha256sums.txt
          tar -czf "evidence-$GITHUB_RUN_ID.tar.gz" evidence-manifest allocation-owner.json allocation-runs.json formal-runner.stdout "$OUT"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-cover-matched-v2-formal-3189-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence-${{ github.run_id }}.tar.gz
            evidence-manifest/**
            allocation-owner.json
            allocation-runs.json
            formal-runner.stdout
            ${{ env.OUT }}/**
