name: golden-cli-lifecycle-contract-successor
on:
  pull_request:
    paths:
      - "research/integration/golden_cli_lifecycle_contract_successor_2259_v1/**"
      - ".github/workflows/golden-cli-lifecycle-contract-successor.yml"
  push:
    paths:
      - "research/integration/golden_cli_lifecycle_contract_successor_2259_v1/**"
      - ".github/workflows/golden-cli-lifecycle-contract-successor.yml"
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: native independent audit
        run: python3 research/integration/golden_cli_lifecycle_contract_successor_2259_v1/audit.py
      - name: fresh container-equivalent audit
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/research/integration/golden_cli_lifecycle_contract_successor_2259_v1 python:3.12-slim             sh -c "apt-get update -qq && apt-get install -y -qq git >/dev/null && python audit.py"
