name: MAP01 v12 physical occupancy R1

on:
  pull_request:
    paths:
      - ".github/workflows/map01-v12-physical-occupancy-r1.yml"
      - "research/doom/map01_v12_physical_occupancy_live_r1_v1/**"
      - "research/doom/session_map01_v13.py"
      - "research/doom/doom_retained_input_backend_v3.py"
      - "research/live_control/input_transition_owner_v3.py"
      - "research/doom/fixtures/map01-threat-contact-v2/**"
      - "research/measurement/input_owner_v12_physical_edge_v1/**"
      - "research/live_control/p0_live_causal_effect_x11_v1/runner.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map01-v12-physical-occupancy-r1
  cancel-in-progress: false

jobs:
  map01-r1:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install isolated X11 and ViZDoom runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xauth libgl1 libglu1-mesa libasound2
          python -m pip download --only-binary=:all: --dest /tmp/map01-wheels 'vizdoom==1.3.0' pillow 'python-xlib' numpy
          python -m pip install --no-index --find-links /tmp/map01-wheels 'vizdoom==1.3.0' pillow 'python-xlib' numpy

      - name: Reconstruct exact retained v12 source
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("research/live_control/p0_live_causal_effect_x11_v1")))
          from runner import reconstruct_v12
          out = Path("work/map01-r1/v12")
          out.mkdir(parents=True, exist_ok=False)
          paths = reconstruct_v12(Path("."), out)
          print({"input_owner": str(paths[0]), "adapter": str(paths[1])})
          PY

      - name: Run frozen preflight
        run: |
          python research/doom/map01_v12_physical_occupancy_live_r1_v1/preflight.py --source . --v12 work/map01-r1/v12 | tee work/map01-r1/PREFLIGHT.stdout

      - name: Run at most one excluded construction session
        id: construction
        continue-on-error: true
        run: |
          mkdir -p work/map01-r1
          xvfb-run -a python research/doom/map01_v12_physical_occupancy_live_r1_v1/construction_runner.py --source . --v12 work/map01-r1/v12 --out work/map01-r1/construction | tee work/map01-r1/CONSTRUCTION.stdout

      - name: Run exactly one three-session formal invocation after construction PASS
        if: steps.construction.outcome == 'success'
        id: formal
        continue-on-error: true
        run: |
          xvfb-run -a python research/doom/map01_v12_physical_occupancy_live_r1_v1/formal_runner.py --source . --v12 work/map01-r1/v12 --out work/map01-r1/formal | tee work/map01-r1/FORMAL.stdout

      - name: Record stop reason when construction fails
        if: steps.construction.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("work/map01-r1")
          root.mkdir(parents=True, exist_ok=True)
          payload = {
              "decision": "STOPPED_CONSTRUCTION_NOT_PASS",
              "construction_step": "first_and_only",
              "formal_invocations": 0,
              "reruns": 0,
              "replacements": 0,
              "tuning": 0,
              "reason": "construction workflow step did not pass; formal invocation intentionally skipped",
          }
          (root / "STOP.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload retained R1 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-v12-physical-occupancy-r1-${{ github.run_id }}
          path: work/map01-r1
          if-no-files-found: error
          retention-days: 30
