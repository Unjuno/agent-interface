name: Static validation retained evidence
on:
  pull_request:
    paths:
      - 'runtime/cli_v1/**'
      - 'runtime/core_v1/**'
      - 'runtime/selector_v1/**'
      - 'research/integration/display_free_validation_3850_v1/**'
      - '.github/workflows/runtime-static-validation*v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/integration/display_free_validation_3850_v1/**'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            runtime/cli_v1
            runtime/core_v1
            runtime/selector_v1
            .github/workflows
            research/integration/display_free_validation_3850_v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Test the current static validation implementation
        run: python -S -B -m unittest -v runtime.cli_v1.test_validate_program
      - name: Audit immutable historical records without pinning future runtime edits
        run: python -S -B research/integration/display_free_validation_3850_v1/verify_publication.py --historical-only
