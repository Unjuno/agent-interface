name: Archive research snapshot (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Archival research version without leading v'
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build archival research bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          test -n "$VERSION"
          mkdir -p dist
          tar -czf "dist/agent-interface-${VERSION}-research-archive.tar.gz" \
            README.md RESEARCH.md ROADMAP.md CHANGELOG.md CONTRIBUTING.md SECURITY.md \
            CITATION.cff docs research site
          sha256sum "dist/agent-interface-${VERSION}-research-archive.tar.gz" \
            > "dist/agent-interface-${VERSION}-research-archive.tar.gz.sha256"

      - name: Create explicitly archival prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Agent Interface $TAG — Research Archive" \
            --notes "Archival research snapshot only. This is not a runnable user distribution. See release/README.md for the current release contract." \
            --prerelease
