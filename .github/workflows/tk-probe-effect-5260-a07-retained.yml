name: Issue 5260 A07 focus probe FIRST STOP retained evidence

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'research/integration/tk_probe_effect_5260_a07_wslc_20261003/**'
      - '.github/workflows/tk-probe-effect-5260-a07-retained.yml'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'research/integration/tk_probe_effect_5260_a07_wslc_20261003/**'
      - '.github/workflows/tk-probe-effect-5260-a07-retained.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/integration/tk_probe_effect_5260_a07_wslc_20261003
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen and retained custody tests
        run: python -B -m unittest discover -s research/integration/tk_probe_effect_5260_a07_wslc_20261003 -p 'test_*.py' -v
      - name: Read-only FIRST STOP retention (no app/container/input)
        run: python -B research/integration/tk_probe_effect_5260_a07_wslc_20261003/verify_packet.py
