name: Runtime preview artifact v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-preview-artifact-v2.yml'

permissions:
  contents: read

concurrency:
  group: runtime-preview-artifact-v2
  cancel-in-progress: false

jobs:
  package-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen golden dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r runtime/requirements-golden.txt

      - name: Build closure-driven staging tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime-preview-v2
          mkdir -p runtime-preview-v2/staging runtime-preview-v2/evidence
          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          root = pathlib.Path('.').resolve()
          staging = root / 'runtime-preview-v2' / 'staging'
          golden = {
              pathlib.PurePosixPath('research/live_control/results/integrated-efficiency-live-01/preregistration.json'),
              pathlib.PurePosixPath('research/live_control/results/integrated-efficiency-live-01/report.json'),
              pathlib.PurePosixPath('research/live_control/results/integrated-efficiency-live-01/audit.json'),
          }
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          tracked = [pathlib.PurePosixPath(raw.decode()) for raw in tracked if raw]
          included, excluded = [], []
          for rel in tracked:
              historical = 'results' in rel.parts or 'results-local' in rel.parts
              if historical and rel not in golden:
                  excluded.append(rel.as_posix())
                  continue
              source = root / rel
              target = staging / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              if source.is_symlink():
                  target.symlink_to(os.readlink(source))
              else:
                  shutil.copy2(source, target)
              included.append(rel.as_posix())
          missing = [p.as_posix() for p in golden if not (staging / p).is_file()]
          if missing:
              raise SystemExit('required golden retained files missing from staging: ' + repr(missing))
          manifest = {
              'schema': 'agent-interface-runtime-preview-selection-v2',
              'selection_rule': 'all tracked files except path segments results/results-local; re-add three golden retained JSONs',
              'included_files': len(included),
              'excluded_historical_result_files': len(excluded),
              'required_golden_files': sorted(p.as_posix() for p in golden),
          }
          (root / 'runtime-preview-v2/evidence/selection.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Audit staging tree before archive
        shell: bash
        run: |
          set -euo pipefail
          python runtime-preview-v2/staging/runtime/golden_desktop_demo_v3.py audit-retained \
            | tee runtime-preview-v2/evidence/staging-audit-retained.json
          python runtime-preview-v2/staging/release/golden_artifact_closure_v1/check_golden_artifact_closure.py \
            runtime-preview-v2/staging \
            --out runtime-preview-v2/evidence/staging-source-closure.json
          python runtime-preview-v2/staging/release/first_run_smoke_v1/preflight.py \
            --root runtime-preview-v2/staging \
            --out runtime-preview-v2/evidence/staging-first-run-preflight.json

      - name: Build size-bounded archive
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          tar -C runtime-preview-v2/staging -czf \
            runtime-preview-v2/agent-interface-runtime-preview-v2-${commit:0:8}.tar.gz .
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('runtime-preview-v2')
          archive = next(root.glob('agent-interface-runtime-preview-v2-*.tar.gz'))
          selection = json.loads((root / 'evidence/selection.json').read_text(encoding='utf-8'))
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          size = archive.stat().st_size
          limit = 250 * 1024 * 1024
          manifest = {
              'schema': 'agent-interface-runtime-preview-artifact-v2',
              'commit': commit,
              'archive': archive.name,
              'archive_bytes': size,
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'size_limit_bytes': limit,
              'size_passed': size <= limit,
              'included_files': selection['included_files'],
              'excluded_historical_result_files': selection['excluded_historical_result_files'],
              'audit_retained_required': True,
              'source_closure_required': True,
              'first_run_preflight_required': True,
              'supported_host_claim': 'WSLg/Linux-X11 remains separately acceptance-tested; packaging job is not a GUI/model run',
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          if not manifest['size_passed']:
              raise SystemExit(f'archive exceeds 250 MiB release-preview bound: {size}')
          PY

      - name: Verify extracted artifact, not staging tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-preview-v2/extracted
          tar -xzf runtime-preview-v2/agent-interface-runtime-preview-v2-*.tar.gz \
            -C runtime-preview-v2/extracted
          python runtime-preview-v2/extracted/runtime/golden_desktop_demo_v3.py audit-retained \
            | tee runtime-preview-v2/evidence/extracted-audit-retained.json
          python runtime-preview-v2/extracted/release/golden_artifact_closure_v1/check_golden_artifact_closure.py \
            runtime-preview-v2/extracted \
            --out runtime-preview-v2/evidence/extracted-source-closure.json
          python runtime-preview-v2/extracted/release/first_run_smoke_v1/preflight.py \
            --root runtime-preview-v2/extracted \
            --out runtime-preview-v2/evidence/extracted-first-run-preflight.json

      - name: Upload immutable runtime preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-interface-runtime-preview-v2-${{ github.sha }}
          path: |
            runtime-preview-v2/agent-interface-runtime-preview-v2-*.tar.gz
            runtime-preview-v2/manifest.json
            runtime-preview-v2/evidence/**
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
