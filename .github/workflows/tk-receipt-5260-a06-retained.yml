name: Issue 5260 A06 receipt phase retained evidence

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'research/integration/tk_receipt_visibility_5260_a06_wslc_20261003/**'
      - '.github/workflows/tk-receipt-5260-a06-retained.yml'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'research/integration/tk_receipt_visibility_5260_a06_wslc_20261003/**'
      - '.github/workflows/tk-receipt-5260-a06-retained.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/integration/tk_receipt_visibility_5260_a06_wslc_20261003
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen and retained trace tests
        run: python -B -m unittest discover -s research/integration/tk_receipt_visibility_5260_a06_wslc_20261003 -p 'test_*.py' -v
      - name: Read-only first-outcome validation (no writer or container)
        run: python -B research/integration/tk_receipt_visibility_5260_a06_wslc_20261003/verify_packet.py
