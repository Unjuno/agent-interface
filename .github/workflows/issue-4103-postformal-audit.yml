name: issue-4103-postformal-audit

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/issue-4103-postformal-audit.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-retained-evidence:
    if: github.head_ref == 'research/o2-golden-v3-transfer-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download immutable formal artifact
        uses: actions/download-artifact@v4
        with:
          name: issue4103-o2-golden-transfer
          path: retained-original
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35683716387

      - name: Download successful postformal audit
        uses: actions/download-artifact@v4
        with:
          name: issue4103-postformal-audit
          path: retained-postaudit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35703851478

      - name: Validate and package retained evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat retained-original/FORMAL_CONTAINER_EXIT.host)" = "0"
          test "$(cat retained-original/AUDIT_CONTAINER_EXIT.host)" = "1"
          test "$(cat retained-postaudit/POSTFORMAL_AUDIT_EXIT.host)" = "0"
          test "$(python -c 'import json; print(json.load(open("retained-original/formal-01/END.json"))["status"])')" = "COMPLETE"
          test "$(python -c 'import json; print(json.load(open("retained-postaudit/POSTFORMAL_AUDIT.json"))["decision"])')" = "PASS_GOLDEN_V3_CONTIGUOUS_TRANSFER_SCOPED"
          DEST=research/measurement/o2_golden_v3_transfer_4092_v1/retained
          mkdir -p "$DEST"
          cp retained-postaudit/POSTFORMAL_AUDIT.json "$DEST/POSTFORMAL_AUDIT.json"
          python - <<'PY'
          import hashlib, json, pathlib, tarfile, lzma
          sources=[pathlib.Path('retained-original'), pathlib.Path('retained-postaudit')]
          files=[]
          for src in sources:
              for p in sorted(src.rglob('*')):
                  if p.is_file():
                      b=p.read_bytes(); files.append({'path':p.as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          dest=pathlib.Path('research/measurement/o2_golden_v3_transfer_4092_v1/retained')
          tar_path=dest/'FIRST_OUTCOME.tar'
          with tarfile.open(tar_path,'w') as tf:
              for src in sources:
                  for p in sorted(src.rglob('*')):
                      if p.is_file(): tf.add(p,arcname=p.as_posix(),recursive=False)
          raw=tar_path.read_bytes(); xz=lzma.compress(raw,preset=9)
          (dest/'FIRST_OUTCOME.tar.xz').write_bytes(xz); tar_path.unlink()
          audit=json.loads((pathlib.Path('retained-postaudit')/'POSTFORMAL_AUDIT.json').read_text())
          m={'schema':'issue4103-first-outcome-retention-v1','formal_workflow_run':35683716387,'formal_artifact_id':10675902738,'formal_artifact_digest':'sha256:30ca4f6d3ce2b72d02a23d32199f012219ca06d53edcc04c6eda137cd82a0d81','postformal_workflow_run':35703851478,'postformal_artifact_id':10683008507,'postformal_artifact_digest':'sha256:176478aab75c80aa6a8501ed7f032d59f8274b1abac9246cdc64ff8aadf43314','file_count':len(files),'files':files,'archive_bytes':len(xz),'archive_sha256':hashlib.sha256(xz).hexdigest(),'decision':audit['decision'],'integrity':audit['integrity'],'pair_count':audit['pair_count'],'timed_pairs':audit['timed_pairs'],'aggregate_ratio_median':audit['aggregate_ratio_median'],'strong_pair_count':audit['strong_pair_count'],'formal_reruns':0}
          (dest/'MANIFEST.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
          cat > "$DEST/PUBLICATION_RECOVERY.md" <<'EOF'
          # Issue #4103 first-outcome retention and audit recovery

          The single frozen formal allocation completed with formal container exit 0, 8/8 frame pairs and 248 timed paired measurements. The original frozen auditor exited 1 only because the workflow retained the actual host exit receipt one directory above the path expected by the auditor.

          No formal row was rerun, replaced, pooled or tuned. A separate audit-only workflow downloaded the immutable first-outcome artifact, copied the exact retained zero exit receipt into the auditor's expected review-tree location, and ran the unchanged frozen auditor with corruption controls.

          The unchanged auditor returned PASS_GOLDEN_V3_CONTIGUOUS_TRANSFER_SCOPED, PASS_RAW_GOLDEN_TRANSFER_AUDIT, 8 frame pairs, 248 timed pairs, aggregate median contiguous/vector wall ratio 0.7994306233834731, 8 strong pairs, and 9/9 corruption controls rejected.

          FIRST_OUTCOME.tar.xz losslessly retains the complete original workflow artifact plus the complete postformal audit artifact. MANIFEST.json binds every retained member and both GitHub Actions artifact identities. POSTFORMAL_AUDIT.json is directly readable.

          This is a scoped retained golden-v3 frame serialization/copy-path result. It is not a live model/GUI allocation, token reduction, end-to-end task speedup, current action authority, or PASS_INTEGRATION_SPINE_SCOPED.
          EOF

      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/issue-4103-o2-golden-transfer.yml
          rm -f .github/workflows/issue-4103-postformal-audit.yml
          rm -f .github/workflows/issue-4103-publish-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "research(#4103): retain first outcome and recovered audit"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
