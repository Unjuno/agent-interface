name: map01-direct-action-effect-2458
on:
  workflow_dispatch:
  push:
    paths:
      - "research/live_control/map01_direct_action_effect_2458_v1/**"
      - ".github/workflows/map01-direct-action-effect-2458.yml"
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
    steps:
      - name: Install pinned runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb libgl1 libglu1-mesa
          python -m pip install --no-cache-dir vizdoom==1.2.3
      - name: Fetch exact branch source
        run: |
          python -c "import urllib.request; u='https://raw.githubusercontent.com/Unjuno/agent-interface/090ad521c47bc2beed237df2d1076b8a0c7032a6/research/live_control/map01_direct_action_effect_2458_v1/audit.py'; open('audit.py','wb').write(urllib.request.urlopen(u).read())"
      - name: Run calibration and retain stdout
        run: python audit.py | tee calibration.log
