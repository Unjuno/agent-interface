name: Native MCP v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/live_control/**'
      - 'runtime/cli_v1/**'
      - 'runtime/host_v1/**'
      - 'runtime/motor_state_v1/**'
      - 'runtime/selector_v1/**'
      - 'runtime/core_v1/**'
      - 'runtime/backends/**'
      - 'runtime/integration_checks/**'
      - 'runtime/distribution_v2/**'
      - 'runtime/guarded_x11_v1/**'
      - '.github/workflows/native-mcp-v1.yml'
  push:
    paths:
      - 'research/live_control/**'
      - 'runtime/cli_v1/**'
      - 'runtime/host_v1/**'
      - 'runtime/motor_state_v1/**'
      - 'runtime/selector_v1/**'
      - 'runtime/core_v1/**'
      - 'runtime/backends/**'
      - 'runtime/integration_checks/**'
      - 'runtime/distribution_v2/**'
      - 'runtime/guarded_x11_v1/**'
      - '.github/workflows/native-mcp-v1.yml'
permissions:
  contents: read
jobs:
  native-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Contract tests use top-level research sources and fresh test fixtures.
          # Exclude nested historical bundles except the two inert receipt fixtures.
          sparse-checkout: |
            /runtime/__init__.py
            /runtime/backends/__init__.py
            /runtime/cli_v1/
            /runtime/host_v1/
            /runtime/motor_state_v1/
            /runtime/selector_v1/
            /runtime/core_v1/
            /runtime/backends/
            /runtime/integration_checks/
            /runtime/distribution_v2/
            /runtime/guarded_x11_v1/
            /research/live_control/*
            !/research/live_control/*/
            /research/live_control/caller_uncertain_tail_I13/
            !/research/live_control/caller_uncertain_tail_I13/*
            /research/live_control/caller_uncertain_tail_I13/LIVE_CALLER.json
            /research/live_control/caller_uncertain_tail_I13/RESPONSE3.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r research/live_control/requirements-native-mcp.txt
      - name: Install inert harness test imports
        run: python -m pip install Pillow==10.2.0 numpy==1.26.4 python-xlib==0.33
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the persistent host relay adapter
        run: node --test research/live_control/test_native_relay_client_v1.mjs research/live_control/test_relay_host_timeline_v1.mjs runtime/host_v1/test_relay_client.mjs runtime/host_v1/test_relay_host.mjs runtime/host_v1/test_evidence_capacity.mjs runtime/host_v1/test_text_acknowledgment.mjs runtime/host_v1/test_primary_caller.mjs runtime/host_v1/test_primary_mint.mjs runtime/host_v1/test_primary_mint_many.mjs runtime/host_v1/test_primary_input.mjs runtime/host_v1/test_primary_window_review.mjs runtime/host_v1/test_primary_exchange.mjs runtime/host_v1/test_primary_stdio.mjs runtime/host_v1/test_primary_stdio_backpressure.mjs
      - name: Run the shared local and CI integration checks
        run: python runtime/integration_checks/native.py --output results-local/native-ci
      - name: Test strict primary stdio UTF-8 admission
        run: node --test runtime/host_v1/test_primary_stdio_utf8.mjs
      - name: Retain contract results and full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-contract-checks
          path: results-local/native-ci
          if-no-files-found: warn
