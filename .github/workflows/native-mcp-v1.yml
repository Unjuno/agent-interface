name: Native MCP v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/live_control/**'
      - 'runtime/cli_v1/**'
      - 'runtime/motor_state_v1/**'
      - 'runtime/selector_v1/**'
      - 'runtime/core_v1/**'
      - 'runtime/backends/**'
      - 'runtime/integration_checks/**'
      - '.github/workflows/native-mcp-v1.yml'
  push:
    paths:
      - 'research/live_control/**'
      - 'runtime/cli_v1/**'
      - 'runtime/motor_state_v1/**'
      - 'runtime/selector_v1/**'
      - 'runtime/core_v1/**'
      - 'runtime/backends/**'
      - 'runtime/integration_checks/**'
      - '.github/workflows/native-mcp-v1.yml'
permissions:
  contents: read
jobs:
  native-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            research/live_control
            runtime/cli_v1
            runtime/motor_state_v1
            runtime/selector_v1
            runtime/core_v1
            runtime/backends
            runtime/integration_checks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r research/live_control/requirements-native-mcp.txt
      - name: Install inert harness test imports
        run: python -m pip install Pillow==10.2.0 numpy==1.26.4 python-xlib==0.33
      - name: Run the shared local and CI integration checks
        run: python runtime/integration_checks/native.py --output results-local/native-ci
      - name: Retain contract results and full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-contract-checks
          path: results-local/native-ci
          if-no-files-found: warn
