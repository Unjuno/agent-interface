name: Native MCP v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/live_control/**'
      - 'runtime/cli_v1/**'
      - 'runtime/motor_state_v1/**'
      - 'runtime/selector_v1/**'
      - '.github/workflows/native-mcp-v1.yml'
  push:
    paths:
      - 'research/live_control/**'
      - 'runtime/cli_v1/**'
      - 'runtime/motor_state_v1/**'
      - 'runtime/selector_v1/**'
      - '.github/workflows/native-mcp-v1.yml'
permissions:
  contents: read
jobs:
  native-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            research/live_control
            runtime/cli_v1
            runtime/motor_state_v1
            runtime/selector_v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r research/live_control/requirements-native-mcp.txt
      - name: Run stdio adapter contract
        env:
          PYTHONPATH: .:research/live_control
        run: python -m unittest -v test_native_mcp_v1 test_native_allocation_v1 test_native_mcp_relay_v1
