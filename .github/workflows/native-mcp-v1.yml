name: Native MCP adapter
on:
  pull_request:
    paths:
      - 'research/live_control/native_mcp_v1.py'
      - 'research/live_control/test_native_mcp_v1.py'
      - 'research/live_control/requirements-native-mcp.txt'
      - 'research/live_control/native_exchange_v1.py'
      - 'research/live_control/agent_review.py'
      - 'research/live_control/receipt_references.py'
      - 'research/live_control/receipt_image.py'
      - 'runtime/cli_v1/**'
      - 'runtime/motor_state_v1/**'
      - '.github/workflows/native-mcp-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            runtime/cli_v1
            runtime/motor_state_v1`n            runtime/selector_v1
            research/live_control/native_mcp_v1.py
            research/live_control/test_native_mcp_v1.py
            research/live_control/requirements-native-mcp.txt
            research/live_control/native_exchange_v1.py
            research/live_control/agent_review.py
            research/live_control/receipt_references.py
            research/live_control/receipt_image.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/live_control/requirements-native-mcp.txt
      - name: Exercise real stdio protocol with inert native fixture
        env:
          PYTHONPATH: .:research/live_control
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest -v test_native_mcp_v1
