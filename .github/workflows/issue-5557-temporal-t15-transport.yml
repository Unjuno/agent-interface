name: Issue 5557 T15-03 bounded transport experiment

on:
  pull_request:
    types: [opened]
    paths:
      - 'research/analysis/mixed_criticality_temporal_feasibility_5557_t15_transport_v1/**'
      - '.github/workflows/issue-5557-temporal-t15-transport.yml'

permissions:
  contents: read

jobs:
  formal-container-experiment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
      options: --cpus=1 --memory=512m --pids-limit=64
    steps:
      - name: Bounded exact-head source transport and hash canary
        env:
          REF: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: sh
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request

          package = "research/analysis/mixed_criticality_temporal_feasibility_5557_t15_transport_v1"
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / package
          root.mkdir(parents=True, exist_ok=True)
          base = f"https://raw.githubusercontent.com/{os.environ['REPOSITORY']}/{os.environ['REF']}/{package}/"
          deadline = time.monotonic() + 30.0

          def get(name):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError("total source-fetch deadline exceeded")
              request = urllib.request.Request(base + name, headers={"User-Agent": "issue-5557-t15-03"})
              with urllib.request.urlopen(request, timeout=min(6.0, remaining)) as response:
                  data = response.read(262145)
              if len(data) > 262144:
                  raise ValueError(f"source exceeds 256 KiB: {name}")
              return data

          manifest = get("SHA256SUMS.txt")
          expected_manifest_sha256 = "d8edd0f4ebae245077da36ff8774fa08dc5ec5e58a2030e48e018916325c5983"
          if hashlib.sha256(manifest).hexdigest() != expected_manifest_sha256:
              raise SystemExit("STOP: preregistered manifest digest mismatch")
          entries = []
          for line in manifest.decode("ascii").splitlines():
              digest, name = line.split("  ", 1)
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or len(path.parts) != 1 or name in ("", ".", ".."):
                  raise SystemExit("STOP: unsafe manifest path")
              entries.append((digest, name))
          if len(entries) != 6 or len({name for _, name in entries}) != len(entries):
              raise SystemExit("STOP: unexpected frozen file inventory")
          (root / "SHA256SUMS.txt").write_bytes(manifest)
          for digest, name in entries:
              data = get(name)
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"STOP: source digest mismatch: {name}")
              (root / name).write_bytes(data)
          freeze = json.loads((root / "FREEZE.json").read_text(encoding="utf-8"))
          if freeze.get("allocation") != "ISSUE-5557-TEMPORAL-SERVICE-T15-20261001-03":
              raise SystemExit("STOP: wrong allocation at exact PR head")
          image = freeze.get("image", {}).get("reference")
          if image != "python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f":
              raise SystemExit("STOP: frozen image identity mismatch")
          print(json.dumps({"canary": "PASS_HASH_VERIFIED", "allocation": freeze["allocation"], "files": len(entries), "elapsed_seconds": round(time.monotonic() - (deadline - 30.0), 3)}, sort_keys=True))
          PY
      - name: Verify frozen manifest in container
        working-directory: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_transport_v1
        run: sha256sum -c SHA256SUMS.txt
      - name: One construction-test invocation
        working-directory: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_transport_v1
        run: python -B -m unittest -v test_audit.py
      - name: Record environment
        run: |
          mkdir -p research/analysis/mixed_criticality_temporal_feasibility_5557_t15_transport_v1/results/formal-03
          python -c 'import json,platform,os;print(json.dumps({"python":platform.python_version(),"platform":platform.platform(),"runner_os":os.getenv("RUNNER_OS"),"image":"python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f","source_transport":"raw.githubusercontent.com exact PR head; SHA-256 verified"},sort_keys=True))' > research/analysis/mixed_criticality_temporal_feasibility_5557_t15_transport_v1/results/formal-03/environment.json
      - name: One formal candidate invocation
        working-directory: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_transport_v1
        run: python -B experiment.py --output results/formal-03/raw.jsonl
      - name: One independent raw-only audit invocation
        working-directory: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_transport_v1
        run: python -B audit.py results/formal-03/raw.jsonl --output results/formal-03/AUDIT.json
      - name: Upload exact raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-5557-t15-03-${{ github.run_id }}
          path: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_transport_v1/results/
          if-no-files-found: warn
