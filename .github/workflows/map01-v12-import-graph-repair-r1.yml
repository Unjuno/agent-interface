name: MAP01 v12 import graph repair R1
on:
  pull_request:
    branches: [main]
    paths:
      - research/doom/map01_v12_import_graph_repair_r1_v1/**
      - .github/workflows/map01-v12-import-graph-repair-r1.yml
jobs:
  import-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install import-only dependencies
        run: python -m pip install --disable-pip-version-check pillow python-xlib
      - name: Compile frozen import sources and adapter
        run: python -m py_compile research/live_control/session_v4.py research/live_control/session_v5.py research/live_control/session_v6.py research/live_control/session_v7.py research/live_control/session_v8.py research/live_control/session_v9.py research/live_control/session_v10.py research/doom/map01_v12_import_graph_repair_r1_v1/import_graph_adapter.py research/doom/map01_v12_import_graph_repair_r1_v1/test_import_graph_adapter.py
      - name: Run isolated import smoke
        run: python research/doom/map01_v12_import_graph_repair_r1_v1/test_import_graph_adapter.py