name: Issue 5716 identifiability Docker construction A01
on:
  create:
jobs:
  construction:
    if: >-
      github.event.ref_type == 'branch' &&
      github.event.ref == 'research/5716-identifiability-docker-construction-20261001-01'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout exact created commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Start gate and source freeze validation
        id: gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          expected_branch=$(jq -r '.branch' "research/analysis/workflow_conformance_5716_t0_v1/DOCKER_FREEZE.json")
          allocation=$(jq -r '.allocation' "research/analysis/workflow_conformance_5716_t0_v1/DOCKER_FREEZE.json")
          test "$GITHUB_EVENT_NAME" = "create"
          test "$(jq -r '.ref_type' "$GITHUB_EVENT_PATH")" = "branch"
          test "$(jq -r '.ref' "$GITHUB_EVENT_PATH")" = "$expected_branch"
          test "$GITHUB_REF_NAME" = "$expected_branch"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_REPOSITORY" = "Unjuno/agent-interface"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(jq -r '.schema' "research/analysis/workflow_conformance_5716_t0_v1/DOCKER_FREEZE.json")" = "5716-identifiability-docker-freeze-v1"
          test "$allocation" = "5716-TELEMETRY-IDENTIFIABILITY-DOCKER-CONSTRUCTION-20261001-01"
          test "$(sha256sum "research/analysis/workflow_conformance_5716_t0_v1/candidate.py" | cut -d' ' -f1)" = "$(jq -r '.candidateSha256' "research/analysis/workflow_conformance_5716_t0_v1/DOCKER_FREEZE.json")"
          test "$(sha256sum "research/analysis/workflow_conformance_5716_t0_v1/fixtures.json" | cut -d' ' -f1)" = "$(jq -r '.fixturesSha256' "research/analysis/workflow_conformance_5716_t0_v1/DOCKER_FREEZE.json")"
          test "$(sha256sum "research/analysis/workflow_conformance_5716_t0_v1/audit.py" | cut -d' ' -f1)" = "$(jq -r '.auditSha256' "research/analysis/workflow_conformance_5716_t0_v1/DOCKER_FREEZE.json")"
          test "$(sha256sum ".github/workflows/5716-identifiability-docker-construction-a01.yml" | cut -d' ' -f1)" = "$(jq -r '.workflowSha256' "research/analysis/workflow_conformance_5716_t0_v1/DOCKER_FREEZE.json")"
          main_sha=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Unjuno/agent-interface/commits/main" | jq -r '.sha')
          jq -n --arg allocation "$allocation" --arg event_sha "$GITHUB_SHA" --arg main_sha "$main_sha" --arg branch "$expected_branch" '{"allocation":$allocation,"event_sha":$event_sha,"live_main_sha_at_gate":$main_sha,"branch":$branch,"candidate_invocations":0,"auditor_invocations":0,"status":"START_GATE_PASS"}' > "$RUNNER_TEMP/evidence/start-gate.json"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Pull exact image and record engine/image identity
        id: image
        if: success() && steps.gate.outputs.ok == '1'
        shell: bash
        run: |
          set -euo pipefail
          image=$(jq -r '.image' "research/analysis/workflow_conformance_5716_t0_v1/DOCKER_FREEZE.json")
          platform=$(jq -r '.platform' "research/analysis/workflow_conformance_5716_t0_v1/DOCKER_FREEZE.json")
          docker version --format '{{json .Server}}' > "$RUNNER_TEMP/evidence/docker-server.json"
          docker pull --platform "$platform" "$image"
          docker image inspect "$image" --format '{"Id":"{{.Id}}","Os":"{{.Os}}","Architecture":"{{.Architecture}}","RepoDigests":{{json .RepoDigests}}}' > "$RUNNER_TEMP/evidence/image.json"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Run the frozen candidate once in isolated Docker
        id: candidate
        if: success() && steps.image.outputs.ok == '1'
        shell: bash
        run: |
          set -euo pipefail
          root="research/analysis/workflow_conformance_5716_t0_v1"
          image=$(jq -r '.image' "$root/DOCKER_FREEZE.json")
          platform=$(jq -r '.platform' "$root/DOCKER_FREEZE.json")
          evidence="$RUNNER_TEMP/evidence"
          set +e
          docker run --interactive --pull=never --platform "$platform" --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=32 --memory=128m --cpus=1 \
            --cidfile "$evidence/candidate.cid" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$root/candidate.py,target=/candidate.py,readonly" \
            "$image" python -B /candidate.py < "$GITHUB_WORKSPACE/$root/fixtures.json" \
            > "$evidence/raw.jsonl" 2> "$evidence/candidate.stderr"
          candidate_rc=$?
          set -e
          echo "exit_code=$candidate_rc" >> "$GITHUB_OUTPUT"
          if [ -s "$evidence/candidate.cid" ]; then
            cid=$(cat "$evidence/candidate.cid")
            docker inspect "$cid" > "$evidence/candidate-container.json"
            docker rm "$cid" >/dev/null
          fi
          if [ "$candidate_rc" -ne 0 ]; then exit "$candidate_rc"; fi

      - name: Audit captured raw once in a separate isolated Docker container
        id: auditor
        if: success() && steps.candidate.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          root="research/analysis/workflow_conformance_5716_t0_v1"
          image=$(jq -r '.image' "$root/DOCKER_FREEZE.json")
          platform=$(jq -r '.platform' "$root/DOCKER_FREEZE.json")
          evidence="$RUNNER_TEMP/evidence"
          set +e
          docker run --interactive --pull=never --platform "$platform" --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=32 --memory=128m --cpus=1 \
            --cidfile "$evidence/auditor.cid" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$root/audit.py,target=/audit.py,readonly" \
            --mount "type=bind,source=$evidence/raw.jsonl,target=/raw.jsonl,readonly" \
            "$image" python -B /audit.py /raw.jsonl \
            > "$evidence/audit.json" 2> "$evidence/auditor.stderr"
          auditor_rc=$?
          set -e
          echo "exit_code=$auditor_rc" >> "$GITHUB_OUTPUT"
          if [ -s "$evidence/auditor.cid" ]; then
            cid=$(cat "$evidence/auditor.cid")
            docker inspect "$cid" > "$evidence/auditor-container.json"
            docker rm "$cid" >/dev/null
          fi
          if [ "$auditor_rc" -ne 0 ]; then exit "$auditor_rc"; fi

      - name: Retain first outcome on the allocation branch
        if: always()
        shell: bash
        env:
          GATE_OK: ${{ steps.gate.outputs.ok || '0' }}
          IMAGE_OK: ${{ steps.image.outputs.ok || '0' }}
          CANDIDATE_RC: ${{ steps.candidate.outputs.exit_code || 'NOT_RUN' }}
          AUDITOR_RC: ${{ steps.auditor.outputs.exit_code || 'NOT_RUN' }}
        run: |
          set -euo pipefail
          root="research/analysis/workflow_conformance_5716_t0_v1"
          evidence="$RUNNER_TEMP/evidence"
          results="$root/results/identifiability-docker-construction-01"
          mkdir -p "$results"
          if [ -d "$evidence" ]; then cp -a "$evidence/." "$results/"; fi
          if [ "$GATE_OK" = "1" ] && [ "$IMAGE_OK" = "1" ] && [ "$CANDIDATE_RC" = "0" ] && [ "$AUDITOR_RC" = "0" ]; then
            disposition="PASS_IDENTIFIABILITY_DOCKER_CONSTRUCTION"
          elif [ "$GATE_OK" != "1" ]; then
            disposition="STOP_BEFORE_CANDIDATE"
          else
            disposition="STOP_OPERATIONAL_OR_AUDIT"
          fi
          jq -n --arg allocation "$(jq -r '.allocation' "$root/DOCKER_FREEZE.json")" \
            --arg event_sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg candidate_rc "$CANDIDATE_RC" \
            --arg auditor_rc "$AUDITOR_RC" --arg disposition "$disposition" \
            --arg image "$(jq -r '.image' "$root/DOCKER_FREEZE.json")" \
            --arg platform "$(jq -r '.platform' "$root/DOCKER_FREEZE.json")" \
            '{"allocation":$allocation,"event_sha":$event_sha,"workflow_run_id":$run_id,"run_attempt":$run_attempt,"candidate_invocations":(if $candidate_rc=="NOT_RUN" then 0 else 1 end),"candidate_exit_code":$candidate_rc,"auditor_invocations":(if $auditor_rc=="NOT_RUN" then 0 else 1 end),"auditor_exit_code":$auditor_rc,"image":$image,"platform":$platform,"disposition":$disposition}' > "$results/RUN.json"
          if [ -f "$results/raw.jsonl" ]; then sha256sum "$results/raw.jsonl" > "$results/SHA256SUMS"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$results"
          git commit -m "research(#5716): retain Docker identifiability first outcome"
          git push origin "HEAD:$GITHUB_REF"

