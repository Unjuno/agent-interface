name: Legacy GTK dispatch contract

on:
  pull_request:
    paths:
      - ".github/workflows/gtk-formal-allocation-2606-v1.yml"
      - ".github/workflows/gtk-bounded-allocation-2836.yml"
      - ".github/workflows/gtk-xlib-allocation-2851.yml"
      - ".github/workflows/legacy-gtk-dispatch-contract.yml"
      - ".github/scripts/test_legacy_gtk_manual_dispatch.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gtk-formal-allocation-2606-v1.yml"
      - ".github/workflows/gtk-bounded-allocation-2836.yml"
      - ".github/workflows/gtk-xlib-allocation-2851.yml"
      - ".github/workflows/legacy-gtk-dispatch-contract.yml"
      - ".github/scripts/test_legacy_gtk_manual_dispatch.py"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify manual-only triggers without executing allocations
        run: python3 -B .github/scripts/test_legacy_gtk_manual_dispatch.py -v
