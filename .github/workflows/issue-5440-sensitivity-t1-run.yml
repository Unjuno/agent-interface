name: Issue 5440 hidden-cause sensitivity T1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-5440-sensitivity-t1-run.yml"
      - "research/analysis/hidden_cause_sensitivity_5440_t1/cases.json"
      - "research/analysis/hidden_cause_sensitivity_5440_t1/candidate.py"
      - "research/analysis/hidden_cause_sensitivity_5440_t1/audit.py"
      - "research/analysis/hidden_cause_sensitivity_5440_t1/preflight.py"

permissions:
  contents: read

jobs:
  container-experiment:
    if: ${{ github.sha == '32db1c3fdc6e50dd6d64c3d6886e503c94144fd6' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IMAGE: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
      PLATFORM: linux/amd64
      BASE_MAIN_SHA: ffb0d43b5f0408011a3f70223da43d4aa3f27fe4
      EXPERIMENT_DIR: research/analysis/hidden_cause_sensitivity_5440_t1
    steps:
      - name: Checkout frozen experiment source
        uses: actions/checkout@v4
      - name: Prepare output directory
        run: mkdir -p "$RUNNER_TEMP/sensitivity-output/raw"
      - name: Pull digest-pinned image
        id: pull_image
        run: docker pull --platform "$PLATFORM" "$IMAGE"
      - name: Container preflight, one candidate run, independent audit
        id: container_run
        run: |
          docker run --rm --network none --platform "$PLATFORM" --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e EXPERIMENT_IMAGE="$IMAGE" -e EXPERIMENT_PLATFORM="$PLATFORM" \
            -e EXPERIMENT_BASE_SHA="$BASE_MAIN_SHA" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$EXPERIMENT_DIR,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/sensitivity-output,target=/out" \
            --workdir /src "$IMAGE" sh -euc '
              python /src/preflight.py /src/cases.json
              python -c "from pathlib import Path; [compile(p.read_text(), str(p), \"exec\") for p in (Path(\"/src/candidate.py\"), Path(\"/src/audit.py\"))]; print(\"PASS_SOURCE_COMPILE\")"
              python /src/candidate.py --input /src/cases.json --output /out/raw/formal.json
              python /src/audit.py --input /src/cases.json --raw /out/raw/formal.json --output /out/raw/audit.json
              (cd /src && sha256sum cases.json candidate.py audit.py preflight.py README.md construction_oracle.py construction-result.json workflow-stops.json) > /out/SHA256SUMS
              (cd /out && sha256sum raw/formal.json raw/audit.json) >> /out/SHA256SUMS
              cat /out/SHA256SUMS
            '
      - name: Record run outcomes and hash receipt
        if: always()
        env:
          IMAGE_PULL_OUTCOME: ${{ steps.pull_image.outcome }}
          CONTAINER_OUTCOME: ${{ steps.container_run.outcome }}
        run: |
          OUTPUT_DIR="$RUNNER_TEMP/sensitivity-output"
          mkdir -p "$OUTPUT_DIR"
          printf '{"schema":"hidden-cause-sensitivity-t1-execution-status-v1","image":"%s","platform":"%s","base_main_sha":"%s","image_pull_step":"%s","container_step":"%s"}\n' "$IMAGE" "$PLATFORM" "$BASE_MAIN_SHA" "$IMAGE_PULL_OUTCOME" "$CONTAINER_OUTCOME" > "$OUTPUT_DIR/execution-status.json"
          (cd "$OUTPUT_DIR" && sha256sum execution-status.json > execution-status.sha256)
      - name: Upload immutable run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-5440-t1-container-output
          path: ${{ runner.temp }}/sensitivity-output
          if-no-files-found: error
          retention-days: 90
