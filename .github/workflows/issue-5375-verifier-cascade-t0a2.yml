name: Issue 5375 verifier-cascade capacity T0-a2

on:
  pull_request:
    paths:
      - 'research/analysis/verifier_cascade_capacity_5375_t0a2_20261002/**'
      - '.github/workflows/issue-5375-verifier-cascade-t0a2.yml'
  push:
    paths:
      - 'research/analysis/verifier_cascade_capacity_5375_t0a2_20261002/**'
      - '.github/workflows/issue-5375-verifier-cascade-t0a2.yml'

jobs:
  method-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construction regression suite
        working-directory: research/analysis/verifier_cascade_capacity_5375_t0a2_20261002
        run: python -B -m unittest -v test_t0a2.py
      - name: Recompute finite candidate and independent audit
        working-directory: research/analysis/verifier_cascade_capacity_5375_t0a2_20261002
        run: |
          python -B candidate.py fixture.json /tmp/candidate.jsonl
          python -B audit.py fixture.json /tmp/candidate.jsonl /tmp/audit.json
          python -B -m py_compile candidate.py audit.py test_t0a2.py
      - name: Verify retained artifact hashes
        working-directory: research/analysis/verifier_cascade_capacity_5375_t0a2_20261002
        run: sha256sum -c SHA256SUMS
