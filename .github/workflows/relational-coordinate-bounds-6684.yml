name: Relational coordinate bounds #6684

on:
  pull_request:
    paths:
      - 'research/analysis/relational_coordinate_bounds_6684_t0_20261002/**'
      - '.github/workflows/relational-coordinate-bounds-6684.yml'

permissions:
  contents: read

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run finite-domain, soundness and fail-closed construction tests
        run: python -B -m unittest discover -s research/analysis/relational_coordinate_bounds_6684_t0_20261002 -p 'test_*.py' -v
