name: Issue 5557 T15 temporal service contract experiment

on:
  pull_request:
    paths:
      - 'research/analysis/mixed_criticality_temporal_feasibility_5557_t15_v1/**'
      - '.github/workflows/issue-5557-temporal-t15.yml'

permissions:
  contents: read

jobs:
  formal-container-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
      options: --cpus=1 --memory=512m --pids-limit=64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Detect whether the one-shot result was already recorded
        id: mode
        shell: sh
        run: |
          subject="$(git log -1 --format=%s)"
          case "$subject" in
            *'[t15-results-recorded]'*) echo 'execute=false' >> "$GITHUB_OUTPUT" ;;
            *) echo 'execute=true' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Verify frozen source manifest
        working-directory: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_v1
        run: sha256sum -c SHA256SUMS.txt
      - name: Independent construction tests
        working-directory: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_v1
        run: python -B -m unittest -v test_audit.py
      - name: Record execution environment
        if: steps.mode.outputs.execute == 'true'
        run: |
          mkdir -p research/analysis/mixed_criticality_temporal_feasibility_5557_t15_v1/results/formal-02
          python -c 'import json,platform,os;print(json.dumps({"python":platform.python_version(),"platform":platform.platform(),"runner_os":os.getenv("RUNNER_OS"),"image":"python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f","formal_runner":"single subsequent candidate step and single subsequent raw-only audit step"},sort_keys=True))' > research/analysis/mixed_criticality_temporal_feasibility_5557_t15_v1/results/formal-02/environment.json
      - name: One formal candidate invocation
        if: steps.mode.outputs.execute == 'true'
        working-directory: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_v1
        run: python -B experiment.py --output results/formal-02/raw.jsonl
      - name: One independent raw-only audit invocation
        if: steps.mode.outputs.execute == 'true'
        working-directory: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_v1
        run: python -B audit.py results/formal-02/raw.jsonl --output results/formal-02/AUDIT.json
      - name: Upload exact raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-5557-t15-formal-02-${{ github.run_id }}
          path: research/analysis/mixed_criticality_temporal_feasibility_5557_t15_v1/results/
          if-no-files-found: warn
