name: MAP01 first useful feedback full 503
on:
  push:
    branches:
      - research/map01-first-useful-feedback-e2f3afa
permissions:
  contents: read
jobs:
  full-posthoc:
    if: contains(github.event.head_commit.message, '[run-full-503]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            research/doom/map01_first_useful_feedback_posthoc_v1
            research/doom/results/map01-v38-integrated-threat-live-01
            research/doom/results/map01-v39-coast-liveness-live-01
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen analysis dependencies
        run: python -m pip install --disable-pip-version-check 'vizdoom==1.3.0' 'Pillow==11.3.0'
      - name: Verify preregistered source identities
        shell: bash
        run: |
          set -euo pipefail
          R=research/doom/map01_first_useful_feedback_posthoc_v1
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          r=Path('research/doom/map01_first_useful_feedback_posthoc_v1')
          p=json.loads((r/'prereg.json').read_text())
          for name,want in p['source_git_blobs'].items():
              got=subprocess.check_output(['git','hash-object',str(r/name)],text=True).strip()
              assert got==want,(name,got,want)
          for run, ids in p['retained_run_sources_sha256'].items():
              root=Path('research/doom/results')/run
              for rel,want in ids.items():
                  got=hashlib.sha256((root/rel).read_bytes()).hexdigest()
                  assert got==want,(run,rel,got,want)
          print('frozen source identities pass')
          PY
      - name: Execute single full retained-evidence pass
        shell: bash
        run: |
          set -euo pipefail
          R=research/doom/map01_first_useful_feedback_posthoc_v1
          python "$R/analyze.py" full --repo "$GITHUB_WORKSPACE" --out "$R/result.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('research/doom/map01_first_useful_feedback_posthoc_v1')
          p=json.loads((r/'prereg.json').read_text())
          x=json.loads((r/'result.json').read_text())
          got={row['run']:[p0['id'] for p0 in row['plans']] for row in x['runs']}
          assert got==p['accepted_program_inventory'],(got,p['accepted_program_inventory'])
          assert sum(map(len,got.values()))==p['full_compute']['expected_admitted_plans']
          print(json.dumps({'inventory':got,'decision':x['decision']},sort_keys=True))
          PY
          python "$R/audit.py" "$R/result.json" --repo "$GITHUB_WORKSPACE" --out "$R/audit_result.json"
          python "$R/test_audit.py" "$R/result.json" "$GITHUB_WORKSPACE" | tee "$R/negative_tests.jsonl"
          sha256sum "$R"/*.py "$R"/prereg.json "$R"/result.json "$R"/audit_result.json "$R"/negative_tests.jsonl | sort > "$R/full.sha256"
          cat "$R/result.json"
          cat "$R/audit_result.json"
      - name: Upload full evidence
        uses: actions/upload-artifact@v4
        with:
          name: map01-first-useful-feedback-full-503
          path: |
            research/doom/map01_first_useful_feedback_posthoc_v1/result.json
            research/doom/map01_first_useful_feedback_posthoc_v1/audit_result.json
            research/doom/map01_first_useful_feedback_posthoc_v1/negative_tests.jsonl
            research/doom/map01_first_useful_feedback_posthoc_v1/full.sha256
          if-no-files-found: error
