name: MAP01 measurement integration live 03

on:
  push:
    paths:
      - '.github/workflows/map01-measurement-integration-live-03.yml'
      - 'research/doom/map01_measurement_integration_live_03_prereg.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: map01-measurement-integration-live-03
  cancel-in-progress: false

env:
  ALLOCATION_ID: map01-measurement-integration-live-03
  WORKFLOW_PATH: .github/workflows/map01-measurement-integration-live-03.yml
  FROZEN_RESEARCH_COMMIT: 5486ea20b417a80903619a384744cf9ac38d5a52
  FORMAL_SEED: '990613'

jobs:
  measurement-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen allocation state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert frozen research sources
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${FROZEN_RESEARCH_COMMIT}^{commit}"
          git diff --exit-code "$FROZEN_RESEARCH_COMMIT" -- \
            research/doom/session_map01_v13.py \
            research/doom/map01_scorer_stdio_adapter_v1.py \
            research/doom/probe_map01_measurement_integration_v1.py \
            research/doom/audit_map01_measurement_integration_v1.py \
            research/doom/audit_map01_terminal_score_agreement_v1.py \
            research/live_control/input_transition_owner_v3.py \
            research/doom/doom_retained_input_backend_v3.py \
            research/orchestration/o3-g6/launch-owner/formal_allocation_launch_owner_v1.py

      - name: Claim canonical one-shot launch ownership
        id: ownership
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/map01-measurement-integration-live-03.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=100"
          visible=0
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" > allocation-runs.json
            if python - "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          payload=json.load(open('allocation-runs.json',encoding='utf-8'))
          current=int(sys.argv[1])
          ids={int(r['id']) for r in payload.get('workflow_runs',[]) if isinstance(r,dict) and 'id' in r}
          raise SystemExit(0 if current in ids else 1)
          PY
            then
              visible=1
              break
            fi
            sleep 2
          done
          test "$visible" = 1
          python research/orchestration/o3-g6/launch-owner/formal_allocation_launch_owner_v1.py \
            allocation-runs.json \
            --current-run-id "$GITHUB_RUN_ID" \
            --workflow-path "$WORKFLOW_PATH" \
            --head-sha "$GITHUB_SHA" \
            --allocation-id "$ALLOCATION_ID" \
            --out launch-owner.json

      - name: Set up CPython 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install X11 and ViZDoom dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox wmctrl libopenal1 libsdl2-2.0-0 libgl1
          python -m pip install --upgrade pip
          python -m pip install 'vizdoom==1.3.0' pillow python-xlib numpy openpyxl

      - name: Record runner environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "allocation_id=$ALLOCATION_ID"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "github_sha=$GITHUB_SHA"
            uname -a
            python --version
            python - <<'PY'
          import vizdoom
          from pathlib import Path
          print('vizdoom', vizdoom.__version__)
          print('vizdoom_package', Path(vizdoom.__file__).parent)
          print('freedoom2_exists', (Path(vizdoom.__file__).parent / 'freedoom2.wad').is_file())
          PY
            python -m pip freeze
            dpkg-query -W xvfb openbox wmctrl libopenal1 libsdl2-2.0-0 libgl1
          } > runner-environment.txt
          cat runner-environment.txt

      - name: Revalidate frozen construction and guards
        shell: bash
        run: |
          set -euo pipefail
          python research/orchestration/o3-g6/launch-owner/test_formal_allocation_launch_owner_v1.py
          python research/doom/test_map01_scorer_stdio_adapter_v1.py
          python research/doom/test_session_map01_v13.py
          python research/doom/test_audit_map01_measurement_integration_v1.py
          python research/doom/test_audit_map01_terminal_score_agreement_v1.py

      - name: Run one-shot MAP01 measurement allocation
        shell: bash
        run: |
          set -euo pipefail
          python research/doom/probe_map01_measurement_integration_v1.py \
            --out "results-local/doom/$ALLOCATION_ID" \
            --seed "$FORMAL_SEED" | tee formal-audit.stdout

      - name: Enforce terminal score agreement
        shell: bash
        run: |
          set -euo pipefail
          python research/doom/audit_map01_terminal_score_agreement_v1.py \
            "results-local/doom/$ALLOCATION_ID/runtime" \
            --out "results-local/doom/$ALLOCATION_ID/terminal-score-audit.json"

      - name: Upload immutable first-outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ALLOCATION_ID }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            launch-owner.json
            allocation-runs.json
            results-local/doom/${{ env.ALLOCATION_ID }}/**
            formal-audit.stdout
            runner-environment.txt
