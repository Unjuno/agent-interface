name: public-motor-state-package-2508
on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/motor_state_v1/**"
      - ".github/workflows/public-motor-state-package-2508.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
    steps:
      - run: python -c "import urllib.request; b='https://raw.githubusercontent.com/Unjuno/agent-interface/b9bb4109397ce3e56b17756bda01922b956300d2/'; [(open(n,'wb').write(urllib.request.urlopen(b+n).read())) for n in ['runtime/motor_state_v1/__init__.py','runtime/motor_state_v1/adapter.py','runtime/motor_state_v1/test_adapter.py']]"
      - run: python -m unittest -v runtime/motor_state_v1/test_adapter.py
