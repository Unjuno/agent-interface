name: GTK Xlib-backed bounded allocation #2851

on:
  pull_request:
    paths:
      - ".github/workflows/gtk-xlib-allocation-2851.yml"
      - "research/integration/**"
      - "runtime/**"
  push:
    branches:
      - "research/gtk-xlib-allocation-2851"

jobs:
  allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build additive GTK/Xlib image
        run: docker build --pull=false -f research/integration/gtk_fixture_dependency_2606_v3/Dockerfile -t agent-interface-gtk-fixture-v3:xlib-allocation .
      - name: Run one bounded allocation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gtk-xlib-allocation-out"
          docker image inspect agent-interface-gtk-fixture-v3:xlib-allocation > "$RUNNER_TEMP/gtk-xlib-allocation-out/image-inspect.json"
          git rev-parse HEAD > "$RUNNER_TEMP/gtk-xlib-allocation-out/source-commit.txt"
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp             -e PYTHONPATH=/workspace:/usr/lib/python3/dist-packages             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$RUNNER_TEMP/gtk-xlib-allocation-out:/out"             -w /workspace             agent-interface-gtk-fixture-v3:xlib-allocation             python3 /workspace/research/integration/golden_v3_second_domain_2246_v1/formal_matrix_runner.py             --out /out/raw > "$RUNNER_TEMP/gtk-xlib-allocation-out/runner.stdout" 2> "$RUNNER_TEMP/gtk-xlib-allocation-out/runner.stderr"
          code=$?
          printf '%s' "$code" > "$RUNNER_TEMP/gtk-xlib-allocation-out/exit-code.txt"
          if [ "$code" -eq 0 ]; then
            printf '%s\n' 'COMPLETED_UNSCORED_GTK_XLIB_ALLOCATION' > "$RUNNER_TEMP/gtk-xlib-allocation-out/decision.txt"
          else
            printf '%s\n' 'STOP_GTK_XLIB_ALLOCATION' > "$RUNNER_TEMP/gtk-xlib-allocation-out/decision.txt"
          fi
          exit 0
      - name: Upload retained allocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-xlib-allocation-2851
          path: ${{ runner.temp }}/gtk-xlib-allocation-out
          if-no-files-found: error
