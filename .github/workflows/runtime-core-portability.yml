name: Runtime Core Portability

on:
  push:
    branches:
      - integration/runtime-core-v1-20260917
  pull_request:
    paths:
      - 'runtime/core_v1/**'
      - '.github/workflows/runtime-core-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            runtime/core_v1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile promoted runtime core
        run: python -m compileall -q runtime/core_v1
      - name: Run deterministic contract tests
        run: python -m unittest discover -s runtime/core_v1 -p 'test_*.py' -v
      - name: Run side-effect-free platform doctor
        run: python -m runtime.core_v1.doctor
