name: focused-observation-container-successor
on:
  pull_request:
    paths: ["research/analysis/focused_observation_container_successor_2137_v1/**",".github/workflows/focused-observation-container-successor.yml"]
jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: One Docker formal run
        run: |
          docker run --rm -v "$PWD/research/analysis/focused_observation_container_successor_2137_v1:/work" -w /work python:3.12-slim python experiment.py
      - name: Independent audit from repository root
        run: docker run --rm -v "$PWD/research/analysis/focused_observation_container_successor_2137_v1:/work" -w /work python:3.12-slim python audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: focused-observation-container-successor
          path: research/analysis/focused_observation_container_successor_2137_v1/RAW_RESULT.json
