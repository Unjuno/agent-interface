name: golden-v3-cli-adapter-2203
on:
  push:
    paths: [research/integration/golden_v3_cli_adapter_2200_v1/**, .github/workflows/golden-v3-cli-adapter-2203.yml]
  pull_request:
    paths: [research/integration/golden_v3_cli_adapter_2200_v1/**, .github/workflows/golden-v3-cli-adapter-2203.yml]
jobs:
  audit:
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: python research/integration/golden_v3_cli_adapter_2200_v1/adapter_audit.py > result.json
      - run: python -c "import json; x=json.load(open('result.json')); assert x['decision']=='HOLD_ADAPTER_CONTRACT_NOT_SOURCE_BACKED'; assert x['authority_grants']==0; assert len(x['unverified_fields'])==4"
      - uses: actions/upload-artifact@v4
        with:
          name: golden-v3-cli-adapter-2203-result
          path: result.json
