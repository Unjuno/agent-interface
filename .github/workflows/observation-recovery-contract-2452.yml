name: observation-recovery-contract-2452
on:
  pull_request:
    paths:
      - "research/analysis/observation_recovery_contract_2452_v1/**"
      - ".github/workflows/observation-recovery-contract-2452.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile research/analysis/observation_recovery_contract_2452_v1/contract.py research/analysis/observation_recovery_contract_2452_v1/test_contract.py
      - run: cd research/analysis/observation_recovery_contract_2452_v1 && python -m unittest -v
