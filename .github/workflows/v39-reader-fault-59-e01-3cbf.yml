name: v39-reader-fault-59-e01-retention
on:
  pull_request:
    paths:
      - 'research/doom/v39_reader_fault_59_e01_20261004_3cbf/**'
      - '.github/workflows/v39-reader-fault-59-e01-3cbf.yml'
  push:
    branches: [main]
    paths:
      - 'research/doom/v39_reader_fault_59_e01_20261004_3cbf/**'
permissions:
  contents: read
jobs:
  saved-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Method tests and saved-byte verification only (no native replay)
        working-directory: research/doom/v39_reader_fault_59_e01_20261004_3cbf
        run: |
          python -B -m unittest -v test_core
          python -B verify_delivery.py
