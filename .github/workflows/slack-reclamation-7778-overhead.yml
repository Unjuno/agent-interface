name: Issue 7778 slack reclamation overhead sensitivity

on:
  pull_request:
    paths:
      - 'research/analysis/slack_reclamation_7778_dispatch_sensitivity_t0_20261005/**'
      - 'research/analysis/README.md'
      - 'research/analysis/check_index.py'
      - '.github/workflows/slack-reclamation-7778-overhead.yml'
  push:
    branches:
      - main
    paths:
      - 'research/analysis/slack_reclamation_7778_dispatch_sensitivity_t0_20261005/**'
      - 'research/analysis/README.md'
      - 'research/analysis/check_index.py'
      - '.github/workflows/slack-reclamation-7778-overhead.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test frozen slack-reclamation method and mutation controls
        run: python -B -m unittest discover -s research/analysis/slack_reclamation_7778_dispatch_sensitivity_t0_20261005 -p 'test_*.py' -v
      - name: Check retained analytical results are indexed
        run: python research/analysis/check_index.py
