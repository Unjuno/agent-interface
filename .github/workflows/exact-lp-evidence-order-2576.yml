name: exact lp evidence order 2576
on:
  pull_request:
    paths:
      - site/index.html
      - site/media/**
      - research/launch/lp_exact_evidence_order_2576_v1/**
      - .github/workflows/exact-lp-evidence-order-2576.yml
jobs:
  exact-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends chromium
      - run: python -m pip install --no-cache-dir playwright==1.57.0
      - run: python research/launch/lp_exact_evidence_order_2576_v1/experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: exact-lp-evidence-order-2576
          path: research/launch/lp_exact_evidence_order_2576_v1/artifacts/RESULT.json
