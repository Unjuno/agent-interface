name: MAP01 gate oracle shape fix r1

on:
  push:
    branches:
      - research/map01-gate-oracle-shape-fix-2346-r1
  pull_request:
    paths:
      - research/analysis/map01_matched_recovery_entry_gate_1866_r4/gate.py
      - .github/workflows/map01-gate-oracle-shape-fix-r1.yml

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned repaired classifier
        env:
          SOURCE_URL: https://raw.githubusercontent.com/Unjuno/agent-interface/dee3f3c40b6bbdecbaecff07e6b7bf1ffbaa4a6a/research/analysis/map01_matched_recovery_entry_gate_1866_r4/gate.py
        run: |
          python3 - <<'PY'
          import os, urllib.request
          data=urllib.request.urlopen(os.environ["SOURCE_URL"], timeout=30).read()
          open("/tmp/gate.py","wb").write(data)
          print("PINNED_SOURCE", os.environ["SOURCE_URL"])
          print("SOURCE_BYTES", len(data))
          PY
          python3 -m py_compile /tmp/gate.py
          python3 /tmp/gate.py

  container:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Fetch pinned repaired classifier
        env:
          SOURCE_URL: https://raw.githubusercontent.com/Unjuno/agent-interface/dee3f3c40b6bbdecbaecff07e6b7bf1ffbaa4a6a/research/analysis/map01_matched_recovery_entry_gate_1866_r4/gate.py
        run: |
          python - <<'PY'
          import os, urllib.request
          data=urllib.request.urlopen(os.environ["SOURCE_URL"], timeout=30).read()
          open("/tmp/gate.py","wb").write(data)
          print("PINNED_SOURCE", os.environ["SOURCE_URL"])
          print("SOURCE_BYTES", len(data))
          PY
          python -m py_compile /tmp/gate.py
          python /tmp/gate.py
