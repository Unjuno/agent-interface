name: staggered-subagent-orchestration-3158
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/coordination/staggered_subagent_orchestration_v1/**'
      - '.github/workflows/staggered-subagent-orchestration-3158.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p /tmp/staggered && python research/coordination/staggered_subagent_orchestration_v1/run.py /tmp/staggered
      - run: python research/coordination/staggered_subagent_orchestration_v1/audit.py /tmp/staggered | tee /tmp/staggered/audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: staggered-subagent-orchestration-3158
          path: /tmp/staggered/
