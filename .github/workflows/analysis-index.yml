name: Analysis Index

on:
  pull_request:
    paths:
      - 'research/analysis/**'
      - '.github/workflows/analysis-index.yml'
  push:
    branches:
      - main
    paths:
      - 'research/analysis/**'
      - '.github/workflows/analysis-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            research/analysis
            research/live_control/owner_keyup_keymap_witness_5156_t3_v1
            research/integration/core_admission_composition_57_20261003_01a0ff59
            research/integration/pr6863_review_rescue_20261003
            research/integration/pr6863_review_20261003_01a0ff58
            research/integration/teardown_witness_review_rescue_20261003
            research/integration/owner_keyup_teardown_witness_5156_01a0ff58
      - name: Restore the frozen workflow source for provenance tests
        run: |
          git fetch --no-tags --depth=1 origin e2e434dd07e1034c5c4303982a0b1ec33ea35cfd
          mkdir -p .github/workflows
          git show e2e434dd07e1034c5c4303982a0b1ec33ea35cfd:.github/workflows/analysis-index.yml > .github/workflows/analysis-index.yml
          printf '%s  %s\n' b19000e027e7379ef6c0122e3f8cfd0b2faacb4c54d985ab87d27c1be914f7c2 .github/workflows/analysis-index.yml | sha256sum --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test sparse-checkout archival dependency closure
        run: python -B -m unittest discover -s research/analysis -p 'test_analysis_checkout.py' -v
      - name: Check retained analytical results are indexed
        run: python research/analysis/check_index.py
      - name: Test Issue #8152 stochastic trace reducer construction
        run: python -B -m unittest discover -s research/analysis/stochastic_trace_reducer_8152_t0_20261005 -p 'test_*.py' -v
      - name: Test batched finite research T0 packages
        run: |
          python -B -m unittest discover -s research/analysis/object_bound_context_capsules_7160_t0_20261004 -p 'test_*.py' -v
          python -B -m unittest discover -s research/analysis/cue_triggered_intention_7162_t0_20261004 -p 'test_*.py' -v
          python -B -m unittest discover -s research/analysis/provenance_memory_authority_7167_t0_20261004 -p 'test_*.py' -v
          python -B -m unittest discover -s research/analysis/effect_safe_egraph_7462_t0_20261004 -p 'test_*.py' -v
      - name: Test Issue #7865 history-conditioned compensation T0 A02
        run: python -B -m unittest discover -s research/analysis/history_conditioned_compensation_7865_t0_a02_20261005 -p 'test_model_a02.py' -v
