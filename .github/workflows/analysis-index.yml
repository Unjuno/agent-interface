name: Analysis Index

on:
  pull_request:
    paths:
      - 'research/analysis/**'
      - '.github/workflows/analysis-index.yml'
  push:
    branches:
      - main
    paths:
      - 'research/analysis/**'
      - '.github/workflows/analysis-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            research/analysis
      - name: Restore the frozen workflow source for provenance tests
        run: |
          git fetch --no-tags --depth=1 origin e2e434dd07e1034c5c4303982a0b1ec33ea35cfd
          mkdir -p .github/workflows
          git show e2e434dd07e1034c5c4303982a0b1ec33ea35cfd:.github/workflows/analysis-index.yml > .github/workflows/analysis-index.yml
          printf '%s  %s\n' b19000e027e7379ef6c0122e3f8cfd0b2faacb4c54d985ab87d27c1be914f7c2 .github/workflows/analysis-index.yml | sha256sum --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check retained analytical results are indexed
        run: python research/analysis/check_index.py
      - name: Test #6749 corrected prefix-stability successor construction
        run: python -B -m unittest discover -s research/analysis/prefix_stability_6689_successor_6749_orbstack_20261003 -p 'test_*.py' -v
      - name: Test benign-error recovery-scope T0 assay
        run: python -B -m unittest discover -s research/analysis/benign_error_recovery_scope_6469_t0_20261002_v1 -p 'test_*.py' -v
      - name: Test denial-aware request policy T0
        run: python -B -m unittest discover -s research/analysis/denial_aware_request_policy_6422_t0_v1 -p 'test_*.py' -v
      - name: Test approval-sequence discrimination T0
        run: python -B -m unittest discover -s research/analysis/approval_sequence_discrimination_6405_t0_v1 -p 'test_*.py' -v
      - name: Test #6590 spatial-block overlap mutation challenge
        run: python -B -m unittest discover -s research/analysis/spatial_block_position_6590_t0_20261002/mutation_challenge_v1 -p 'test_*.py' -v
      - name: Test #6590 T1 geometry feasibility preflight
        run: python -B -m unittest discover -s research/analysis/spatial_block_position_6590_t1_geometry_feasibility_v1 -p 'test_*.py' -v
      - name: Test #6590 prospective geometry design screen
        run: python -B -m unittest discover -s research/analysis/spatial_block_position_6590_t1_geometry_design_v2 -p 'test_*.py' -v
      - name: Test endogenous-demand rebound T0
        run: python -B -m unittest discover -s research/analysis/endogenous_demand_rebound_5702_t0_v1 -p 'test_*.py' -v
      - name: Test selection-aware shadow-audit T1
        run: python -B -m unittest discover -s research/analysis/selection_aware_shadow_audit_5681_t1_v1 -p 'test_*.py' -v
      - name: Test human return-to-own-work T0 construction contract
        run: python -B -m unittest discover -s research/analysis/human_return_resumption_6492_t0_20261002 -p 'test_t0.py' -v
      - name: Test independent auditor corruption controls
        working-directory: research/analysis/human_return_resumption_6492_t0_20261002
        run: python -B -m unittest discover -s results/allocation-02 -p 'test_*.py' -v
      - name: Test immediate-modal baseline successor
        working-directory: research/analysis/human_return_resumption_6492_t0_20261002
        run: python -B -m unittest discover -s results/allocation-04-modal-baseline -p 'test_*.py' -v
      - name: Test semantic receipt target-binding T8 contract
        run: python -B -m unittest discover -s research/analysis/semantic_receipt_target_binding_5442_t8 -p 'test_*.py' -v
      - name: Test revision-timed cutover Issue #6617 T0
        run: python -B -m unittest discover -s research/analysis/revision_timed_cutover_6617_t0_v1 -p 'test_*.py' -v
      - name: Test disturbance-timescale #6604 T0 construction contract
        run: python -B -m unittest discover -s research/analysis/disturbance_timescale_6604_t0_v1 -p 'test_*.py' -v
      - name: Test Issue #6581 path-width constrained GUI fixture contract
        run: python -B -m unittest discover -s research/analysis/path_width_continuous_gui_6581_t0b_v1 -p 'test_*.py' -v
      - name: Test #6650 independent controller-law replay audit
        run: python -B -m unittest discover -s research/analysis/persistence_gated_throttle_6650_control_replay_20261002_01 -p 'test_*.py' -v
      - name: Test #5370 composed bounded inheritance T7
        run: python -B -m unittest discover -s research/analysis/priority_inheritance_5370_t7_composition_20261002_01 -p 'test_*.py' -v
