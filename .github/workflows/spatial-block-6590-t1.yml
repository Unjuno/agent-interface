name: Spatial block #6590 T1 construction

on:
  pull_request:
    paths:
      - 'research/analysis/spatial_block_position_6590_t1_orbstack_v1/**'
      - '.github/workflows/spatial-block-6590-t1.yml'
  push:
    branches:
      - main
    paths:
      - 'research/analysis/spatial_block_position_6590_t1_orbstack_v1/**'
      - '.github/workflows/spatial-block-6590-t1.yml'

permissions:
  contents: read

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Run #6590 geometry, pairing, and independent reconstruction tests
        run: python -B -m unittest discover -s research/analysis/spatial_block_position_6590_t1_orbstack_v1 -p 'test_*.py' -v
