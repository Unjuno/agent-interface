name: Issue 5260 A02 retained evidence

on:
  pull_request:
    paths:
      - 'research/integration/tk_firstchar_5260_a02_wslc_20261003/**'
      - '.github/workflows/tk-firstchar-5260-a02-retained.yml'
  push:
    branches: [main]
    paths:
      - 'research/integration/tk_firstchar_5260_a02_wslc_20261003/**'
      - '.github/workflows/tk-firstchar-5260-a02-retained.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/integration/tk_firstchar_5260_a02_wslc_20261003
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construction and custody gates
        run: python -B -m unittest discover -s research/integration/tk_firstchar_5260_a02_wslc_20261003 -p 'test_*.py' -v
      - name: Read-only retained validation (no formal rerun)
        run: python -B research/integration/tk_firstchar_5260_a02_wslc_20261003/verify_packet.py
