name: Golden route scope preflight v1

on:
  pull_request:
    paths:
      - 'research/analysis/golden_route_scope_preflight_2678/**'
      - 'research/integration/golden_v3_orbstack_2558_six_allocation_v1/RESULT.json'

permissions:
  contents: read

jobs:
  scope-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify retained component result cannot promote itself
        run: python research/analysis/golden_route_scope_preflight_2678/verify_scope.py
