name: generation-bound-provenance-audit-successor
on:
  pull_request:
    paths: ["research/analysis/generation_bound_evidence_provenance_audit_successor_2196_v1/**",".github/workflows/generation-bound-provenance-audit-successor.yml"]
jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: One fresh container run with path-safe provenance capture
        run: |
          ROOT=research/analysis/generation_bound_evidence_provenance_audit_successor_2196_v1
          PARENT=research/analysis/generation_bound_evidence_container_successor_2166_v1
          docker pull python:3.12-slim
          IMAGE_DIGEST=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')
          docker run --rm -v "$PWD/$PARENT:/work" -w /work python:3.12-slim python experiment.py > "$ROOT/stdout.txt"
          cp "$PARENT/RESULT.json" "$ROOT/RESULT.json"
          python3 - "$ROOT" "$PARENT" "$IMAGE_DIGEST" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); parent=Path(sys.argv[2]); image=sys.argv[3]
          p=root/"RESULT.json"
          out={"parent_experiment":"research/analysis/generation_bound_evidence_container_successor_2166_v1/experiment.py","parent_blob_sha":"2bcb877a2fbd59b2a854122017ff2956d8866524","source_sha256":hashlib.sha256((parent/"experiment.py").read_bytes()).hexdigest(),"image_digest":image,"stdout":(root/"stdout.txt").read_text(),"result_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"independent_audit":"PENDING","model":0,"x11":0,"input":0}
          (root/"PROVENANCE.json").write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          PY
      - name: Independent audit from repository root
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("research/analysis/generation_bound_evidence_provenance_audit_successor_2196_v1")
          p=json.loads((root/"RESULT.json").read_text())
          v=json.loads((root/"PROVENANCE.json").read_text())
          assert p["decision"]=="PASS_CONTAINER_REVALIDATION_SCOPED"
          assert p["statuses"]==["ENCODED","OBSOLETE","CACHE_HIT","ENCODED"]
          assert p["stale_control"]==p["reuse_control"]==p["provenance_control"]=="PASS"
          assert p["model"]==p["x11"]==p["input"]==0
          assert v["parent_blob_sha"]=="2bcb877a2fbd59b2a854122017ff2956d8866524"
          assert v["image_digest"].startswith("docker.io/library/python@sha256:")
          assert v["stdout"].strip()
          assert v["result_sha256"]==hashlib.sha256((root/"RESULT.json").read_bytes()).hexdigest()
          assert v["model"]==v["x11"]==v["input"]==0
          v["independent_audit"]="PASS"
          (root/"PROVENANCE.json").write_text(json.dumps(v,sort_keys=True,indent=2)+"\n")
          print("INDEPENDENT_PROVENANCE_AUDIT_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: generation-bound-provenance-audit-successor
          path: research/analysis/generation_bound_evidence_provenance_audit_successor_2196_v1/
