name: golden v3 cli adapter contract 2269
on:
  pull_request:
    paths:
      - "research/integration/golden_v3_cli_adapter_2203_v2/**"
      - ".github/workflows/golden-v3-cli-adapter-2269.yml"
jobs:
  contract:
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - name: Fetch immutable PR source bytes
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          mkdir -p research/integration/golden_v3_cli_adapter_2203_v2
          python - "${SHA}" <<'PY'
          import pathlib,sys,urllib.request
          sha=sys.argv[1]
          base=f"https://raw.githubusercontent.com/Unjuno/agent-interface/{sha}/research/integration/golden_v3_cli_adapter_2203_v2"
          out=pathlib.Path("research/integration/golden_v3_cli_adapter_2203_v2")
          for name in ("adapter.py","test_adapter.py"):
              with urllib.request.urlopen(f"{base}/{name}",timeout=30) as r:
                  (out/name).write_bytes(r.read())
          PY
      - run: python -m py_compile research/integration/golden_v3_cli_adapter_2203_v2/adapter.py research/integration/golden_v3_cli_adapter_2203_v2/test_adapter.py
      - working-directory: research/integration/golden_v3_cli_adapter_2203_v2
        run: python -m unittest -v
