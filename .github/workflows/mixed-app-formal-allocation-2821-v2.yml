name: Mixed-app formal allocation #2821 v2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/integration/mixed_app_long_session_2499/formal_session.py"
      - "research/integration/mixed_app_long_session_2499/Dockerfile"
      - ".github/workflows/mixed-app-formal-allocation-2821-v2.yml"

jobs:
  allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned runtime image with network available
        run: docker build --pull -f research/integration/mixed_app_long_session_2499/Dockerfile -t mixed-app-formal-2821:offline-runtime .
      - name: Run one Docker allocation with runtime network disabled
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/mixed-2499"
          docker run --rm --network none \
            -e DISPLAY=:141 \
            -v "$RUNNER_TEMP/mixed-2499:/out" \
            mixed-app-formal-2821:offline-runtime \
            2> "$RUNNER_TEMP/mixed-2499/stderr.log" | tee "$RUNNER_TEMP/mixed-2499/stdout.log" > "$RUNNER_TEMP/mixed-2499/result.json"
          rc=$?
          if [ ! -s "$RUNNER_TEMP/mixed-2499/result.json" ]; then
            printf '%s\n' '{"decision":"STOP_MIXED_APP_LONG_SESSION","reason":"runtime image or formal runner produced no result","container_exit":'$rc'}' > "$RUNNER_TEMP/mixed-2499/result.json"
          fi
          printf '%s\n' "$rc" > "$RUNNER_TEMP/mixed-2499/container_exit.txt"
          exit 0
      - name: Upload formal allocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-app-formal-allocation-2821-v3
          path: ${{ runner.temp }}/mixed-2499
          if-no-files-found: error