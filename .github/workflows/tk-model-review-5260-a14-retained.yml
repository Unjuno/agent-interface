name: Issue 5260 A14 retained model-review H_FAIL evidence
on:
  pull_request:
    paths:
      - 'research/integration/tk_model_review_5260_a14_wslc_20261004/**'
      - '.github/workflows/tk-model-review-5260-a14-retained.yml'
  push:
    branches: [main]
    paths:
      - 'research/integration/tk_model_review_5260_a14_wslc_20261004/**'
      - '.github/workflows/tk-model-review-5260-a14-retained.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-h-fail-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/integration/tk_model_review_5260_a14_wslc_20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and H_FAIL preservation regression tests
        working-directory: research/integration/tk_model_review_5260_a14_wslc_20261004
        run: python -B -m unittest discover -v
      - name: Read-only first H_FAIL preservation verification
        run: python -B research/integration/tk_model_review_5260_a14_wslc_20261004/verify_packet.py
