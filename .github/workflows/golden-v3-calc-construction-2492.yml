name: golden-v3-calc-construction-2492

on:
  workflow_dispatch:
  push:
    paths:
      - "research/integration/golden_v3_second_domain_2246_v1/construction_calc.py"
      - ".github/workflows/golden-v3-calc-construction-2492.yml"

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.12-slim-bookworm@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends xvfb libreoffice-calc
      - run: python -m pip install --no-cache-dir openpyxl python-xlib
      - run: python research/integration/golden_v3_second_domain_2246_v1/construction_calc.py | tee calc-construction-result.json
