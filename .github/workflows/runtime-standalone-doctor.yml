name: Runtime Standalone Doctor

on:
  push:
    branches:
      - integration/runtime-standalone-doctor-v1-20260917
  pull_request:
    paths:
      - 'runtime/distribution_v1/**'
      - '.github/workflows/runtime-standalone-doctor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-doctor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            runtime/core_v1
            runtime/interface_v1
            runtime/distribution_v1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile builder and runtime sources
        run: python -m compileall -q runtime/core_v1 runtime/interface_v1 runtime/distribution_v1
      - name: Run deterministic distribution tests
        run: python -m unittest -v runtime.distribution_v1.test_distribution
      - name: Build standalone doctor
        run: >-
          python -m runtime.distribution_v1.build
          --root .
          --out dist/agent-interface-doctor.pyz
          --manifest dist/MANIFEST.json
          --sums dist/SHA256SUMS
      - name: Verify exact artifact
        run: >-
          python -m runtime.distribution_v1.verify
          --root .
          --artifact dist/agent-interface-doctor.pyz
          --manifest dist/MANIFEST.json
          --expected runtime/distribution_v1/EXPECTED.json
      - name: Execute standalone doctor
        shell: python
        run: |
          import json, subprocess, sys
          data = json.loads(subprocess.check_output([sys.executable, 'dist/agent-interface-doctor.pyz'], text=True))
          assert data['support_claim'] is False
          assert data['ready_for_side_effects'] is False
          assert data['native_probe']['input_authority'] == 'none'
          assert data['native_probe']['capture_authority'] == 'none'
          print(json.dumps(data['native_probe'], sort_keys=True))
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: agent-interface-standalone-doctor-v1-${{ github.sha }}
          path: |
            dist/agent-interface-doctor.pyz
            dist/MANIFEST.json
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
