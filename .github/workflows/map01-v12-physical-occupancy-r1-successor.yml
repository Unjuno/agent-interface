name: MAP01 v12 physical occupancy R1 successor r5
# r3 dependency/import gate audit: workflow-only synchronization marker

on:
  pull_request:
    paths:
      - ".github/workflows/map01-v12-physical-occupancy-r1-successor.yml"
      - "research/doom/map01_v12_physical_occupancy_live_r1_v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map01-v12-physical-occupancy-r1-successor-r5
  cancel-in-progress: false

jobs:
  map01-r1-successor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install isolated X11 and ViZDoom runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xauth libgl1 libglu1-mesa libasound2t64
          python -m pip download --only-binary=:all: --dest /tmp/map01-wheels 'vizdoom==1.3.0' pillow 'python-xlib' numpy openpyxl
          python -m pip install --no-index --find-links /tmp/map01-wheels 'vizdoom==1.3.0' pillow 'python-xlib' numpy openpyxl

      - name: Reconstruct exact retained v12 source
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("research/live_control/p0_live_causal_effect_x11_v1")))
          from runner import reconstruct_v12
          out = Path("work/map01-r1/v12")
          out.mkdir(parents=True, exist_ok=False)
          print(reconstruct_v12(Path("."), out))
          PY

      - name: Static import-boundary gate
        env:
          MAP01_SOURCE_ROOT: ${{ github.workspace }}
          MAP01_V12_ROOT: ${{ github.workspace }}/work/map01-r1/v12
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          source = Path(os.environ["MAP01_SOURCE_ROOT"]).resolve()
          v12 = Path(os.environ["MAP01_V12_ROOT"]).resolve()
          experiment = source / "research/doom/map01_v12_physical_occupancy_live_r1_v1"
          for path in (
              source / "research/live_control",
              source / "research/observation_gating",
              source / "research/doom",
              v12,
              experiment,
          ):
              sys.path.insert(0, str(path))
          import doom_retained_input_backend_v3 as backend
          from map01_v12_transition_owner import InputOwner
          assert backend.InputOwner is not None
          assert InputOwner is not None
          print("MAP01_IMPORT_BOUNDARY_PASS")
          PY

      - name: Run frozen preflight
        run: |
          mkdir -p work/map01-r1
          python research/doom/map01_v12_physical_occupancy_live_r1_v1/preflight.py --source . --v12 work/map01-r1/v12 | tee work/map01-r1/PREFLIGHT.stdout

      - name: Record r5 preflight-only stop
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("work/map01-r1")
          root.mkdir(parents=True, exist_ok=True)
          (root / "STOP.json").write_text(json.dumps({"decision":"STOPPED_R5_PREFLIGHT_ONLY","construction_invocations":0,"formal_invocations":0,"reason":"r5 scope is import authority and frozen preflight only"}, indent=2) + "\n")
          PY
      - name: Upload retained successor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-v12-occupancy-successor-1967-${{ github.run_id }}
          path: work/map01-r1
          if-no-files-found: error
          retention-days: 30
