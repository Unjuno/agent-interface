name: MAP01 v12 physical occupancy R1 successor r2

on:
  pull_request:
    paths:
      - ".github/workflows/map01-v12-physical-occupancy-r1-successor.yml"
      - "research/doom/map01_v12_physical_occupancy_live_r1_v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map01-v12-physical-occupancy-r1-successor-r2
  cancel-in-progress: false

jobs:
  map01-r1-successor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install isolated X11 and ViZDoom runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xauth libgl1 libglu1-mesa libasound2t64
          python -m pip download --only-binary=:all: --dest /tmp/map01-wheels 'vizdoom==1.3.0' pillow 'python-xlib' numpy openpyxl
          python -m pip install --no-index --find-links /tmp/map01-wheels 'vizdoom==1.3.0' pillow 'python-xlib' numpy openpyxl

      - name: Reconstruct exact retained v12 source
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("research/live_control/p0_live_causal_effect_x11_v1")))
          from runner import reconstruct_v12
          out = Path("work/map01-r1/v12")
          out.mkdir(parents=True, exist_ok=False)
          print(reconstruct_v12(Path("."), out))
          PY

      - name: Static import-boundary gate
        env:
          MAP01_SOURCE_ROOT: ${{ github.workspace }}
          MAP01_V12_ROOT: ${{ github.workspace }}/work/map01-r1/v12
        run: |
          python - <<'PY'
          import runpy
          runpy.run_path(
              "research/doom/map01_v12_physical_occupancy_live_r1_v1/session_entry.py",
              run_name="__map01_import_gate__",
          )
          print("MAP01_IMPORT_BOUNDARY_PASS")
          PY

      - name: Run frozen preflight
        run: |
          mkdir -p work/map01-r1
          python research/doom/map01_v12_physical_occupancy_live_r1_v1/preflight.py --source . --v12 work/map01-r1/v12 | tee work/map01-r1/PREFLIGHT.stdout

      - name: Run one fresh construction allocation
        id: construction
        continue-on-error: true
        run: |
          mkdir -p work/map01-r1
          xvfb-run -a python research/doom/map01_v12_physical_occupancy_live_r1_v1/construction_runner.py --source . --v12 work/map01-r1/v12 --out work/map01-r1/construction | tee work/map01-r1/CONSTRUCTION.stdout

      - name: Run formal only after explicit construction PASS
        if: steps.construction.outcome == 'success' && hashFiles('work/map01-r1/construction/CONSTRUCTION_RESULT.json') != ''
        id: formal
        continue-on-error: true
        run: |
          xvfb-run -a python research/doom/map01_v12_physical_occupancy_live_r1_v1/formal_runner.py --source . --v12 work/map01-r1/v12 --out work/map01-r1/formal | tee work/map01-r1/FORMAL.stdout

      - name: Record successor stop
        if: always() && (steps.construction.outcome != 'success' || hashFiles('work/map01-r1/construction/CONSTRUCTION_RESULT.json') == '')
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("work/map01-r1")
          root.mkdir(parents=True, exist_ok=True)
          result = root / "construction" / "CONSTRUCTION_RESULT.json"
          payload = {
              "decision": "STOPPED_SUCCESSOR_CONSTRUCTION_NOT_PASS",
              "construction_result_present": result.exists(),
              "formal_invocations": 0,
              "reruns": 0,
              "replacements": 0,
              "tuning": 0,
              "reason": "formal is hard-gated on construction step success and explicit construction result",
          }
          (root / "STOP.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload retained successor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map01-v12-occupancy-successor-1967-${{ github.run_id }}
          path: work/map01-r1
          if-no-files-found: error
          retention-days: 30
