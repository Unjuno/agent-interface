name: Issue 5260 A09 retained private pipe evidence
on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'research/integration/tk_focus_pipe_5260_a09_wslc_20261004/**'
      - '.github/workflows/tk-pipe-5260-a09-retained.yml'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'research/integration/tk_focus_pipe_5260_a09_wslc_20261004/**'
      - '.github/workflows/tk-pipe-5260-a09-retained.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/integration/tk_focus_pipe_5260_a09_wslc_20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and retention tests
        working-directory: research/integration/tk_focus_pipe_5260_a09_wslc_20261004
        run: python -B -m unittest discover -s . -p 'test_*.py' -v
      - name: Read-only first outcome verification
        run: python -B research/integration/tk_focus_pipe_5260_a09_wslc_20261004/verify_packet.py
