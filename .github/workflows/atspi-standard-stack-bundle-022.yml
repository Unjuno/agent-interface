name: AT-SPI standard stack bundle 022
on:
  push:
    branches: [research/atspi-standard-stack-20260916-022]
    paths: ['.github/workflows/atspi-standard-stack-bundle-022.yml']
permissions:
  contents: read
concurrency:
  group: atspi-standard-stack-bundle-022
  cancel-in-progress: false
jobs:
  package-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact Debian AT-SPI core package only; no experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/root
          url='https://deb.debian.org/debian/pool/main/a/at-spi2-core/at-spi2-core_2.56.2-1+deb13u1_amd64.deb'
          curl -fsSL --retry 3 "$url" -o bundle/at-spi2-core_2.56.2-1+deb13u1_amd64.deb
          test "$(dpkg-deb -f bundle/at-spi2-core_2.56.2-1+deb13u1_amd64.deb Package)" = 'at-spi2-core'
          test "$(dpkg-deb -f bundle/at-spi2-core_2.56.2-1+deb13u1_amd64.deb Version)" = '2.56.2-1+deb13u1'
          test "$(dpkg-deb -f bundle/at-spi2-core_2.56.2-1+deb13u1_amd64.deb Architecture)" = 'amd64'
          dpkg-deb -x bundle/at-spi2-core_2.56.2-1+deb13u1_amd64.deb bundle/root
          test -x bundle/root/usr/libexec/at-spi-bus-launcher
          test -x bundle/root/usr/libexec/at-spi2-registryd
          sha256sum bundle/at-spi2-core_2.56.2-1+deb13u1_amd64.deb > bundle/SHA256SUMS
          dpkg-deb -f bundle/at-spi2-core_2.56.2-1+deb13u1_amd64.deb Package Version Architecture > bundle/package-metadata.txt
          find bundle/root -type f -printf '%P\n' | sort > bundle/extracted-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atspi-standard-stack-2.56.2-deb13u1
          path: bundle/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
