name: Mindustry v160.2 fixture acquisition #2624

on:
  push:
    branches:
      - acquire/mindustry-v1602-2624-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize and verify pinned fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture/mod/scripts
          url='https://github.com/Anuken/Mindustry/releases/download/v160.2/Mindustry.jar'
          curl --fail --location --retry 3 --retry-delay 2 --output fixture/Mindustry.jar "$url"
          test "$(stat -c %s fixture/Mindustry.jar)" = '87022576'
          echo '7f210295dfffb4c17b582b27bab41f4dde83f557f00f0877572fdac943f40539  fixture/Mindustry.jar' | sha256sum --check -

          cp research/benchmark_discovery/results/mindustry-reset-01/canonical.msav fixture/canonical.msav
          cp research/benchmark_discovery/mindustry_reset_mod_v1/mod.json fixture/mod/mod.json
          cp research/benchmark_discovery/mindustry_reset_mod_v1/scripts/main.js fixture/mod/scripts/main.js

          echo '8fff67b0c130ee59a3838c92754b73225a506902bd4838dcc3f1fb5be286cbed  fixture/canonical.msav' | sha256sum --check -
          echo '4b8e413ab0c4561c82edd8e422c517b631f1baee79a0b008adb42e9624965e05  fixture/mod/mod.json' | sha256sum --check -
          echo '7b5bd06bc34db9655e3946a9c202948cdaa0a4b233e0eec1fe063aa8358c220f  fixture/mod/scripts/main.js' | sha256sum --check -
          test "$(git hash-object fixture/canonical.msav)" = '7663b25633d853a257fbb407723fe85579120111'
          test "$(git hash-object fixture/mod/mod.json)" = '137ae8036b7864af744565bbc1c2af566290ea92'
          test "$(git hash-object fixture/mod/scripts/main.js)" = '84e9a0c291d5b7f454d6092f2c100728a9a16da2'

          {
            echo 'schema=mindustry-2624-premounted-fixture-v1'
            echo 'source_commit='${GITHUB_SHA}
            echo 'jar_url='"$url"
            echo 'jar_asset_id=559668837'
            echo 'jar_size='$(stat -c %s fixture/Mindustry.jar)
            echo 'jar_sha256='$(sha256sum fixture/Mindustry.jar | awk '{print $1}')
            echo 'save_size='$(stat -c %s fixture/canonical.msav)
            echo 'save_sha256='$(sha256sum fixture/canonical.msav | awk '{print $1}')
            echo 'save_git_blob='$(git hash-object fixture/canonical.msav)
            echo 'mod_json_sha256='$(sha256sum fixture/mod/mod.json | awk '{print $1}')
            echo 'mod_json_git_blob='$(git hash-object fixture/mod/mod.json)
            echo 'main_js_sha256='$(sha256sum fixture/mod/scripts/main.js | awk '{print $1}')
            echo 'main_js_git_blob='$(git hash-object fixture/mod/scripts/main.js)
          } > fixture/acquisition.txt
      - name: Upload exact premounted fixture
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-v1602-premounted-fixture-2624
          path: fixture
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
