name: Research proposal
description: Propose a falsifiable experiment or benchmark improvement.
title: "[experiment] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the idea is mature enough to test. If you only have the design idea, use the simpler Idea form instead.

        Frame the proposal so it can fail, not only succeed.
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis (H)
      description: What measurable claim should be falsified?
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Minimum test (T)
      description: Environment, tasks/data, sample size, changed variable, and stopping rule.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision rule (D)
      description: Exact PASS / FAIL / UNCERTAIN criterion.
    validations:
      required: true
  - type: textarea
    id: competing
    attributes:
      label: Competing explanation (C)
      description: How could an apparent win be misleading?
    validations:
      required: true
  - type: textarea
    id: uncertainty
    attributes:
      label: Uncertainty (U)
      description: Dominant error sources and scope limits.
    validations:
      required: true
