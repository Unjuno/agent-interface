name: Research harness bug
description: Report a reproducible correctness or benchmark-harness defect.
title: "[bug] "
labels: []
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, display server, app/version, Python version, relevant hardware/load.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the exact command and smallest non-sensitive trace possible.
    validations:
      required: true
