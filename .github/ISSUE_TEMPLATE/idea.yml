name: Idea
description: Suggest a simpler, more accurate, more reliable, or more token-efficient design.
title: "[idea] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Agent Interface is research-first. You do not need a finished benchmark or implementation to propose an idea.

        Strong ideas usually explain what information or work the current system is wasting, and why the proposed change could remove that waste without hiding information the agent actually needs.
  - type: dropdown
    id: benefit
    attributes:
      label: Primary expected benefit
      options:
        - Fewer model/image tokens
        - Higher correctness or precision
        - Lower latency or tail latency
        - Better recovery or reliability
        - Better generality or portability
        - Simpler architecture
        - Better benchmark or research methodology
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is being wasted or failing today?
      description: Describe the unnecessary observation, model call, serialization, action, retry, assumption, or source of error.
      placeholder: "Example: the model receives a new screenshot even when no task-relevant pixels changed."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: What should the interface/runtime do differently?
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Why should it help?
      description: Explain the mechanism. What work or uncertainty disappears, and what information is preserved?
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Smallest useful discriminator
      description: Optional. Suggest the simplest proof/invariant check, exhaustive case analysis, oracle comparison, or experiment that could show the idea is wrong.
  - type: textarea
    id: tradeoff
    attributes:
      label: Likely failure mode or tradeoff
      description: Optional. What could make this worse than the current approach?
